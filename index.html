  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0E5A36',
              dark: '#093D24',
              gold: '#E5A922',
              light: '#E2EFE7',
              surface: '#F6F8F6',
              tile: '#E7ECE8',
              lavender: '#E6DFF2'
            }
          },
          fontFamily: {
            sans: ['Cairo', 'Segoe UI', 'Tahoma', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #F6F8F6;
      color: #16211B;
      padding-bottom: 84px;
      overflow-x: hidden;
    }
    .tile-card {
      background-color: #E7ECE8;
      border-radius: 22px;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .tile-card:active { transform: scale(0.97); background-color: #DCE4DE; }
    .followup-card { background-color: #E6DFF2; border-radius: 22px; }
    .workflow-card { background-color: #E2EFE7; border-radius: 22px; }
    .m3-card {
      background: #FFFFFF;
      border: 1px solid #E2E8E4;
      border-radius: 20px;
      box-shadow: 0 1px 3px rgba(14, 90, 54, 0.05);
    }
    .btn-primary {
      background-color: #0E5A36;
      color: #FFFFFF;
      border-radius: 14px;
      font-weight: 700;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:active { background-color: #093D24; }
    .btn-tonal {
      background-color: #E2EFE7;
      color: #0E5A36;
      border-radius: 14px;
      font-weight: 700;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-gold {
      background-color: #FDF3DC;
      color: #8A5A00;
      border: 1px solid #F2D07E;
      border-radius: 14px;
      font-weight: 700;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .input-field {
      width: 100%;
      background: #F6F8F6;
      border: 1.5px solid #D3DDD7;
      border-radius: 13px;
      padding: 10px 12px;
      font-size: 14px;
      color: #16211B;
      outline: none;
    }
    .input-field:focus { border-color: #0E5A36; background: #FFFFFF; }
    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-block;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background: #FFF !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #printArea { display: block !important; }
    }
  </style>
</head>

// ==================== HARDWARE BACK BUTTON & HISTORY STACK ====================
let routeHistory = ['home'];
let isModalOpen = false;
let isDrawerOpen = false;
let lastExitAttempt = 0;

function initHistoryGuard() {
  try {
    history.replaceState({ page: 'home', depth: 0 }, '', '#home');
  } catch (e) {}

  window.addEventListener('popstate', () => {
    if (isModalOpen) {
      closeModal();
      pushGuardState(state.route);
      return;
    }
    if (isDrawerOpen) {
      closeDrawer();
      pushGuardState(state.route);
      return;
    }
    if (routeHistory.length > 1) {
      routeHistory.pop();
      const prevRoute = routeHistory[routeHistory.length - 1] || 'home';
      applyRoute(prevRoute, false);
      pushGuardState(prevRoute);
      return;
    }
    const now = Date.now();
    if (now - lastExitAttempt < 2000) {
      return;
    }
    lastExitAttempt = now;
    showToast('اضغط رجوع مرة أخرى للخروج من التطبيق');
    pushGuardState('home');
  });
}

function pushGuardState(route) {
  try {
    history.pushState({ page: route, t: Date.now() }, '', '#' + route);
  } catch (e) {}
}

function goBackStep() {
  if (isModalOpen) {
    closeModal();
    return;
  }
  if (isDrawerOpen) {
    closeDrawer();
    return;
  }
  if (routeHistory.length > 1) {
    routeHistory.pop();
    const prev = routeHistory[routeHistory.length - 1] || 'home';
    applyRoute(prev, false);
  } else if (state.route !== 'home') {
    applyRoute('home', false);
  }
}

// ==================== INDEXEDDB LAYER ====================
const DB_NAME = 'AgriPyramidsFieldOS_DB';
const DB_VERSION = 1;
const STORES = [
  'customers', 'products', 'warehouses', 'stock',
  'invoices', 'payments', 'returns', 'transfers',
  'stations', 'trials', 'visits', 'expenses', 'settings'
];

const TRIAL_STAGES = [
  'إنبات / مشتل',
  'نمو خضري',
  'تزهير وعقد',
  'جمع وحصاد',
  'موصى به للتسجيل ⭐',
  'مستبعد ❌'
];

let db = null;
let state = {
  route: 'home',
  salesTab: 'invoices',
  invTab: 'stock',
  trialsTab: 'stations',
  trialStationFilter: 'all',
  customerSearch: '',
  stockFilter: 'all',
  data: {}
};

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      STORES.forEach((s) => {
        if (!database.objectStoreNames.contains(s)) {
          database.createObjectStore(s, { keyPath: 'id' });
        }
      });
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = (e) => reject(e.target.error);
  });
}

function getAllStore(storeName) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function putRecord(storeName, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(obj);
    tx.oncomplete = () => resolve(obj);
    tx.onerror = (e) => reject(e.target.error);
  });
}

function deleteRecord(storeName, id) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
  });
}

function clearStore(storeName) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve();
  });
}

async function loadAllData() {
  for (const s of STORES) {
    state.data[s] = await getAllStore(s);
  }
}

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
}

function todayStr(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return d.toISOString().split('T')[0];
}

function fmtMoney(n) {
  return Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ج.م';
}

function showToast(msg) {
  const box = document.getElementById('toastBox');
  box.textContent = msg;
  box.classList.remove('hidden');
  setTimeout(() => box.classList.add('hidden'), 2600);
}

async function seedDemoIfNeeded() {
  const initialized = state.data.settings.find(x => x.id === 'app_meta');
  if (initialized) return;

  const w1 = { id: 'wh_main', name: 'المخزن الرئيسي - دمياط', location: 'كفر سعد' };
  const w2 = { id: 'wh_van', name: 'سيارة المندوب الميدانية', location: 'متحرك' };

// ==================== FINANCIAL & STOCK CALCULATIONS ====================
function getStockQty(warehouseId, productId) {
  const rec = state.data.stock.find(s => s.warehouseId === warehouseId && s.productId === productId);
  return rec ? Number(rec.qty || 0) : 0;
}

async function adjustStock(warehouseId, productId, delta) {
  const id = `${warehouseId}__${productId}`;
  const current = getStockQty(warehouseId, productId);
  await putRecord('stock', { id, warehouseId, productId, qty: Math.max(0, current + Number(delta)) });
}

function getProductTotalStock(productId) {
  return state.data.stock
    .filter(s => s.productId === productId)
    .reduce((sum, s) => sum + Number(s.qty || 0), 0);
}

function getCustomerBalance(customerId) {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return 0;
  let bal = Number(c.openingBalance || 0);
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => {
    bal += Number(i.total || 0) - Number(i.paidAmount || 0);
  });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => {
    bal -= Number(p.amount || 0);
  });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => {
    bal -= Number(r.total || 0);
  });
  return bal;
}

function getCustomerLedger(customerId, fromDate = '', toDate = '') {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return [];
  const entries = [];
  if (Number(c.openingBalance || 0) !== 0) {
    entries.push({
      date: '0000-00-00',
      displayDate: 'رصيد افتتاحي',
      type: 'افتتاحي',
      ref: 'رصيد أول المدة',
      debit: Number(c.openingBalance) > 0 ? Number(c.openingBalance) : 0,
      credit: Number(c.openingBalance) < 0 ? Math.abs(Number(c.openingBalance)) : 0
    });
  }
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => {
    entries.push({
      date: i.date,
      displayDate: i.date,
      type: 'فاتورة بيع',
      ref: i.number + (i.note ? ' - ' + i.note : ''),
      debit: Number(i.total || 0),
      credit: 0
    });
    if (Number(i.paidAmount || 0) > 0) {
      entries.push({
        date: i.date,
        displayDate: i.date,
        type: 'سداد مع الفاتورة',
        ref: i.number,
        debit: 0,
        credit: Number(i.paidAmount || 0)
      });
    }
  });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => {
    entries.push({
      date: p.date,
      displayDate: p.date,
      type: 'سند تحصيل',
      ref: p.note || p.method || 'تحصيل',
      debit: 0,
      credit: Number(p.amount || 0)
    });
  });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => {
    entries.push({
      date: r.date,
      displayDate: r.date,
      type: 'مرتجع مبيعات',
      ref: `${r.productName} (×${r.qty})` + (r.reason ? ' - ' + r.reason : ''),
      debit: 0,
      credit: Number(r.total || 0)
    });
  });

  entries.sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  return entries.map(e => {
    running += (e.debit - e.credit);
    return { ...e, balance: running };
  }).filter(e => {
    if (e.date === '0000-00-00') return true;
    if (fromDate && e.date < fromDate) return false;
    if (toDate && e.date > toDate) return false;
    return true;
  });
}

function getTreasuryBalance() {
  const cashFromInvoices = state.data.invoices.reduce((s, i) => s + Number(i.paidAmount || 0), 0);
  const cashFromPayments = state.data.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const cashRefunds = state.data.returns.filter(r => r.refundCash).reduce((s, r) => s + Number(r.total || 0), 0);
  const totalExpenses = state.data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  return cashFromInvoices + cashFromPayments - cashRefunds - totalExpenses;
}

// ==================== IMAGE COMPRESSION & GPS HELPERS ====================
function compressImageFile(file) {
  return new Promise((resolve) => {
    const origKB = Math.round(file.size / 1024);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1024;
        let w = img.width;
        let h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) {
          if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
          else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const compKB = Math.round((dataUrl.length * 3) / 4 / 1024);
        resolve({ dataUrl, origKB, compKB });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function captureGPS(latInputId, lngInputId, statusId) {
  const st = document.getElementById(statusId);
  if (!navigator.geolocation) {
    if (st) st.textContent = 'المتصفح لا يدعم تحديد الموقع';
    return;
  }
  if (st) st.textContent = 'جاري التقاط الإحداثيات...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById(latInputId).value = pos.coords.latitude.toFixed(6);
      document.getElementById(lngInputId).value = pos.coords.longitude.toFixed(6);
      if (st) st.textContent = `تم الالتقاط بدقة ${Math.round(pos.coords.accuracy)} متر`;
    },
    () => {
      if (st) st.textContent = 'تعذر الوصول للموقع — تأكد من تفعيل GPS';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function handleCustomerPhotoSelect(input) {
  if (!input.files || !input.files[0]) return;
  const stats = document.getElementById('custPhotoStats');
  stats.textContent = 'جاري ضغط الصورة...';
  const res = await compressImageFile(input.files[0]);
  tempCustomerPhoto = res.dataUrl;
  stats.textContent = `✓ تم الضغط: قبل ${res.origKB} KB ← بعد ${res.compKB} KB`;
  document.getElementById('custPhotoPreview').innerHTML = `<img src="${tempCustomerPhoto}" class="h-28 rounded-xl border mt-1 object-cover" />`;
}

async function saveCustomer(id) {
  const name = document.getElementById('cName').value.trim();
  if (!name) return showToast('يرجى إدخال اسم العميل');
  const obj = {
    id: id || uid('cust'),
    name,
    phone: document.getElementById('cPhone').value.trim(),
    area: document.getElementById('cArea').value.trim(),
    openingBalance: Number(document.getElementById('cOpen').value || 0),
    creditLimit: Number(document.getElementById('cLimit').value || 0),
    notes: document.getElementById('cNotes').value.trim(),
    photo: tempCustomerPhoto,
    lat: document.getElementById('cLat').value.trim(),
    lng: document.getElementById('cLng').value.trim()
  };
  await putRecord('customers', obj);
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ بيانات العميل بنجاح');
}

let draftInvoiceItems = [];
let editingInvoiceId = '';
let tempInvoicePhoto = '';

function openInvoiceModal(invoiceId = '') {
  if (state.data.customers.length === 0 || state.data.products.length === 0) {
    return showToast('أضف عميلاً وصنفاً واحداً على الأقل أولاً');
  }
  editingInvoiceId = invoiceId;
  const existing = state.data.invoices.find(x => x.id === invoiceId);
  if (existing) {
    draftInvoiceItems = existing.items.map(it => ({
      productId: it.productId,
      qty: Number(it.qty),
      price: Number(it.price)
    }));
    tempInvoicePhoto = existing.photo || '';
  } else {
    draftInvoiceItems = [{ productId: state.data.products[0].id, qty: 1, price: state.data.products[0].price }];
    tempInvoicePhoto = '';
  }
  renderInvoiceModalBody();
}

function renderInvoiceModalBody() {
  const existing = state.data.invoices.find(x => x.id === editingInvoiceId);
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  const modeVal = existing ? (existing.paymentMode || 'credit') : 'credit';

  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-[#0E5A36]">${existing ? `تعديل الفاتورة ${existing.number}` : 'فاتورة بيع جديدة'}</h3>
      <button onclick="closeModal()" class="text-gray-400 text-xl font-bold">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-1">العميل *</label>
          <select id="invCust" class="input-field">
            ${state.data.customers.map(c => `<option value="${c.id}" ${existing && existing.customerId===c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
          </select>

function updateDraftInvTotal() {

async function submitInvoice(bypassGuard) {
  const customerId = document.getElementById('invCust').value;
  const warehouseId = document.getElementById('invWh').value;
  const mode = document.getElementById('invMode').value;
  const note = document.getElementById('invNote').value.trim();
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  if (total <= 0) return showToast('يرجى إدخال كميات وأسعار صحيحة');

  let paidAmount = 0;
  if (mode === 'cash') paidAmount = total;
  else if (mode === 'partial') paidAmount = Math.min(total, Number(document.getElementById('invPaidAmt').value || 0));

  const oldInvoice = editingInvoiceId ? state.data.invoices.find(x => x.id === editingInvoiceId) : null;

  // Check stock availability considering restored quantities if editing same warehouse
  for (const row of draftInvoiceItems) {
    let avail = getStockQty(warehouseId, row.productId);
    if (oldInvoice && oldInvoice.warehouseId === warehouseId) {
      const oldQty = oldInvoice.items.filter(i => i.productId === row.productId).reduce((s, i) => s + Number(i.qty), 0);
      avail += oldQty;
    }
    if (row.qty > avail) {
      const p = state.data.products.find(x => x.id === row.productId);
      return showToast(`الرصيد لا يكفي للصنف (${p?.name}) — المتاح: ${avail}`);
    }
  }

  const cust = state.data.customers.find(c => c.id === customerId);
  let currentBal = getCustomerBalance(customerId);
  if (oldInvoice && oldInvoice.customerId === customerId) {
    currentBal -= (Number(oldInvoice.total) - Number(oldInvoice.paidAmount || 0));
  }
  const projectedBal = currentBal + (total - paidAmount);
  const hasOverdue = state.data.invoices.some(i =>
    i.id !== editingInvoiceId && i.customerId === customerId && (i.total - i.paidAmount) > 0 && i.date < todayStr(-30)
  );

  if (!bypassGuard && (total - paidAmount) > 0 && ((cust.creditLimit > 0 && projectedBal > cust.creditLimit) || hasOverdue)) {
    const box = document.getElementById('invGuardBox');
    box.classList.remove('hidden');
    box.innerHTML = `
      <div>⚠️ تحذير حارس الائتمان:</div>
      <div>${projectedBal > cust.creditLimit ? `• الرصيد بعد الفاتورة (${fmtMoney(projectedBal)}) سيتخطى الحد الائتماني (${fmtMoney(cust.creditLimit)}).` : ''}</div>
      <div>${hasOverdue ? '• العميل لديه فواتير آجلة متأخرة لأكثر من 30 يوماً.' : ''}</div>
      <button type="button" onclick="submitInvoice(true)" class="mt-2 bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs">تأكيد الاعتماد رغم التحذير</button>
    `;
    return;
  }

  // Reverse old invoice stock if editing
  if (oldInvoice) {
    for (const oldIt of oldInvoice.items) {
      await adjustStock(oldInvoice.warehouseId, oldIt.productId, Number(oldIt.qty));
    }
  }

  const items = draftInvoiceItems.map(row => {
    const p = state.data.products.find(x => x.id === row.productId);
    return {
      productId: row.productId,
      name: p ? p.name : '',
      qty: Number(row.qty),
      price: Number(row.price),
      subtotal: Number(row.qty) * Number(row.price)
    };
  });

  for (const it of items) {
    await adjustStock(warehouseId, it.productId, -it.qty);
  }

  await putRecord('invoices', {
    id: oldInvoice ? oldInvoice.id : uid('inv'),
    number: oldInvoice ? oldInvoice.number : ('INV-' + (1001 + state.data.invoices.length)),
    date: oldInvoice ? oldInvoice.date : todayStr(0),
    customerId,
    warehouseId,
    paymentMode: mode,
    paidAmount,
    total,
    note,
    photo: tempInvoicePhoto,
    items
  });

  editingInvoiceId = '';
  await loadAllData();
  closeModal();
  render();
  showToast(oldInvoice ? 'تم تعديل الفاتورة وتسوية المخزن والحسابات' : 'تم اعتماد الفاتورة وتحديث المخزن والحسابات');
}

async function saveTransfer() {
  const from = document.getElementById('trFrom').value;
  const to = document.getElementById('trTo').value;
  const prod = document.getElementById('trProd').value;
  const qty = Number(document.getElementById('trQty').value || 0);
  if (from === to) return showToast('اختر مخزنين مختلفين');
  const avail = getStockQty(from, prod);
  if (qty <= 0 || qty > avail) return showToast(`الرصيد المتاح في المخزن المصدر: ${avail}`);
  await adjustStock(from, prod, -qty);
  await adjustStock(to, prod, qty);
  await putRecord('transfers', { id: uid('tr'), date: todayStr(0), from, to, productId: prod, qty });
  await loadAllData();
  closeModal();
  render();
  showToast('تم التحويل المخزني بنجاح');
}

async function saveVisit() {
  const notes = document.getElementById('vNotes').value.trim();
  if (!notes) return showToast('أدخل ملاحظات الزيارة');
  const stationId = document.getElementById('vStation').value;
  const customerId = document.getElementById('vCust').value;
  const visitDate = todayStr(0);

  const checkedBoxes = Array.from(document.querySelectorAll('.v-trial-chk:checked'));
  const inspectedTrials = [];

  for (const chk of checkedBoxes) {
    const trialId = chk.value;
    const trial = state.data.trials.find(t => t.id === trialId);
    if (!trial) continue;
    const newStage = document.getElementById(`vtStage_${trialId}`)?.value || trial.stage || 'نمو خضري';
    const newScore = Math.min(5, Math.max(1, Number(document.getElementById(`vtScore_${trialId}`)?.value || calcTrialAvg(trial.scores))));
    const itemNote = document.getElementById(`vtNote_${trialId}`)?.value.trim() || notes;

    inspectedTrials.push({
      trialId: trial.id,
      code: trial.code,
      hybridName: trial.hybridName,
      stage: newStage,
      avgScore: newScore,
      note: itemNote
    });

    const history = Array.isArray(trial.history) ? [...trial.history] : [];
    history.push({
      date: visitDate,
      stage: newStage,
      avgScore: newScore,
      notes: itemNote,
      photo: tempCompressedPhoto || ''
    });

    trial.stage = newStage;
    trial.scores = {
      earliness: newScore,
      vigor: newScore,
      yield: newScore,
      tolerance: newScore
    };
    trial.notes = itemNote;
    trial.history = history;
    await putRecord('trials', trial);
  }

  await putRecord('visits', {
    id: uid('vis'),
    date: visitDate,
    customerId,
    stationId,
    crop: document.getElementById('vCrop').value.trim(),
    nextFollowUp: document.getElementById('vNext').value,
    inspectedTrials,
    notes,
    photo: tempCompressedPhoto
  });

  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ الزيارة وتحديث سجل المحطة والأصناف');
}

function calcTrialAvg(scores) {
  if (!scores) return 0;
  const vals = [scores.earliness, scores.vigor, scores.yield, scores.tolerance].map(Number);
  return (vals.reduce((a, b) => a + b, 0) / 4);
}

function getStationStatusBadge(status) {
  if (status === 'paused') return `<span class="badge-pill bg-amber-100 text-amber-800">⏸️ متوقفة مؤقتاً</span>`;
  if (status === 'closed') return `<span class="badge-pill bg-gray-200 text-gray-700">🏁 منتهية</span>`;
  return `<span class="badge-pill bg-emerald-100 text-emerald-800">🟢 نشطة</span>`;
}

      <div class="space-y-3">
        ${state.data.stations.length === 0 ? `<div class="m3-card p-6 text-center text-xs text-gray-500">لا توجد محطات مسجلة بعد</div>` :

async function saveStation(id = '') {
  const name = document.getElementById('stName').value.trim();
  if (!name) return showToast('أدخل اسم المحطة');
  const existing = state.data.stations.find(x => x.id === id) || {};
  await putRecord('stations', {
    ...existing,
    id: id || uid('sta'),
    name,
    owner: document.getElementById('stOwner').value.trim(),
    crop: document.getElementById('stCrop').value.trim(),
    area: document.getElementById('stArea').value.trim(),
    status: document.getElementById('stStatus').value,
    lat: document.getElementById('stLat').value.trim(),
    lng: document.getElementById('stLng').value.trim()
  });
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ بيانات محطة التجارب');
}

async function saveTrial(id = '') {
  const code = document.getElementById('tCode').value.trim();
  const hybridName = document.getElementById('tName').value.trim();
  if (!code || !hybridName) return showToast('أدخل كود واسم الهجين');

  const existing = state.data.trials.find(x => x.id === id) || {};

  if (!id) {
    const sampleEl = document.getElementById('tSampleProd');
    const sampleProd = sampleEl ? sampleEl.value : '';
    const sampleQty = Number(document.getElementById('tSampleQty')?.value || 0);
    if (sampleProd && sampleQty > 0 && state.data.warehouses[0]) {
      await adjustStock(state.data.warehouses[0].id, sampleProd, -sampleQty);
    }
  }

  const stage = document.getElementById('tStage').value;
  const scores = {
    earliness: Math.min(5, Math.max(1, Number(document.getElementById('scEar').value || 3))),
    vigor: Math.min(5, Math.max(1, Number(document.getElementById('scVig').value || 3))),
    yield: Math.min(5, Math.max(1, Number(document.getElementById('scYld').value || 3))),
    tolerance: Math.min(5, Math.max(1, Number(document.getElementById('scTol').value || 3)))
  };
  const notes = document.getElementById('tNotes').value.trim();
  const avg = calcTrialAvg(scores);

  const history = Array.isArray(existing.history) ? [...existing.history] : [];
  history.push({
    date: todayStr(0),
    stage,
    avgScore: avg,
    notes: notes || (id ? 'تحديث بيانات وتقييم الصنف' : 'تسجيل الصنف بالمحطة')
  });

  await putRecord('trials', {
    ...existing,
    id: id || uid('trl'),
    code,
    hybridName,
    stationId: document.getElementById('tStation').value,
    productId: document.getElementById('tInvPick').value || existing.productId || '',
    competitor: document.getElementById('tComp').value.trim(),
    plantingDate: existing.plantingDate || todayStr(0),
    stage,
    scores,
    notes,
    history
  });
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ الصنف وتحديث سجل المحطة');
}

async function saveExpense(id = '') {
  const amount = Number(document.getElementById('expAmt').value || 0);
  if (amount <= 0) return showToast('أدخل مبلغاً صحيحاً');
  const existing = state.data.expenses.find(x => x.id === id);
  await putRecord('expenses', {
    id: id || uid('exp'),
    date: existing ? existing.date : todayStr(0),
    category: document.getElementById('expCat').value,
    amount,
    note: document.getElementById('expNote').value.trim()
  });
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ المصروف');
}

async function deleteExpenseRecord(id) {
  await deleteRecord('expenses', id);
  await loadAllData();
  render();
  showToast('تم حذف المصروف وتحديث رصيد الخزينة');
}

// ==================== COMMAND CENTER (NET SALES AFTER RETURNS & PROFITABILITY) ====================
function renderCommand() {
  const grossSales = state.data.invoices.reduce((s, i) => s + Number(i.total || 0), 0);
  const totalReturns = state.data.returns.reduce((s, r) => s + Number(r.total || 0), 0);
  const netSales = Math.max(0, grossSales - totalReturns);

  const totalCollected = state.data.invoices.reduce((s, i) => s + Number(i.paidAmount || 0), 0)
    + state.data.payments.reduce((s, p) => s + Number(p.amount || 0), 0)
    - state.data.returns.filter(r => r.refundCash).reduce((s, r) => s + Number(r.total || 0), 0);
  const efficiency = netSales > 0 ? Math.min(100, Math.round((totalCollected / netSales) * 100)) : 100;

  // Estimate COGS & Net Profit
  const prodCostMap = {};
  state.data.products.forEach(p => prodCostMap[p.id] = Number(p.cost || 0));
  let totalCogs = 0;
  state.data.invoices.forEach(inv => {
    inv.items.forEach(it => {
      totalCogs += (prodCostMap[it.productId] || 0) * Number(it.qty || 0);
    });
  });
  state.data.returns.forEach(r => {
    totalCogs -= (prodCostMap[r.productId] || 0) * Number(r.qty || 0);
  });
  const totalExp = state.data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const netProfit = netSales - totalCogs - totalExp;

  const topCustomers = state.data.customers
    .map(c => {
      const cInv = state.data.invoices.filter(i => i.customerId === c.id).reduce((s, i) => s + Number(i.total || 0), 0);
      const cRet = state.data.returns.filter(r => r.customerId === c.id).reduce((s, r) => s + Number(r.total || 0), 0);
      return { name: c.name, sales: Math.max(0, cInv - cRet) };
    })
    .sort((a, b) => b.sales - a.sales)
    .slice(0, 4);
  const maxCustSale = Math.max(1, ...topCustomers.map(c => c.sales));

  return `
    <div class="grid grid-cols-2 gap-2.5">
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-gray-500">صافي المبيعات (بعد المرتجع)</div>
        <div class="text-base font-extrabold text-[#0E5A36]">${fmtMoney(netSales)}</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-gray-500">كفاءة التحصيل</div>
        <div class="text-base font-extrabold text-[#5E4B8B]">${efficiency}%</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-gray-500">صافي الربح التقديري</div>
        <div class="text-base font-extrabold ${netProfit >= 0 ? 'text-[#0E5A36]' : 'text-red-700'}">${fmtMoney(netProfit)}</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-gray-500">إجمالي المرتجعات</div>
        <div class="text-base font-extrabold text-amber-700">${fmtMoney(totalReturns)}</div>
      </div>
    </div>

    <div class="m3-card p-4 space-y-3">
      <div class="font-extrabold text-sm text-[#0E5A36]">أعلى العملاء مبيعاً (صافي)</div>
      ${topCustomers.map(c => `
        <div class="space-y-1 text-xs">
          <div class="flex justify-between font-bold">
            <span class="truncate">${c.name}</span>
            <span>${fmtMoney(c.sales)}</span>
          </div>
          <div class="w-full h-2.5 bg-[#E7ECE8] rounded-full overflow-hidden">
            <div class="h-full bg-[#0E5A36] rounded-full" style="width:${Math.round((c.sales / maxCustSale) * 100)}%"></div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

    csv += `"${c.name}","${c.phone||''}","${c.area||''}",${c.creditLimit||0},${getCustomerBalance(c.id)}\n`;

}

async function verifyAndResetDatabase() {
  const entered = document.getElementById('wipePwdInput').value.trim();
  const meta = state.data.settings.find(x => x.id === 'app_meta');
  const expectedPin = meta?.pinCode || '1234';
  if (entered !== expectedPin) {
    document.getElementById('wipePwdErr').textContent = '❌ كلمة السر غير صحيحة — تم إلغاء عملية المسح';
    return;
  }
  for (const s of STORES) {
    if (s !== 'warehouses' && s !== 'settings') await clearStore(s);
  }
  await loadAllData();
  closeModal();
  navigate('home');
  showToast('تم التحقق من كلمة السر ومسح قاعدة البيانات بنجاح');
}

async function exportFullBackup() {
  const payload = {
    app: 'AGRI_PYRAMIDS_FIELDOS',
    exportedAt: new Date().toISOString(),
    stores: state.data
  };
  downloadFile(JSON.stringify(payload, null, 2), `FieldOS_Backup_${todayStr(0)}.json`, 'application/json');
  const meta = state.data.settings.find(x => x.id === 'app_meta') || { id: 'app_meta', pinEnabled: false, pinCode: '1234' };
  meta.lastBackupAt = Date.now();
  await putRecord('settings', meta);
  await loadAllData();
  render();
  showToast('تم تصدير النسخة الاحتياطية بنجاح');
}

async function importFullBackup(input) {
  if (!input.files || !input.files[0]) return;
  const text = await input.files[0].text();
  try {
    const parsed = JSON.parse(text);
    if (!parsed.stores) throw new Error('invalid');
    for (const s of STORES) {
      if (Array.isArray(parsed.stores[s])) {
        await clearStore(s);
        for (const item of parsed.stores[s]) {
          await putRecord(s, item);
        }
      }
    }
    await loadAllData();
    render();
    showToast('تمت استعادة كافة البيانات بنجاح');
  } catch {
    showToast('ملف النسخة الاحتياطية غير صالح');
  }
}

async function togglePinLock(enabled) {
  const meta = state.data.settings.find(x => x.id === 'app_meta') || { id: 'app_meta', lastBackupAt: Date.now(), pinCode: '1234' };
  meta.pinEnabled = enabled;
  await putRecord('settings', meta);
  await loadAllData();
  showToast(enabled ? 'تم تفعيل قفل الحماية PIN' : 'تم إيقاف قفل الحماية');
}

async function updatePinCode() {
  const code = document.getElementById('newPinInput').value.trim();
  if (!/^\d{4}$/.test(code)) return showToast('أدخل 4 أرقام فقط');
  const meta = state.data.settings.find(x => x.id === 'app_meta') || { id: 'app_meta', lastBackupAt: Date.now(), pinEnabled: true };
  meta.pinCode = code;
  await putRecord('settings', meta);
  await loadAllData();
  showToast('تم تحديث الرقم السري وكلمة سر الحماية');
}

// ==================== PIN ENTRY LOGIC ====================
let enteredPin = '';
function checkPinOnStartup() {
  const meta = state.data.settings.find(x => x.id === 'app_meta');
  if (meta && meta.pinEnabled) {
    document.getElementById('pinOverlay').classList.remove('hidden');
    document.getElementById('pinOverlay').classList.add('flex');
  }
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pinDot' + i);
    dot.classList.toggle('bg-white', i < enteredPin.length);
  }
}

function enterPinDigit(d) {
  if (enteredPin.length >= 4) return;
  enteredPin += d;
  updatePinDots();
  if (enteredPin.length === 4) {
    const meta = state.data.settings.find(x => x.id === 'app_meta');
    if (enteredPin === (meta?.pinCode || '1234')) {
      document.getElementById('pinOverlay').classList.add('hidden');
      document.getElementById('pinOverlay').classList.remove('flex');
      enteredPin = '';
    } else {
      document.getElementById('pinError').textContent = 'الرمز غير صحيح';
      enteredPin = '';
      setTimeout(updatePinDots, 250);
    }
  }
}

function clearPinInput() {
  enteredPin = '';
  document.getElementById('pinError').textContent = '';
  updatePinDots();
}

function backspacePin() {
  enteredPin = enteredPin.slice(0, -1);
  updatePinDots();
}
