<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0E5A36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AGRI PYRAMIDS • FieldOS v8</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-app: #F4F7F5;
      --bg-card: #FFFFFF;
      --bg-tile: #E6ECE8;
      --bg-subtle: #EFF4F1;
      --border-color: #DCE5DF;
      --text-main: #121E17;
      --text-muted: #4A5D52;
      --brand: #0E5A36;
      --brand-dark: #083B22;
      --brand-soft: #E0EFE6;
      --gold: #D99B16;
      --gold-soft: #FDF3DC;
      --lavender-soft: #EAE3F5;
      --lavender-text: #3B285C;
      --font-weight-base: 600;
    }

    body.theme-sunlight {
      --bg-app: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-tile: #E2ECE6;
      --bg-subtle: #EDF3EF;
      --border-color: #0E5A36;
      --text-main: #000000;
      --text-muted: #112419;
      --brand: #084729;
      --brand-dark: #042917;
      --brand-soft: #D1E7DA;
      --font-weight-base: 700;
    }

    body.theme-dark {
      --bg-app: #0E1512;
      --bg-card: #16211C;
      --bg-tile: #1D2B24;
      --bg-subtle: #111A16;
      --border-color: #283A31;
      --text-main: #EDF4F0;
      --text-muted: #9EB3A7;
      --brand: #26A66B;
      --brand-dark: #1B8252;
      --brand-soft: #183628;
      --gold: #F2B938;
      --gold-soft: #2E2510;
      --lavender-soft: #251E33;
      --lavender-text: #D7C7F2;
      --font-weight-base: 600;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-weight: var(--font-weight-base);
      font-variant-numeric: tabular-nums;
      padding-bottom: 130px;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-header {
      background-color: var(--bg-card);
      border-bottom: 1.5px solid var(--border-color);
    }
    .tile-card {
      background-color: var(--bg-tile);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .tile-card:active { transform: scale(0.96); }
    .followup-card {
      background-color: var(--lavender-soft);
      color: var(--lavender-text);
      border-radius: 22px;
    }
    .workflow-card {
      background-color: var(--brand-soft);
      border-radius: 22px;
    }
    .m3-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .subtle-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }
    .text-muted-dyn { color: var(--text-muted); }
    .text-brand-dyn { color: var(--brand); }
    .bg-brand-dyn { background-color: var(--brand); }
    .bg-brand-soft-dyn { background-color: var(--brand-soft); color: var(--brand); }

    .btn-primary {
      background-color: var(--brand);
      color: #FFFFFF;
      border-radius: 14px;
      font-weight: 800;
      min-height: 46px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:active { background-color: var(--brand-dark); transform: scale(0.98); }
    .btn-tonal {
      background-color: var(--brand-soft);
      color: var(--brand);
      border-radius: 14px;
      font-weight: 800;
      min-height: 42px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-gold {
      background-color: var(--gold-soft);
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 14px;
      font-weight: 800;
      min-height: 40px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .input-field {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      min-height: 44px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }
    .input-field:focus { border-color: var(--brand); background-color: var(--bg-card); }
    .badge-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .stepper-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: var(--brand-soft);
      color: var(--brand);
      font-size: 17px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:active { transform: scale(0.92); }
    .fab-btn {
      position: fixed;
      bottom: 84px;
      left: 16px;
      z-index: 32;
      background: linear-gradient(135deg, #0E5A36, #157A4A);
      color: #FFFFFF;
      border-radius: 999px;
      height: 48px;
      padding: 0 16px;
      box-shadow: 0 6px 18px rgba(14, 90, 54, 0.35);
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 13px;
    }
    .fab-btn:active { transform: scale(0.95); }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: #FFF !important; color: #000 !important; padding: 0 !important; margin: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      #printArea { display: block !important; padding: 0 !important; }
    }
  </style>
</head>

// ==================== THEME & DISPLAY MODE ====================
const THEMES = ['normal', 'sunlight', 'dark'];
const THEME_ICONS = { normal: '☀️', sunlight: '🔆', dark: '🌙' };
const THEME_NAMES = { normal: 'الوضع القياسي', sunlight: 'وضع التباين العالي للشمس', dark: 'الوضع الليلي' };
let currentTheme = localStorage.getItem('fieldos_theme') || 'normal';

function applyTheme(mode) {
  currentTheme = THEMES.includes(mode) ? mode : 'normal';
  document.body.classList.remove('theme-sunlight', 'theme-dark');
  if (currentTheme === 'sunlight') document.body.classList.add('theme-sunlight');
  if (currentTheme === 'dark') document.body.classList.add('theme-dark');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = THEME_ICONS[currentTheme];
  localStorage.setItem('fieldos_theme', currentTheme);
}

function cycleThemeMode() {
  const next = THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length];
  applyTheme(next);
  showToast(`تم التبديل إلى: ${THEME_NAMES[next]}`);
}

// ==================== HARDWARE BACK BUTTON & HISTORY STACK ====================
let routeHistory = ['home'];
let isModalOpen = false;
let isDrawerOpen = false;
let lastExitAttempt = 0;

function initHistoryGuard() {
  try {
    history.replaceState({ page: 'home', depth: 0 }, '', '#home');
  } catch (e) {}

  window.addEventListener('popstate', () => {
    if (isModalOpen) {
      closeModal();
      pushGuardState(state.route);
      return;
    }
    if (isDrawerOpen) {
      closeDrawer();
      pushGuardState(state.route);
      return;
    }
    if (routeHistory.length > 1) {
      routeHistory.pop();
      const prevRoute = routeHistory[routeHistory.length - 1] || 'home';
      applyRoute(prevRoute, false);
      pushGuardState(prevRoute);
      return;
    }
    const now = Date.now();
    if (now - lastExitAttempt < 2000) {
      return;
    }
    lastExitAttempt = now;
    showToast('اضغط رجوع مرة أخرى للخروج من التطبيق');
    pushGuardState('home');
  });
}

function pushGuardState(route) {
  try {
    history.pushState({ page: route, t: Date.now() }, '', '#' + route);
  } catch (e) {}
}

function goBackStep() {
  if (isModalOpen) {
    closeModal();
    return;
  }
  if (isDrawerOpen) {
    closeDrawer();
    return;
  }
  if (routeHistory.length > 1) {
    routeHistory.pop();
    const prev = routeHistory[routeHistory.length - 1] || 'home';
    applyRoute(prev, false);
  } else if (state.route !== 'home') {
    applyRoute('home', false);
  }
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      STORES.forEach((s) => {
        if (!database.objectStoreNames.contains(s)) {
          database.createObjectStore(s, { keyPath: 'id' });
        }
      });
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = (e) => reject(e.target.error);
  });
}

function getAllStore(storeName) {
  return new Promise((resolve) => {
    if (!db.objectStoreNames.contains(storeName)) return resolve([]);
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function putRecord(storeName, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(obj);
    tx.oncomplete = () => resolve(obj);
    tx.onerror = (e) => reject(e.target.error);
  });
}

function deleteRecord(storeName, id) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
  });
}

function clearStore(storeName) {
  return new Promise((resolve) => {
    if (!db.objectStoreNames.contains(storeName)) return resolve();
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve();
  });
}

async function loadAllData() {
  for (const s of STORES) {
    state.data[s] = await getAllStore(s);
  }
}

async function logAudit(action, entity, details) {
  await putRecord('audit_log', {
    id: uid('aud'),
    timestamp: new Date().toLocaleString('ar-EG'),
    iso: new Date().toISOString(),
    action,
    entity,
    details
  });
}

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
}

function todayStr(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return d.toISOString().split('T')[0];
}

function fmtMoney(n) {
  return Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ج.م';
}

let idleLockTimer = null;
function resetIdleLockTimer() {
  if (idleLockTimer) clearTimeout(idleLockTimer);
  const cfg = getAppConfig();
  if (cfg.pinEnabled && cfg.autoLockMinutes > 0) {
    idleLockTimer = setTimeout(() => {
      document.getElementById('pinOverlay')?.classList.remove('hidden');
      document.getElementById('pinOverlay')?.classList.add('flex');
    }, cfg.autoLockMinutes * 60000);
  }
}
['click', 'touchstart', 'keydown'].forEach(evt => {
  window.addEventListener(evt, resetIdleLockTimer, { passive: true });
});

// ==================== TOAST WITH UNDO SUPPORT ====================
let toastTimer = null;
function showToast(msg, undoCallback = null) {
  const box = document.getElementById('toastBox');
  const msgEl = document.getElementById('toastMsg');
  const undoBtn = document.getElementById('toastUndoBtn');
  msgEl.textContent = msg;
  if (undoCallback) {
    undoBtn.classList.remove('hidden');
    undoBtn.onclick = async () => {
      box.classList.add('hidden');
      box.classList.remove('flex');
      await undoCallback();
    };
  } else {
    undoBtn.classList.add('hidden');
  }
  box.classList.remove('hidden');
  box.classList.add('flex');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    box.classList.add('hidden');
    box.classList.remove('flex');
  }, undoCallback ? 5000 : 2800);
}

// ==================== VOICE-TO-TEXT DICTATION ====================
function startVoiceDictation(targetInputId, btnEl) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    return showToast('الإملاء الصوتي غير مدعوم في هذا المتصفح');
  }
  const rec = new SpeechRec();
  rec.lang = 'ar-EG';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  const origHtml = btnEl.innerHTML;
  btnEl.innerHTML = '🔴 استماع...';
  btnEl.classList.add('bg-red-100', 'text-red-700');

  rec.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    const field = document.getElementById(targetInputId);
    if (field) {
      field.value = (field.value ? field.value + ' ' : '') + transcript;
    }
  };
  rec.onerror = () => {
    showToast('تعذر التقاط الصوت — تأكد من إذن الميكروفون');
  };
  rec.onend = () => {
    btnEl.innerHTML = origHtml;
    btnEl.classList.remove('bg-red-100', 'text-red-700');
  };
  rec.start();
}

function openBarcodeScannerModal(onDetectedCallbackName) {
  if (!('BarcodeDetector' in window)) {
    return showToast('قارئ الباركود بالكاميرا غير مدعوم على هذا المتصفح — اختر الصنف من القائمة');
  }
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-brand-dyn">📷 مسح كود العبوة بالكاميرا</h3>
      <button onclick="stopBarcodeStream(); closeModal();" class="text-muted-dyn text-xl font-bold">✕</button>
    </div>
    <video id="barcodeVideo" autoplay playsinline class="w-full h-56 object-cover rounded-2xl bg-black mb-2"></video>
    <p class="text-[11px] text-center text-muted-dyn">وجّه الكاميرا نحو باركود أو QR الباكت...</p>
  `);
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    window._activeBarcodeStream = stream;
    const video = document.getElementById('barcodeVideo');
    if (video) video.srcObject = stream;
    const detector = new BarcodeDetector();
    const scanLoop = async () => {
      if (!window._activeBarcodeStream || !document.getElementById('barcodeVideo')) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length > 0) {
          const val = codes[0].rawValue;
          stopBarcodeStream();
          closeModal();
          if (typeof window[onDetectedCallbackName] === 'function') {
            window[onDetectedCallbackName](val);
          }
          return;
        }
      } catch (e) {}
      requestAnimationFrame(scanLoop);
    };
    requestAnimationFrame(scanLoop);
  }).catch(() => {
    closeModal();
    showToast('تعذر فتح الكاميرا — تأكد من صلاحية الكاميرا');
  });
}

function stopBarcodeStream() {
  if (window._activeBarcodeStream) {
    window._activeBarcodeStream.getTracks().forEach(t => t.stop());
    window._activeBarcodeStream = null;
  }
}

// ==================== GEO-PROXIMITY AUTO-SUGGEST ====================
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (v) => (v * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function detectNearbyLocation(bannerId) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      let nearest = null;

      state.data.stations.forEach(s => {
        if (s.lat && s.lng) {
          const d = calcDistanceMeters(uLat, uLng, Number(s.lat), Number(s.lng));
          if (d <= 2500 && (!nearest || d < nearest.dist)) {
            nearest = { type: 'station', id: s.id, name: s.name, dist: Math.round(d) };
          }
        }
      });

      state.data.customers.forEach(c => {
        if (c.lat && c.lng) {
          const d = calcDistanceMeters(uLat, uLng, Number(c.lat), Number(c.lng));
          if (d <= 2500 && (!nearest || d < nearest.dist)) {
            nearest = { type: 'customer', id: c.id, name: c.name, dist: Math.round(d) };
          }
        }
      });

      const banner = document.getElementById(bannerId);
      if (banner && nearest) {
        banner.classList.remove('hidden');
        banner.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div>
              <div class="font-extrabold text-brand-dyn">📍 موقع قريب مكتشف تلقائياً:</div>
              <div>أنت على بُعد <strong>${nearest.dist} متر</strong> من (${nearest.name})</div>
            </div>
            <button type="button" onclick="applyNearbyMatch('${nearest.type}', '${nearest.id}')" class="btn-primary text-[11px] py-1.5 px-3 min-h-0">اختيار</button>
          </div>
        `;
      }
    },
    () => {},
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
  );
}

function applyNearbyMatch(type, id) {
  if (type === 'station') {
    const sel = document.getElementById('vStation');
    if (sel) {
      sel.value = id;
      renderStationTrialCheckboxes(id);
    }
  } else if (type === 'customer') {
    const sel = document.getElementById('vCust');
    if (sel) sel.value = id;
  }
  showToast('تم تحديد الموقع تلقائياً');
}

// ==================== FINANCIAL & STOCK CALCULATIONS ====================
function getStockQty(warehouseId, productId) {
  const rec = state.data.stock.find(s => s.warehouseId === warehouseId && s.productId === productId);
  return rec ? Number(rec.qty || 0) : 0;
}

async function adjustStock(warehouseId, productId, delta, movementType = 'حركة مخزنية', note = '') {
  const id = `${warehouseId}__${productId}`;
  const current = getStockQty(warehouseId, productId);
  const nextQty = Math.max(0, current + Number(delta));
  await putRecord('stock', { id, warehouseId, productId, qty: nextQty });
  if (Number(delta) !== 0) {
    await putRecord('stock_movements', {
      id: uid('mov'),
      date: todayStr(0),
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      warehouseId,
      productId,
      delta: Number(delta),
      balanceAfter: nextQty,
      type: movementType,
      note
    });
  }
}

function getProductTotalStock(productId) {
  return state.data.stock
    .filter(s => s.productId === productId)
    .reduce((sum, s) => sum + Number(s.qty || 0), 0);
}

function getCustomerBalance(customerId) {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return 0;
  let bal = Number(c.openingBalance || 0);
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => {
    bal += Number(i.total || 0) - Number(i.paidAmount || 0);
  });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => {
    bal -= Number(p.amount || 0);
  });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => {
    bal -= Number(r.total || 0);
  });
  return bal;
}

function getCustomerOldestUnpaidDays(customerId) {
  const bal = getCustomerBalance(customerId);
  if (bal <= 0) return 0;
  const unpaidInvs = state.data.invoices
    .filter(i => i.customerId === customerId && (Number(i.total) - Number(i.paidAmount || 0)) > 0)
    .map(i => i.date)
    .sort();
  if (unpaidInvs.length === 0) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(unpaidInvs[0]).getTime()) / 86400000));
}

function isCustomerOverdue(customerId) {
  const cfg = getAppConfig();
  return getCustomerOldestUnpaidDays(customerId) > cfg.overdueDays;
}

function getCustomerLedger(customerId, fromDate = '', toDate = '') {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return [];
  const entries = [];
  if (Number(c.openingBalance || 0) !== 0) {
    entries.push({
      date: '0000-00-00',
      displayDate: 'رصيد افتتاحي',
      type: 'افتتاحي',
      ref: 'رصيد أول المدة',
      debit: Number(c.openingBalance) > 0 ? Number(c.openingBalance) : 0,
      credit: Number(c.openingBalance) < 0 ? Math.abs(Number(c.openingBalance)) : 0
    });
  }
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => {
    entries.push({
      date: i.date,
      displayDate: i.date,
      type: 'فاتورة بيع',
      ref: i.number + (i.note ? ' - ' + i.note : ''),
      debit: Number(i.total || 0),
      credit: 0
    });
    if (Number(i.paidAmount || 0) > 0) {
      entries.push({
        date: i.date,
        displayDate: i.date,
        type: 'سداد مع الفاتورة',
        ref: i.number,
        debit: 0,
        credit: Number(i.paidAmount || 0)
      });
    }
  });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => {
    entries.push({
      date: p.date,
      displayDate: p.date,
      type: 'سند تحصيل',
      ref: p.note || p.method || 'تحصيل',
      debit: 0,
      credit: Number(p.amount || 0)
    });
  });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => {
    entries.push({
      date: r.date,
      displayDate: r.date,
      type: 'مرتجع مبيعات',
      ref: `${r.productName} (×${r.qty})` + (r.reason ? ' - ' + r.reason : ''),
      debit: 0,
      credit: Number(r.total || 0)
    });
  });

  entries.sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  return entries.map(e => {
    running += (e.debit - e.credit);
    return { ...e, balance: running };
  }).filter(e => {
    if (e.date === '0000-00-00') return true;
    if (fromDate && e.date < fromDate) return false;
    if (toDate && e.date > toDate) return false;
    return true;
  });
}

// ==================== UNIFIED TREASURY + SEPARATE POCKETS ====================
function getUnifiedTreasuryEntries(fromDate = '', toDate = '') {
  const entries = [];

  state.data.payments.forEach(p => {
    const c = state.data.customers.find(x => x.id === p.customerId);
    entries.push({
      id: p.id,
      sourceStore: 'payments',
      pocket: 'collections',
      date: p.date,
      direction: 'in',
      type: 'سند تحصيل عميل',
      title: c ? c.name : 'عميل',
      sub: `${p.method || 'نقدي'}${p.note ? ' • ' + p.note : ''}`,
      amount: Number(p.amount || 0)
    });
  });

  state.data.invoices.filter(i => Number(i.paidAmount || 0) > 0).forEach(i => {
    const c = state.data.customers.find(x => x.id === i.customerId);
    entries.push({
      id: i.id,
      sourceStore: 'invoices',
      pocket: 'collections',
      date: i.date,
      direction: 'in',
      type: 'سداد مع فاتورة',
      title: `${i.number} • ${c ? c.name : ''}`,
      sub: i.paymentMode === 'cash' ? 'فاتورة نقدية' : 'دفعة مقدمة مع الفاتورة',
      amount: Number(i.paidAmount || 0)
    });
  });

  (state.data.cash_handovers || []).forEach(h => {
    entries.push({
      id: h.id,
      sourceStore: 'cash_handovers',
      pocket: h.direction === 'in' ? 'petty_cash' : 'collections',
      date: h.date,
      direction: h.direction === 'in' ? 'in' : 'out',
      type: h.direction === 'in' ? 'استلام عهدة من الشركة' : 'توريد نقدية للشركة',
      title: h.direction === 'in' ? 'تغذية عهدة مصاريف' : 'توريد تحصيلات للشركة',
      sub: `${h.method || ''}${h.note ? ' • ' + h.note : ''}`,
      amount: Number(h.amount || 0)
    });
  });

  state.data.expenses.forEach(e => {
    entries.push({
      id: e.id,
      sourceStore: 'expenses',
      pocket: 'petty_cash',
      date: e.date,
      direction: 'out',
      type: 'مصروف ميداني',
      title: e.category,
      sub: e.note || '',
      amount: Number(e.amount || 0)
    });
  });

  state.data.returns.filter(r => r.refundCash).forEach(r => {
    const c = state.data.customers.find(x => x.id === r.customerId);
    entries.push({
      id: r.id,
      sourceStore: 'returns',
      pocket: 'collections',
      date: r.date,
      direction: 'out',
      type: 'رد نقدي لمرتجع',
      title: c ? c.name : 'عميل',
      sub: `${r.productName} (×${r.qty})`,
      amount: Number(r.total || 0)
    });
  });

  entries.sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  return entries.map(e => {
    running += (e.direction === 'in' ? e.amount : -e.amount);
    return { ...e, runningBalance: running };
  }).filter(e => {
    if (fromDate && e.date < fromDate) return false;
    if (toDate && e.date > toDate) return false;
    return true;
  });
}

function getTreasuryBreakdown() {
  const all = getUnifiedTreasuryEntries();
  const totalBalance = all.length > 0 ? all[all.length - 1].runningBalance : 0;
  const collectionsPocket = all
    .filter(e => e.pocket === 'collections')
    .reduce((s, e) => s + (e.direction === 'in' ? e.amount : -e.amount), 0);
  const pettyCashPocket = all
    .filter(e => e.pocket === 'petty_cash')
    .reduce((s, e) => s + (e.direction === 'in' ? e.amount : -e.amount), 0);
  return { totalBalance, collectionsPocket, pettyCashPocket };
}

function getTreasuryBalance() {
  return getTreasuryBreakdown().totalBalance;
}

// ==================== SHARE RECEIPT AS PNG IMAGE (CANVAS GENERATOR) ====================
async function shareReceiptAsImage(type, recordId) {
  const cfg = getAppConfig();
  const canvas = document.createElement('canvas');
  canvas.width = 760;
  canvas.height = 920;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Header Banner
  ctx.fillStyle = '#0E5A36';
  ctx.fillRect(0, 0, canvas.width, 130);

  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'right';
  ctx.font = 'bold 28px Cairo, Tahoma, sans-serif';
  ctx.fillText(cfg.companyName, 720, 56);
  ctx.font = 'bold 18px Cairo, Tahoma, sans-serif';
  ctx.fillStyle = '#BBF7D0';

  if (type === 'invoice') {
    const inv = state.data.invoices.find(x => x.id === recordId);
    if (!inv) return;
    const c = state.data.customers.find(x => x.id === inv.customerId);
    const rem = Number(inv.total) - Number(inv.paidAmount || 0);

    ctx.fillText(`إيصال فاتورة مبيعات رقم: ${inv.number}`, 720, 96);

    ctx.fillStyle = '#121E17';
    ctx.font = 'bold 20px Cairo, Tahoma, sans-serif';
    ctx.fillText(`العميل: ${c ? c.name : '-'}`, 720, 185);
    ctx.font = '16px Cairo, Tahoma, sans-serif';
    ctx.fillStyle = '#4A5D52';
    ctx.fillText(`التاريخ: ${inv.date}   |   المنطقة: ${c?.area || '-'}`, 720, 220);

    // Items Box
    ctx.fillStyle = '#F4F7F5';
    ctx.fillRect(40, 250, 680, 420);
    ctx.strokeStyle = '#DCE5DF';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 250, 680, 420);

    let y = 295;
    ctx.fillStyle = '#0E5A36';
    ctx.font = 'bold 18px Cairo, Tahoma, sans-serif';
    ctx.fillText('الأصناف المباعة:', 700, y);
    y += 40;

    inv.items.slice(0, 7).forEach(it => {
      ctx.fillStyle = '#121E17';
      ctx.font = 'bold 17px Cairo, Tahoma, sans-serif';
      const bonusTxt = Number(it.bonusQty || 0) > 0 ? ` (+${it.bonusQty} بونص)` : '';
      ctx.fillText(`• ${it.name} (×${it.qty}${bonusTxt})`, 700, y);
      ctx.textAlign = 'left';
      ctx.fillText(`${it.subtotal.toLocaleString()} ج.م`, 60, y);
      ctx.textAlign = 'right';
      y += 44;
    });

    // Totals Summary
    ctx.fillStyle = '#E0EFE6';
    ctx.fillRect(40, 695, 680, 140);
    ctx.fillStyle = '#0E5A36';
    ctx.font = 'bold 22px Cairo, Tahoma, sans-serif';
    ctx.fillText(`الإجمالي: ${fmtMoney(inv.total)}`, 700, 740);
    ctx.font = 'bold 18px Cairo, Tahoma, sans-serif';
    ctx.fillStyle = '#121E17';
    ctx.fillText(`المدفوع: ${fmtMoney(inv.paidAmount || 0)}   |   المتبقي: ${fmtMoney(rem)}`, 700, 785);
    ctx.fillStyle = '#4A5D52';
    ctx.font = '15px Cairo, Tahoma, sans-serif';
    ctx.fillText(`إجمالي رصيد العميل الحالي: ${fmtMoney(getCustomerBalance(inv.customerId))}`, 700, 818);
  } else if (type === 'payment') {
    const p = state.data.payments.find(x => x.id === recordId);
    if (!p) return;
    const c = state.data.customers.find(x => x.id === p.customerId);
    ctx.fillText('سند استلام نقدية / تحصيل من عميل', 720, 96);

    ctx.fillStyle = '#F4F7F5';
    ctx.fillRect(40, 180, 680, 520);
    ctx.fillStyle = '#121E17';
    ctx.font = 'bold 22px Cairo, Tahoma, sans-serif';
    ctx.fillText(`استلمنا من السيد / ${c ? c.name : '-'}`, 690, 250);
    ctx.fillStyle = '#0E5A36';
    ctx.font = 'bold 34px Cairo, Tahoma, sans-serif';
    ctx.fillText(`مبلغ وقدره: ${fmtMoney(p.amount)}`, 690, 330);
    ctx.fillStyle = '#121E17';
    ctx.font = 'bold 19px Cairo, Tahoma, sans-serif';
    ctx.fillText(`طريقة السداد: ${p.method || 'نقدي'}`, 690, 410);
    ctx.fillText(`تاريخ التحصيل: ${p.date}`, 690, 465);
    if (p.note) ctx.fillText(`البيان: ${p.note}`, 690, 520);
    ctx.fillStyle = '#0E5A36';
    ctx.fillText(`الرصيد المتبقي بعد السداد: ${fmtMoney(getCustomerBalance(p.customerId))}`, 690, 600);
  }

  ctx.fillStyle = '#4A5D52';
  ctx.font = '14px Cairo, Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${cfg.companyName} • نظام الإدارة الميدانية FieldOS`, 380, 885);

  canvas.toBlob(async (blob) => {
    const file = new File([blob], `Receipt_${Date.now()}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: cfg.companyName });
        return;
      } catch (e) {}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Receipt_${todayStr(0)}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('تم تحميل صورة الإيصال جاهزة للإرسال على واتساب');
  }, 'image/png');
}

function toggleDrawer(open) {

    isDrawerOpen = true;
    document.getElementById('drawerBackdrop').classList.remove('hidden');
    document.getElementById('sideDrawer').classList.remove('translate-x-full');

  document.getElementById('sideDrawer').classList.add('translate-x-full');

function applyRoute(route, pushHistory = true) {
  closeDrawer();
  closeModal();
  state.route = route;
  if (pushHistory && routeHistory[routeHistory.length - 1] !== route) {
    routeHistory.push(route);
    pushGuardState(route);
  }
  document.getElementById('headerTitle').textContent = ROUTE_TITLES[route] || 'FieldOS';
  const backBtn = document.getElementById('headerBackBtn');
  if (backBtn) {
    if (route === 'home') {
      backBtn.classList.add('hidden');
      backBtn.classList.remove('inline-flex');
    } else {
      backBtn.classList.remove('hidden');
      backBtn.classList.add('inline-flex');
    }
  }
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.nav === route;
    btn.classList.toggle('bg-brand-soft-dyn', active);
    btn.classList.toggle('text-muted-dyn', !active);
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });

function runGlobalSearch(raw) {
  const q = raw.trim().toLowerCase();
  const box = document.getElementById('globalSearchResults');
  if (!box) return;
  if (!q) {
    box.innerHTML = `<p class="text-center text-muted-dyn py-6">ابدأ بكتابة أي حرفين للبحث في كل الوحدات...</p>`;
    return;
  }

  const custs = state.data.customers.filter(c =>
    c.name.toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.area || '').toLowerCase().includes(q)
  );
  const trials = state.data.trials.filter(t =>
    t.code.toLowerCase().includes(q) || t.hybridName.toLowerCase().includes(q)
  );
  const prods = state.data.products.filter(p =>
    p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
  );
  const stations = state.data.stations.filter(s =>
    s.name.toLowerCase().includes(q) || (s.crop || '').toLowerCase().includes(q)
  );

  let html = '';

// ==================== IMAGE COMPRESSION & GPS HELPERS ====================
function compressImageFile(file) {
  return new Promise((resolve) => {
    const origKB = Math.round(file.size / 1024);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1024;
        let w = img.width;
        let h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) {
          if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
          else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const compKB = Math.round((dataUrl.length * 3) / 4 / 1024);
        resolve({ dataUrl, origKB, compKB });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function captureGPS(latInputId, lngInputId, statusId) {
  const st = document.getElementById(statusId);
  if (!navigator.geolocation) {
    if (st) st.textContent = 'المتصفح لا يدعم تحديد الموقع';
    return;
  }
  if (st) st.textContent = 'جاري التقاط الإحداثيات...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById(latInputId).value = pos.coords.latitude.toFixed(6);
      document.getElementById(lngInputId).value = pos.coords.longitude.toFixed(6);
      if (st) st.textContent = `تم الالتقاط بدقة ${Math.round(pos.coords.accuracy)} متر`;
    },
    () => {
      if (st) st.textContent = 'تعذر الوصول للموقع — تأكد من تفعيل GPS';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function snoozeVisitFollowUp(visitId, days) {
  const v = state.data.visits.find(x => x.id === visitId);
  if (!v) return;
  v.nextFollowUp = todayStr(days);
  await putRecord('visits', v);
  await loadAllData();
  render();
  showToast(`تم تأجيل المتابعة ${days} أيام`);
}

async function completeVisitFollowUp(visitId) {
  const v = state.data.visits.find(x => x.id === visitId);
  if (!v) return;
  v.followUpDone = true;
  await putRecord('visits', v);
  await loadAllData();
  render();
  showToast('تم إغلاق تذكير المتابعة');
}

async function deleteCustomerSafe(customerId) {
  const hasInvoices = state.data.invoices.some(i => i.customerId === customerId);
  const bal = getCustomerBalance(customerId);
  if (hasInvoices || bal !== 0) {
    return showToast('لا يمكن حذف عميل مرتبط بفواتير أو مديونية قائمة');
  }
  const c = state.data.customers.find(x => x.id === customerId);
  await deleteRecord('customers', customerId);
  await logAudit('حذف عميل', c?.name || customerId, 'حذف سجل عميل بدون حركات');
  await loadAllData();
  closeModal();
  render();
  showToast('تم حذف العميل');
}

async function handleCustomerPhotoSelect(input) {
  if (!input.files || !input.files[0]) return;
  const stats = document.getElementById('custPhotoStats');

  const res = await compressImageFile(input.files[0]);
  tempCustomerPhoto = res.dataUrl;
  stats.textContent = `✓ تم الضغط: قبل ${res.origKB} KB ← بعد ${res.compKB} KB`;
  document.getElementById('custPhotoPreview').innerHTML = `<img src="${tempCustomerPhoto}" class="h-28 rounded-xl border mt-1 object-cover" />`;

function renderSmartCustomerPicker(hiddenInputId, searchInputId, suggestBoxId, selectedCustomerId = '') {
  const c = state.data.customers.find(x => x.id === selectedCustomerId);
  const initialText = c ? c.name : '';
  return `
    <div class="relative">
      <input type="hidden" id="${hiddenInputId}" value="${c ? c.id : ''}" />
      <input
        id="${searchInputId}"
        type="text"
        value="${initialText}"
        onfocus="filterSmartCustomerList('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}')"
        oninput="document.getElementById('${hiddenInputId}').value=''; filterSmartCustomerList('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}');"
        placeholder="اكتب اسم العميل للبحث أو الإضافة الفورية..."
        class="input-field"
        autocomplete="off"
      />
      <div id="${suggestBoxId}" class="hidden mt-1.5 m3-card p-2 space-y-1 max-h-44 overflow-y-auto shadow-lg"></div>
    </div>
  `;
}

function filterSmartCustomerList(hiddenInputId, searchInputId, suggestBoxId) {
  const inp = document.getElementById(searchInputId);
  const box = document.getElementById(suggestBoxId);
  if (!inp || !box) return;
  const q = inp.value.trim().toLowerCase();
  const matches = state.data.customers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || (c.area || '').toLowerCase().includes(q) || (c.phone || '').includes(q)
  );

  let html = matches.slice(0, 8).map(c => `
    <button type="button" onclick="selectSmartCustomer('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}', '${c.id}')" class="w-full text-right p-2 rounded-xl hover:opacity-80 subtle-box flex items-center justify-between text-xs">
      <div>
        <div class="font-extrabold">${c.name}</div>
        <div class="text-[10px] text-muted-dyn">${c.area || ''} ${c.phone ? '• ' + c.phone : ''}</div>
      </div>
      <span class="font-bold text-brand-dyn">${getCustomerBalance(c.id).toLocaleString()} ج.م</span>
    </button>
  `).join('');

  if (q && !matches.some(c => c.name.toLowerCase() === q)) {
    const safeName = inp.value.trim().replace(/'/g, '');
    html += `
      <button type="button" onclick="quickCreateAndSelectCustomer('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}', '${safeName}')" class="w-full text-right p-2.5 rounded-xl bg-brand-soft-dyn font-extrabold text-xs flex items-center justify-between">
        <span>+ إضافة عميل جديد باسم: "${safeName}"</span>
        <span>اعتماد ↵</span>
      </button>
    `;
  }

  box.innerHTML = html || `<div class="text-[11px] text-muted-dyn p-2">اكتب اسم العميل الجديد لإضافته فوراً...</div>`;
  box.classList.remove('hidden');
}

function selectSmartCustomer(hiddenInputId, searchInputId, suggestBoxId, customerId) {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return;
  document.getElementById(hiddenInputId).value = c.id;
  document.getElementById(searchInputId).value = c.name;
  document.getElementById(suggestBoxId).classList.add('hidden');
}

async function quickCreateAndSelectCustomer(hiddenInputId, searchInputId, suggestBoxId, rawName) {
  const name = rawName.trim();
  if (!name) return;
  const cfg = getAppConfig();
  const newCust = {
    id: uid('cust'),
    name,
    phone: '',
    area: '',
    openingBalance: 0,
    creditLimit: cfg.defaultCreditLimit,
    notes: 'تمت إضافته سريعاً من شاشة الفاتورة',
    photo: '',
    lat: '',
    lng: ''
  };
  await putRecord('customers', newCust);
  await loadAllData();
  selectSmartCustomer(hiddenInputId, searchInputId, suggestBoxId, newCust.id);
  showToast(`تمت إضافة العميل (${name}) واعتماده`);
}

let draftInvoiceItems = [];
let editingInvoiceId = '';
let tempInvoicePhoto = '';
let preselectedInvoiceCustomer = '';
let isDraftQuoteMode = false;

function openInvoiceModal(invoiceId = '', preCustId = '', asQuote = false) {
  if (state.data.products.length === 0) {
    return showToast('أضف صنفاً واحداً على الأقل في المخازن أولاً');
  }
  editingInvoiceId = invoiceId;
  preselectedInvoiceCustomer = preCustId;
  isDraftQuoteMode = asQuote;
  const existing = state.data.invoices.find(x => x.id === invoiceId);
  if (existing) {
    draftInvoiceItems = existing.items.map(it => ({
      productId: it.productId,
      qty: Number(it.qty),
      bonusQty: Number(it.bonusQty || 0),
      price: Number(it.price)
    }));
    tempInvoicePhoto = existing.photo || '';
  } else {
    draftInvoiceItems = [{ productId: state.data.products[0].id, qty: 1, bonusQty: 0, price: state.data.products[0].price }];
    tempInvoicePhoto = '';
  }
  renderInvoiceModalBody();
}

function stepDraftQty(idx, delta) {
  const next = Math.max(1, Number(draftInvoiceItems[idx].qty || 1) + delta);
  draftInvoiceItems[idx].qty = next;
  renderInvoiceModalBody();
}

function renderInvoiceModalBody() {
  const existing = state.data.invoices.find(x => x.id === editingInvoiceId);
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  const modeVal = existing ? (existing.paymentMode || 'credit') : 'credit';
  const targetCust = existing ? existing.customerId : (preselectedInvoiceCustomer || '');
  const selectedWh = document.getElementById('invWh')?.value || (existing ? existing.warehouseId : state.data.warehouses[0]?.id);

  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-brand-dyn">${existing ? `تعديل الفاتورة ${existing.number}` : (isDraftQuoteMode ? 'إعداد عرض سعر / مسودة' : 'فاتورة بيع جديدة')}</h3>
      <button onclick="closeModal()" class="text-muted-dyn text-xl font-bold">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <div>
        <label class="font-bold block mb-1">العميل (اكتب للاقتراح أو أضف عميلاً جديداً) *</label>
        ${renderSmartCustomerPicker('invCust', 'invCustSearch', 'invCustSuggest', targetCust)}
      </div>

      <div>
        <label class="font-bold block mb-1">المخزن الصادر *</label>
        <select id="invWh" onchange="renderInvoiceModalBody()" class="input-field">
          ${state.data.warehouses.map(w => `<option value="${w.id}" ${selectedWh===w.id ? 'selected' : ''}>${w.name}</option>`).join('')}
        </select>
      </div>

      <div class="subtle-box p-3 rounded-2xl space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <span class="font-extrabold">الأصناف (الكمية + البونص + السعر)</span>
          <div class="flex gap-1">
            <button type="button" onclick="openBarcodeScannerModal('handleScannedProductForInvoice')" class="btn-tonal text-[11px] py-1 px-2 min-h-0">📷 باركود</button>
            <button type="button" onclick="addDraftInvRow()" class="btn-tonal text-[11px] py-1 px-2.5 min-h-0">+ صنف</button>
          </div>
        </div>
        ${draftInvoiceItems.map((row, idx) => `
          <div class="m3-card p-2.5 rounded-xl space-y-2">
            <select onchange="updateDraftInvProduct(${idx}, this.value)" class="input-field py-1.5 text-xs">
              ${state.data.products.map(p => {
                const avail = getStockQty(selectedWh, p.id);
                return `<option value="${p.id}" ${p.id===row.productId?'selected':''}>${p.name} (متاح: ${avail})</option>`;
              }).join('')}
            </select>
            <div class="grid grid-cols-12 gap-1.5 items-center">
              <div class="col-span-5 flex items-center gap-1">
                <button type="button" onclick="stepDraftQty(${idx}, -1)" class="stepper-btn">−</button>
                <input type="number" inputmode="numeric" min="1" value="${row.qty}" oninput="draftInvoiceItems[${idx}].qty=Number(this.value||0); updateDraftInvTotal();" class="input-field px-1 text-center py-1 text-xs" title="الكمية" />

              </div>
              <div class="col-span-3">
                <input type="number" inputmode="numeric" min="0" value="${row.bonusQty || 0}" oninput="draftInvoiceItems[${idx}].bonusQty=Number(this.value||0);" class="input-field px-1 py-1 text-xs text-center" placeholder="بونص" title="كمية مجانية / بونص" />
              </div>
              <div class="col-span-3">
                <input type="number" inputmode="decimal" min="0" value="${row.price}" oninput="draftInvoiceItems[${idx}].price=Number(this.value||0); updateDraftInvTotal();" class="input-field px-1 py-1 text-xs text-center" placeholder="السعر" />

              <div class="col-span-1 text-left">
                ${draftInvoiceItems.length > 1 ? `<button type="button" onclick="draftInvoiceItems.splice(${idx},1); renderInvoiceModalBody();" class="text-red-600 font-bold text-xs">✕</button>` : ''}

            </div>
            <div class="flex justify-between text-[10px] text-muted-dyn px-1">
              <span>الكمية المباعة | البونص المجاني | سعر الوحدة</span>
              <strong>${(Number(row.qty) * Number(row.price)).toLocaleString()} ج.م</strong>
            </div>
          </div>
        `).join('')}

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-1">نمط السداد</label>
          <select id="invMode" onchange="toggleInvPaidField()" class="input-field">
            <option value="credit" ${modeVal==='credit'?'selected':''}>آجل بالكامل</option>
            <option value="cash" ${modeVal==='cash'?'selected':''}>نقدي بالكامل</option>
            <option value="partial" ${modeVal==='partial'?'selected':''}>دفعة جزئية</option>
          </select>
        </div>
        <div id="invPaidWrap" class="${modeVal==='partial' ? '' : 'hidden'}">
          <label class="font-bold block mb-1">المبلغ المدفوع الآن</label>
          <input id="invPaidAmt" type="number" inputmode="decimal" value="${existing ? (existing.paidAmount || 0) : 0}" class="input-field" />
        </div>
      </div>

      <div>
        <label class="font-bold block mb-1">ملاحظة على الفاتورة / العرض</label>
        <input id="invNote" value="${existing ? (existing.note || '') : ''}" class="input-field" placeholder="رقم إذن التسليم / شروط السداد..." />
      </div>

      <div class="subtle-box p-3 rounded-xl space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="font-bold">📸 إرفاق صورة إيصال تسليم / توقيع العميل</label>
          ${tempInvoicePhoto ? `<button type="button" onclick="tempInvoicePhoto=''; document.getElementById('invPhotoPreview').innerHTML='';" class="text-red-600 text-[11px] font-bold">حذف</button>` : ''}
        </div>
        <input type="file" accept="image/*" capture="environment" onchange="handleInvoicePhotoSelect(this)" class="text-xs w-full" />
        <div id="invPhotoStats" class="text-[11px] text-brand-dyn font-bold"></div>
        <div id="invPhotoPreview">${tempInvoicePhoto ? `<img src="${tempInvoicePhoto}" class="h-24 rounded-xl border mt-1 object-cover" />` : ''}</div>
      </div>

      <div id="invGuardBox" class="hidden bg-red-50 border border-red-300 text-red-800 p-3 rounded-xl text-[11px] font-bold"></div>

      <div class="bg-brand-soft-dyn p-3 rounded-xl flex items-center justify-between">
        <span class="font-bold">الإجمالي:</span>

      </div>

      <div class="grid ${existing ? 'grid-cols-1' : 'grid-cols-2'} gap-2">

        <button type="button" onclick="submitInvoice(false)" class="btn-primary py-3 text-xs">${existing ? 'حفظ التعديلات وتسوية المخزن' : '✓ اعتماد فاتورة وخصم المخزن'}</button>
      </div>
    </div>
  `);
}

async function resolveSelectedOrNewCustomer(hiddenInputId, searchInputId) {
  let customerId = document.getElementById(hiddenInputId)?.value || '';
  const typedName = document.getElementById(searchInputId)?.value.trim() || '';
  if (!customerId && typedName) {
    const exact = state.data.customers.find(c => c.name.toLowerCase() === typedName.toLowerCase());
    if (exact) {
      customerId = exact.id;
    } else {
      const cfg = getAppConfig();
      const newCust = {
        id: uid('cust'),
        name: typedName,
        phone: '',
        area: '',
        openingBalance: 0,
        creditLimit: cfg.defaultCreditLimit,
        notes: 'تمت إضافته تلقائياً أثناء التسجيل',
        photo: '',
        lat: '',
        lng: ''
      };
      await putRecord('customers', newCust);
      await loadAllData();
      customerId = newCust.id;
    }
  }
  return customerId;
}

async function saveAsQuoteDraft() {
  const customerId = await resolveSelectedOrNewCustomer('invCust', 'invCustSearch');
  if (!customerId) return showToast('اكتب أو اختر اسم العميل أولاً');
  const warehouseId = document.getElementById('invWh').value;
  const note = document.getElementById('invNote').value.trim();
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  if (total <= 0) return showToast('يرجى إدخال كميات وأسعار صحيحة');

  const items = draftInvoiceItems.map(row => {
    const p = state.data.products.find(x => x.id === row.productId);
    return {
      productId: row.productId,
      name: p ? p.name : '',
      qty: Number(row.qty),
      bonusQty: Number(row.bonusQty || 0),
      price: Number(row.price),
      subtotal: Number(row.qty) * Number(row.price)
    };
  });

  await putRecord('quotes', {
    id: uid('quo'),
    number: 'QT-' + (101 + (state.data.quotes || []).length),
    date: todayStr(0),
    customerId,
    warehouseId,
    total,
    note,
    items
  });
  await loadAllData();
  closeModal();
  state.salesTab = 'quotes';
  navigate('sales');
  showToast('تم حفظ عرض السعر بدون خصم من المخزن');
}

async function convertQuoteToInvoice(quoteId) {
  const q = (state.data.quotes || []).find(x => x.id === quoteId);
  if (!q) return;
  const cfg = getAppConfig();
  for (const row of q.items) {
    const totalOut = Number(row.qty) + Number(row.bonusQty || 0);
    const avail = getStockQty(q.warehouseId, row.productId);
    if (!cfg.allowZeroStockSale && totalOut > avail) {
      return showToast(`الرصيد لا يكفي للصنف (${row.name}) — المتاح: ${avail}`);
    }
  }
  const invNum = 'INV-' + (1001 + state.data.invoices.length);
  for (const it of q.items) {
    const totalOut = Number(it.qty) + Number(it.bonusQty || 0);
    await adjustStock(q.warehouseId, it.productId, -totalOut, 'فاتورة بيع', `${invNum} (محول من عرض سعر)`);
  }
  await putRecord('invoices', {
    id: uid('inv'),
    number: invNum,
    date: todayStr(0),
    customerId: q.customerId,
    warehouseId: q.warehouseId,
    paymentMode: 'credit',
    paidAmount: 0,
    total: q.total,
    note: q.note,
    photo: '',
    items: q.items
  });
  await deleteRecord('quotes', quoteId);
  await logAudit('اعتماد عرض سعر', invNum, `تحويل العرض ${q.number} إلى فاتورة بقيمة ${q.total}`);
  await loadAllData();
  state.salesTab = 'invoices';
  render();
  showToast(`تم اعتماد عرض السعر وتحويله إلى فاتورة ${invNum}`);
}

async function deleteQuoteRecord(id) {
  await deleteRecord('quotes', id);
  await loadAllData();
  render();
  showToast('تم حذف عرض السعر');
}

async function handleInvoicePhotoSelect(input) {
  if (!input.files || !input.files[0]) return;
  const stats = document.getElementById('invPhotoStats');
  stats.textContent = 'جاري ضغط الصورة...';
  const res = await compressImageFile(input.files[0]);
  tempInvoicePhoto = res.dataUrl;
  stats.textContent = `✓ تم الضغط: قبل ${res.origKB} KB ← بعد ${res.compKB} KB`;
  document.getElementById('invPhotoPreview').innerHTML = `<img src="${tempInvoicePhoto}" class="h-24 rounded-xl border mt-1 object-cover" />`;
}

function addDraftInvRow() {
  const p = state.data.products[0];
  draftInvoiceItems.push({ productId: p.id, qty: 1, bonusQty: 0, price: p.price });
  renderInvoiceModalBody();
}

function updateDraftInvProduct(idx, productId) {
  const p = state.data.products.find(x => x.id === productId);
  draftInvoiceItems[idx].productId = productId;
  if (p) draftInvoiceItems[idx].price = p.price;
  renderInvoiceModalBody();
}

function updateDraftInvTotal() {
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  const el = document.getElementById('invTotalDisplay');
  if (el) el.textContent = fmtMoney(total);
}

function toggleInvPaidField() {
  const mode = document.getElementById('invMode').value;
  document.getElementById('invPaidWrap').classList.toggle('hidden', mode !== 'partial');
}

async function submitInvoice(bypassGuard) {
  const cfg = getAppConfig();
  const customerId = await resolveSelectedOrNewCustomer('invCust', 'invCustSearch');
  if (!customerId) return showToast('اكتب أو اختر اسم العميل أولاً');
  const warehouseId = document.getElementById('invWh').value;
  const mode = document.getElementById('invMode').value;
  const note = document.getElementById('invNote').value.trim();
  const total = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  if (total <= 0) return showToast('يرجى إدخال كميات وأسعار صحيحة');

  let paidAmount = 0;
  if (mode === 'cash') paidAmount = total;
  else if (mode === 'partial') paidAmount = Math.min(total, Number(document.getElementById('invPaidAmt').value || 0));

  const oldInvoice = editingInvoiceId ? state.data.invoices.find(x => x.id === editingInvoiceId) : null;

  if (!cfg.allowZeroStockSale) {
    for (const row of draftInvoiceItems) {
      let avail = getStockQty(warehouseId, row.productId);
      if (oldInvoice && oldInvoice.warehouseId === warehouseId) {
        const oldQty = oldInvoice.items.filter(i => i.productId === row.productId).reduce((s, i) => s + Number(i.qty) + Number(i.bonusQty || 0), 0);
        avail += oldQty;
      }
      const reqQty = Number(row.qty) + Number(row.bonusQty || 0);
      if (reqQty > avail) {
        const p = state.data.products.find(x => x.id === row.productId);
        return showToast(`الرصيد لا يكفي للصنف (${p?.name}) — المتاح: ${avail}`);
      }
    }
  }

  const cust = state.data.customers.find(c => c.id === customerId);
  let currentBal = getCustomerBalance(customerId);
  if (oldInvoice && oldInvoice.customerId === customerId) {
    currentBal -= (Number(oldInvoice.total) - Number(oldInvoice.paidAmount || 0));
  }
  const projectedBal = currentBal + (total - paidAmount);
  const hasOverdue = state.data.invoices.some(i =>
    i.id !== editingInvoiceId && i.customerId === customerId && (i.total - i.paidAmount) > 0 && i.date < todayStr(-cfg.overdueDays)
  );

  if (!bypassGuard && (total - paidAmount) > 0 && ((cust.creditLimit > 0 && projectedBal > cust.creditLimit) || hasOverdue)) {
    const box = document.getElementById('invGuardBox');
    box.classList.remove('hidden');
    box.innerHTML = `
      <div>⚠️ تحذير حارس الائتمان:</div>
      <div>${projectedBal > cust.creditLimit ? `• الرصيد بعد الفاتورة (${fmtMoney(projectedBal)}) سيتخطى الحد الائتماني (${fmtMoney(cust.creditLimit)}).` : ''}</div>
      <div>${hasOverdue ? `• العميل لديه فواتير آجلة متأخرة لأكثر من ${cfg.overdueDays} يوماً.` : ''}</div>
      <button type="button" onclick="submitInvoice(true)" class="mt-2 bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs">تأكيد الاعتماد رغم التحذير</button>
    `;
    return;
  }

  const invNumber = oldInvoice ? oldInvoice.number : ('INV-' + (1001 + state.data.invoices.length));

  if (oldInvoice) {
    for (const oldIt of oldInvoice.items) {
      const oldOut = Number(oldIt.qty) + Number(oldIt.bonusQty || 0);
      await adjustStock(oldInvoice.warehouseId, oldIt.productId, oldOut, 'تسوية تعديل فاتورة', invNumber);
    }
  }

  const items = draftInvoiceItems.map(row => {
    const p = state.data.products.find(x => x.id === row.productId);
    return {
      productId: row.productId,
      name: p ? p.name : '',
      qty: Number(row.qty),
      bonusQty: Number(row.bonusQty || 0),
      price: Number(row.price),
      subtotal: Number(row.qty) * Number(row.price)
    };
  });

  for (const it of items) {
    const totalOut = Number(it.qty) + Number(it.bonusQty || 0);
    await adjustStock(warehouseId, it.productId, -totalOut, 'فاتورة بيع', `${invNumber} - ${cust?.name || ''}`);
  }

  await putRecord('invoices', {
    id: oldInvoice ? oldInvoice.id : uid('inv'),
    number: invNumber,
    date: oldInvoice ? oldInvoice.date : todayStr(0),
    customerId,
    warehouseId,
    paymentMode: mode,
    paidAmount,
    total,
    note,
    photo: tempInvoicePhoto,
    items
  });

  await logAudit(oldInvoice ? 'تعديل فاتورة' : 'إنشاء فاتورة', invNumber, `العميل: ${cust?.name || ''} | القيمة: ${total}`);
  editingInvoiceId = '';
  await loadAllData();
  closeModal();
  render();
  showToast(oldInvoice ? 'تم تعديل الفاتورة وتسوية المخزن والحسابات' : 'تم اعتماد الفاتورة وتحديث المخزن والحسابات');
}

async function executeDeleteInvoice(invoiceId) {
  const inv = state.data.invoices.find(x => x.id === invoiceId);
  if (!inv) return;
  const snapshot = JSON.parse(JSON.stringify(inv));
  for (const it of inv.items) {
    const out = Number(it.qty) + Number(it.bonusQty || 0);
    await adjustStock(inv.warehouseId, it.productId, out, 'إلغاء فاتورة', snapshot.number);
  }
  await deleteRecord('invoices', invoiceId);
  await logAudit('حذف فاتورة', snapshot.number, `قيمة الفاتورة المحذوفة: ${snapshot.total}`);
  await loadAllData();
  closeModal();
  render();
  showToast(`تم حذف الفاتورة ${snapshot.number}`, async () => {
    for (const it of snapshot.items) {
      const out = Number(it.qty) + Number(it.bonusQty || 0);
      await adjustStock(snapshot.warehouseId, it.productId, -out, 'استرجاع فاتورة', snapshot.number);
    }
    await putRecord('invoices', snapshot);
    await loadAllData();
    render();
    showToast('تم استرجاع الفاتورة بنجاح');
  });
}

async function saveProduct(id = '') {
  const name = document.getElementById('pName').value.trim();
  const code = document.getElementById('pCode').value.trim() || ('PRD-' + (state.data.products.length + 1));
  if (!name) return showToast('أدخل اسم الصنف');
  const existing = state.data.products.find(x => x.id === id) || {};
  const targetId = id || uid('prd');
  await putRecord('products', {
    ...existing,
    id: targetId,
    code,
    name,
    unit: document.getElementById('pUnit').value.trim() || 'باكت',
    cost: Number(document.getElementById('pCost').value || 0),
    price: Number(document.getElementById('pPrice').value || 0),
    minQty: Number(document.getElementById('pMin').value || 5)
  });
  if (!id) {
    const initQty = Number(document.getElementById('pInitQty')?.value || 0);
    const initWh = document.getElementById('pInitWh')?.value;
    if (initQty > 0 && initWh) {
      await adjustStock(initWh, targetId, initQty, 'رصيد افتتاحي', name);
    }
  }
  await logAudit(id ? 'تعديل صنف' : 'إضافة صنف', code, name);
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ بيانات الصنف بنجاح');
}

async function deleteProductSafe(productId) {
  const usedInInvoices = state.data.invoices.some(inv => inv.items.some(it => it.productId === productId));
  if (usedInInvoices) {
    return showToast('لا يمكن حذف صنف مستخدم في فواتير سابقة — يمكنك تصفير رصيده');
  }
  const p = state.data.products.find(x => x.id === productId);
  await deleteRecord('products', productId);
  for (const s of state.data.stock.filter(x => x.productId === productId)) {
    await deleteRecord('stock', s.id);
  }
  await logAudit('حذف صنف', p?.code || productId, p?.name || '');
  await loadAllData();
  render();
  showToast('تم حذف الصنف وأرصدته');
}

function refreshAdjCurrentQty() {
  const wh = document.getElementById('adjWh')?.value;
  const prod = document.getElementById('adjProd')?.value;
  const cur = getStockQty(wh, prod);
  const disp = document.getElementById('adjCurDisplay');
  const inp = document.getElementById('adjActualQty');
  if (disp) disp.textContent = cur;
  if (inp) inp.value = cur;
}

async function applyStockAdjustment() {
  const wh = document.getElementById('adjWh').value;
  const prod = document.getElementById('adjProd').value;
  const actual = Math.max(0, Number(document.getElementById('adjActualQty').value || 0));
  const reason = document.getElementById('adjReason').value;
  const cur = getStockQty(wh, prod);
  const delta = actual - cur;
  if (delta === 0) return showToast('الرصيد الفعلي مطابق للمسجل حالياً');

  await adjustStock(wh, prod, delta, 'تسوية جردية', `${reason} (من ${cur} إلى ${actual})`);
  await logAudit('تسوية مخزنية', prod, `${reason}: تعديل الرصيد من ${cur} إلى ${actual}`);
  await loadAllData();
  closeModal();
  render();
  showToast(`تم تعديل الرصيد بنجاح إلى ${actual}`);
}

async function saveTransfer() {
  const from = document.getElementById('trFrom').value;
  const to = document.getElementById('trTo').value;
  const prod = document.getElementById('trProd').value;
  const qty = Number(document.getElementById('trQty').value || 0);
  if (from === to) return showToast('اختر مخزنين مختلفين');
  const avail = getStockQty(from, prod);
  if (qty <= 0 || qty > avail) return showToast(`الرصيد المتاح في المخزن المصدر: ${avail}`);
  const wFrom = state.data.warehouses.find(w => w.id === from);
  const wTo = state.data.warehouses.find(w => w.id === to);
  await adjustStock(from, prod, -qty, 'تحويل صادر', `إلى ${wTo?.name || ''}`);
  await adjustStock(to, prod, qty, 'تحويل وارد', `من ${wFrom?.name || ''}`);
  await putRecord('transfers', { id: uid('tr'), date: todayStr(0), from, to, productId: prod, qty });
  await loadAllData();
  closeModal();
  render();
  showToast('تم التحويل المخزني بنجاح');
}

let lastCalculatedPacks = 1;
function computeSeedCalc() {
  const feddan = Math.max(0.1, Number(document.getElementById('calcFeddan')?.value || 1));
  const rowW = Math.max(0.3, Number(document.getElementById('calcRowWidth')?.value || 1.5));
  const spaceCm = Math.max(10, Number(document.getElementById('calcPlantSpace')?.value || 50));
  const perPack = Math.max(50, Number(document.getElementById('calcSeedsPerPack')?.value || 500));

  const areaM2 = feddan * 4200;
  const plants = Math.round(areaM2 / (rowW * (spaceCm / 100)));
  const withSafety = Math.ceil(plants * 1.1); // +10% ترقيع ونسبة إنبات
  const packs = Math.max(1, Math.ceil(withSafety / perPack));
  lastCalculatedPacks = packs;

  const box = document.getElementById('seedCalcResultBox');
  if (box) {
    box.innerHTML = `
      <div class="text-[11px] text-muted-dyn">إجمالي النباتات المطلوبة (+10% أمان): <strong>${withSafety.toLocaleString()} شتلة</strong></div>
      <div class="text-lg font-black text-brand-dyn">الكمية المطلوبة: ${packs} باكت</div>
    `;
  }
}

function transferCalcToInvoice() {
  openInvoiceModal();
  if (draftInvoiceItems[0]) {
    draftInvoiceItems[0].qty = lastCalculatedPacks;
    renderInvoiceModalBody();
  }
}

async function saveVisit(editId = '', openInvoiceAfter = false) {
  const notes = document.getElementById('vNotes').value.trim();
  if (!notes) return showToast('أدخل ملاحظات الزيارة');
  const stationId = document.getElementById('vStation').value;
  const customerId = document.getElementById('vCust').value;
  const existing = state.data.visits.find(x => x.id === editId) || {};
  const visitDate = existing.date || todayStr(0);

  const checkedBoxes = Array.from(document.querySelectorAll('.v-trial-chk:checked'));
  const inspectedTrials = Array.isArray(existing.inspectedTrials) && checkedBoxes.length === 0 ? existing.inspectedTrials : [];

  for (const chk of checkedBoxes) {
    const trialId = chk.value;
    const trial = state.data.trials.find(t => t.id === trialId);
    if (!trial) continue;
    const newStage = document.getElementById(`vtStage_${trialId}`)?.value || trial.stage || 'نمو خضري';
    const newScore = Math.min(5, Math.max(1, Number(document.getElementById(`vtScore_${trialId}`)?.value || calcTrialAvg(trial.scores))));
    const itemNote = document.getElementById(`vtNote_${trialId}`)?.value.trim() || notes;

    inspectedTrials.push({
      trialId: trial.id,
      code: trial.code,
      hybridName: trial.hybridName,
      stage: newStage,
      avgScore: newScore,
      note: itemNote
    });

    const history = Array.isArray(trial.history) ? [...trial.history] : [];
    history.push({
      date: visitDate,
      stage: newStage,
      avgScore: newScore,
      notes: itemNote,
      photo: tempCompressedPhoto || ''
    });

    trial.stage = newStage;
    trial.scores = {
      earliness: newScore,
      vigor: newScore,
      yield: newScore,
      tolerance: newScore
    };
    trial.notes = itemNote;
    trial.history = history;
    await putRecord('trials', trial);
  }

  await putRecord('visits', {
    ...existing,
    id: editId || uid('vis'),
    date: visitDate,
    customerId,
    stationId,
    crop: document.getElementById('vCrop').value.trim(),
    nextFollowUp: document.getElementById('vNext').value,
    followUpDone: false,
    inspectedTrials,
    notes,
    photo: tempCompressedPhoto
  });

  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ الزيارة وتحديث السجل');
  if (openInvoiceAfter) {
    openInvoiceModal('', customerId);
  }
}

// ==================== TRIALS & STATIONS ====================
function calcTrialAvg(scores) {
  if (!scores) return 0;
  const vals = [scores.earliness, scores.vigor, scores.yield, scores.tolerance].map(Number);
  return (vals.reduce((a, b) => a + b, 0) / 4);
}

function getStationLastVisitDays(stationId) {
  const stVisits = state.data.visits.filter(v => v.stationId === stationId);
  if (stVisits.length === 0) return 999;
  const latestDate = stVisits.map(v => v.date).sort().reverse()[0];
  return Math.max(0, Math.floor((Date.now() - new Date(latestDate).getTime()) / 86400000));
}

function getStationStatusBadge(status) {
  if (status === 'paused') return `<span class="badge-pill bg-amber-100 text-amber-800">⏸️ متوقفة</span>`;
  if (status === 'closed') return `<span class="badge-pill bg-gray-200 text-gray-700">🏁 منتهية</span>`;
  return `<span class="badge-pill bg-emerald-100 text-emerald-800">🟢 نشطة</span>`;
}

async function deleteTrialRecord(trialId) {
  const t = state.data.trials.find(x => x.id === trialId);
  if (!t) return;
  const snapshot = JSON.parse(JSON.stringify(t));
  await deleteRecord('trials', trialId);
  await loadAllData();
  render();
  showToast(`تم حذف كود التجربة ${snapshot.code}`, async () => {
    await putRecord('trials', snapshot);
    await loadAllData();
    render();
    showToast('تم استرجاع كود التجربة');
  });
}

function openHybridCompareModal(idA = '', idB = '') {

  const sta1 = state.data.stations.find(s => s.id === first.stationId);
  const sta2 = state.data.stations.find(s => s.id === second.stationId);

  const photo1 = (first.history || []).slice().reverse().find(h => h.photo)?.photo || '';
  const photo2 = (second.history || []).slice().reverse().find(h => h.photo)?.photo || '';

  openModal(`

          <tr><td class="p-2 text-right font-bold">التبكير</td><td class="p-2 font-extrabold">${first.scores?.earliness || 0}/5</td><td class="p-2 font-extrabold">${second.scores?.earliness || 0}/5</td></tr>

async function saveStation(id = '') {

  if (!name) return showToast('أدخل اسم المحطة');
  const existing = state.data.stations.find(x => x.id === id) || {};
  await putRecord('stations', {
    ...existing,
    id: id || uid('sta'),
    name,
    owner: document.getElementById('stOwner').value.trim(),
    crop: document.getElementById('stCrop').value.trim(),
    area: document.getElementById('stArea').value.trim(),
    status: document.getElementById('stStatus').value,
    lat: document.getElementById('stLat').value.trim(),
    lng: document.getElementById('stLng').value.trim()
  });
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ بيانات محطة التجارب');
}

async function saveTrial(id = '') {
  const code = document.getElementById('tCode').value.trim();
  const hybridName = document.getElementById('tName').value.trim();
  if (!code || !hybridName) return showToast('أدخل كود واسم الهجين');

  const existing = state.data.trials.find(x => x.id === id) || {};

  if (!id) {
    const sampleEl = document.getElementById('tSampleProd');
    const sampleProd = sampleEl ? sampleEl.value : '';
    const sampleQty = Number(document.getElementById('tSampleQty')?.value || 0);
    if (sampleProd && sampleQty > 0 && state.data.warehouses[0]) {
      await adjustStock(state.data.warehouses[0].id, sampleProd, -sampleQty, 'صرف عينة تجربة', `كود ${code}`);
    }
  }

  const stage = document.getElementById('tStage').value;
  const scores = {
    earliness: Math.min(5, Math.max(1, Number(document.getElementById('scEar').value || 3))),
    vigor: Math.min(5, Math.max(1, Number(document.getElementById('scVig').value || 3))),
    yield: Math.min(5, Math.max(1, Number(document.getElementById('scYld').value || 3))),
    tolerance: Math.min(5, Math.max(1, Number(document.getElementById('scTol').value || 3)))
  };
  const notes = document.getElementById('tNotes').value.trim();
  const avg = calcTrialAvg(scores);

  const history = Array.isArray(existing.history) ? [...existing.history] : [];
  history.push({
    date: todayStr(0),
    stage,
    avgScore: avg,
    notes: notes || (id ? 'تحديث بيانات وتقييم الصنف' : 'تسجيل الصنف بالمحطة')
  });

  await putRecord('trials', {
    ...existing,
    id: id || uid('trl'),
    code,
    hybridName,
    stationId: document.getElementById('tStation').value,
    productId: document.getElementById('tInvPick').value || existing.productId || '',
    competitor: document.getElementById('tComp').value.trim(),
    plantingDate: existing.plantingDate || todayStr(0),
    stage,
    scores,
    notes,
    history
  });
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ الصنف وتحديث سجل المحطة');
}

function shareStationWhatsApp(stationId) {
  const s = state.data.stations.find(x => x.id === stationId);
  if (!s) return;
  const stTrials = state.data.trials.filter(t => t.stationId === stationId);
  const lines = stTrials.map(t => `• [${t.code}] ${t.hybridName} (${t.stage || '-'}) — تقييم: ${calcTrialAvg(t.scores).toFixed(1)}/5`).join('\n');
  const msg = encodeURIComponent(
    `*تقرير محطة تجارب - ${getAppConfig().companyName}*\n` +
    `المحطة: ${s.name}\n` +
    `المسؤول: ${s.owner || '-'} | المحصول: ${s.crop || '-'}\n` +
    `عدد الأصناف: ${stTrials.length}\n\n` +
    `${lines || 'لا توجد أصناف مسجلة بعد'}`
  );
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

function renderCommand() {
  const cfg = getAppConfig();
  const salesTarget = Math.max(1, cfg.salesTarget);
  const colTarget = Math.max(1, cfg.collectionTarget);

  const grossSales = state.data.invoices.reduce((s, i) => s + Number(i.total || 0), 0);
  const totalReturns = state.data.returns.reduce((s, r) => s + Number(r.total || 0), 0);
  const netSales = Math.max(0, grossSales - totalReturns);

  const totalCollected = state.data.invoices.reduce((s, i) => s + Number(i.paidAmount || 0), 0)
    + state.data.payments.reduce((s, p) => s + Number(p.amount || 0), 0)
    - state.data.returns.filter(r => r.refundCash).reduce((s, r) => s + Number(r.total || 0), 0);
  const efficiency = netSales > 0 ? Math.min(100, Math.round((totalCollected / netSales) * 100)) : 100;

  const salesTargetPct = Math.min(100, Math.round((netSales / salesTarget) * 100));
  const colTargetPct = Math.min(100, Math.round((totalCollected / colTarget) * 100));

  const prodCostMap = {};
  state.data.products.forEach(p => prodCostMap[p.id] = Number(p.cost || 0));
  let totalCogs = 0;
  const prodStats = {};
  state.data.products.forEach(p => {
    prodStats[p.id] = { name: p.name, qty: 0, rev: 0, profit: 0 };
  });

  state.data.invoices.forEach(inv => {
    inv.items.forEach(it => {
      const cost = prodCostMap[it.productId] || 0;
      const totalUnitsOut = Number(it.qty || 0) + Number(it.bonusQty || 0);
      totalCogs += cost * totalUnitsOut;
      if (prodStats[it.productId]) {
        prodStats[it.productId].qty += totalUnitsOut;
        prodStats[it.productId].rev += Number(it.subtotal || 0);
        prodStats[it.productId].profit += Number(it.subtotal || 0) - (cost * totalUnitsOut);
      }
    });
  });
  state.data.returns.forEach(r => {
    const cost = prodCostMap[r.productId] || 0;
    totalCogs -= cost * Number(r.qty || 0);
    if (prodStats[r.productId]) {
      prodStats[r.productId].qty -= Number(r.qty || 0);
      prodStats[r.productId].rev -= Number(r.total || 0);
      prodStats[r.productId].profit -= (Number(r.price || 0) - cost) * Number(r.qty || 0);
    }
  });

  const totalExp = state.data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const netProfit = netSales - totalCogs - totalExp;
  const rankedProducts = Object.values(prodStats).filter(x => x.qty > 0).sort((a, b) => b.profit - a.profit);

  const topCustomers = state.data.customers
    .map(c => {
      const cInv = state.data.invoices.filter(i => i.customerId === c.id).reduce((s, i) => s + Number(i.total || 0), 0);
      const cRet = state.data.returns.filter(r => r.customerId === c.id).reduce((s, r) => s + Number(r.total || 0), 0);
      return { name: c.name, sales: Math.max(0, cInv - cRet) };
    })
    .sort((a, b) => b.sales - a.sales)
    .slice(0, 4);
  const maxCustSale = Math.max(1, ...topCustomers.map(c => c.sales));

  return `
    <div class="m3-card p-4 space-y-3 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-extrabold text-sm text-brand-dyn">🎯 مؤشر تحقيق أهداف الشهر</span>
        <button onclick="openTargetSettingsModal()" class="btn-tonal text-[11px] py-1 px-2.5 min-h-0">تعديل الهدف</button>
      </div>
      <div class="space-y-1">
        <div class="flex justify-between font-bold">
          <span>هدف المبيعات (${salesTargetPct}%)</span>
          <span>${netSales.toLocaleString()} / ${salesTarget.toLocaleString()} ج.م</span>
        </div>
        <div class="w-full h-3 subtle-box rounded-full overflow-hidden">
          <div class="h-full bg-brand-dyn rounded-full transition-all" style="width:${salesTargetPct}%"></div>
        </div>
      </div>
      <div class="space-y-1">
        <div class="flex justify-between font-bold">
          <span>هدف التحصيل (${colTargetPct}%)</span>
          <span>${totalCollected.toLocaleString()} / ${colTarget.toLocaleString()} ج.م</span>
        </div>
        <div class="w-full h-3 subtle-box rounded-full overflow-hidden">
          <div class="h-full bg-amber-500 rounded-full transition-all" style="width:${colTargetPct}%"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-muted-dyn">صافي المبيعات (بعد المرتجع)</div>
        <div class="text-base font-black text-brand-dyn">${fmtMoney(netSales)}</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-muted-dyn">كفاءة التحصيل</div>
        <div class="text-base font-black text-[#5E4B8B]">${efficiency}%</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-muted-dyn">صافي الربح التقديري</div>
        <div class="text-base font-black ${netProfit >= 0 ? 'text-brand-dyn' : 'text-red-600'}">${fmtMoney(netProfit)}</div>
      </div>
      <div class="m3-card p-3.5">
        <div class="text-[11px] text-muted-dyn">إجمالي المرتجعات</div>
        <div class="text-base font-black text-amber-600">${fmtMoney(totalReturns)}</div>
      </div>
    </div>

    <div class="m3-card p-4 space-y-2.5 text-xs">
      <div class="font-extrabold text-sm text-brand-dyn">📈 تحليل ربحية الأصناف والهجن</div>
      ${rankedProducts.length === 0 ? `<p class="text-muted-dyn text-[11px]">لا توجد مبيعات مسجلة بعد.</p>` :
        rankedProducts.map(pr => `
          <div class="subtle-box p-2.5 rounded-xl flex items-center justify-between">
            <div>
              <div class="font-extrabold">${pr.name}</div>
              <div class="text-[10px] text-muted-dyn">الكمية المنصرفة: ${pr.qty} • الإيراد: ${pr.rev.toLocaleString()} ج.م</div>
            </div>
            <div class="text-left">
              <div class="font-black text-brand-dyn">+ ${pr.profit.toLocaleString()} ج.م</div>
              <div class="text-[10px] text-muted-dyn">صافي الربح</div>
            </div>
          </div>
        `).join('')
      }
    </div>

    <div class="m3-card p-4 space-y-3">
      <div class="font-extrabold text-sm text-brand-dyn">أعلى العملاء مبيعاً (صافي)</div>
      ${topCustomers.map(c => `
        <div class="space-y-1 text-xs">
          <div class="flex justify-between font-bold">
            <span class="truncate">${c.name}</span>
            <span>${fmtMoney(c.sales)}</span>
          </div>
          <div class="w-full h-2.5 subtle-box rounded-full overflow-hidden">
            <div class="h-full bg-brand-dyn rounded-full" style="width:${Math.round((c.sales / maxCustSale) * 100)}%"></div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
