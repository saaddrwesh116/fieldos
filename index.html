// ==================== PERSISTENT STORAGE API + REAL AES-GCM 256-BIT CRYPTO ====================
let isStoragePersisted = false;
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try { isStoragePersisted = await navigator.storage.persist(); } catch (e) {}
  }
}

async function deriveAesKey(password, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await window.crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return window.crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function aesEncryptJson(plainText, password) {
  const enc = new TextEncoder();
  const salt = window.crypto.getRandomValues(new Uint8Array(16));
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const cipherBuf = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plainText));
  const toB64 = (u8) => btoa(String.fromCharCode(...u8));
  return { salt: toB64(salt), iv: toB64(iv), data: toB64(new Uint8Array(cipherBuf)) };
}

async function aesDecryptJson(cipherObj, password) {
  const fromB64 = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = fromB64(cipherObj.salt), iv = fromB64(cipherObj.iv), data = fromB64(cipherObj.data);
  const key = await deriveAesKey(password, salt);
  const decBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(decBuf);
}

async function registerBiometricCredential() {
  if (!window.PublicKeyCredential) return showToast('البصمة غير مدعومة على هذا المتصفح');
  try {
    const challenge = window.crypto.getRandomValues(new Uint8Array(32));
    const userId = window.crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge, rp: { name: 'AGRI PYRAMIDS FieldOS' },
        user: { id: userId, name: 'fieldos_user', displayName: 'FieldOS User' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    if (cred) {
      const cfg = getAppConfig();
      cfg.biometricCredId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
      cfg.pinEnabled = true;
      await putRecord('settings', cfg); await loadAllData(); render();
      showToast('✓ تم تفعيل الفتح بالبصمة / الوجه بنجاح');
    }
  } catch (e) { showToast('تعذر تسجيل البصمة — تأكد من تفعيل قفل الشاشة على موبايلك'); }
}

async function triggerBiometricUnlock() {
  const cfg = getAppConfig();
  if (!cfg.biometricCredId) return;
  try {
    const rawId = Uint8Array.from(atob(cfg.biometricCredId), c => c.charCodeAt(0));
    const challenge = window.crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({
      publicKey: { challenge, allowCredentials: [{ id: rawId, type: 'public-key' }], userVerification: 'required', timeout: 60000 }
    });
    if (assertion) {
      document.getElementById('pinOverlay').classList.add('hidden');
      document.getElementById('pinOverlay').classList.remove('flex');
      enteredPin = ''; resetIdleLockTimer();
    }
  } catch (e) { showToast('فشل التحقق بالبصمة — استخدم رمز PIN'); }
}

let routeHistory = ['home'], isModalOpen = false, isDrawerOpen = false, lastExitAttempt = 0;

function initHistoryGuard() {
  try { history.replaceState({ page: 'home', depth: 0 }, '', '#home'); } catch (e) {}
  window.addEventListener('popstate', () => {
    if (isModalOpen) { closeModal(); pushGuardState(state.route); return; }
    if (isDrawerOpen) { closeDrawer(); pushGuardState(state.route); return; }
    if (routeHistory.length > 1) {
      routeHistory.pop();
      const prevRoute = routeHistory[routeHistory.length - 1] || 'home';
      applyRoute(prevRoute, false); pushGuardState(prevRoute); return;
    }
    const now = Date.now();
    if (now - lastExitAttempt < 2000) return;
    lastExitAttempt = now;
    showToast('اضغط رجوع مرة أخرى للخروج من التطبيق');
    pushGuardState('home');
  });
}

function pushGuardState(route) { try { history.pushState({ page: route, t: Date.now() }, '', '#' + route); } catch (e) {} }

function goBackStep() {
  if (isModalOpen) { closeModal(); return; }
  if (isDrawerOpen) { closeDrawer(); return; }
  if (routeHistory.length > 1) { routeHistory.pop(); applyRoute(routeHistory[routeHistory.length - 1] || 'home', false); }
  else if (state.route !== 'home') applyRoute('home', false);
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      STORES.forEach((s) => { if (!database.objectStoreNames.contains(s)) database.createObjectStore(s, { keyPath: 'id' }); });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function getAllStore(storeName) {
  return new Promise((resolve) => {
    if (!db.objectStoreNames.contains(storeName)) return resolve([]);
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function putRecord(storeName, obj) {
  return new Promise(async (resolve, reject) => {
    try {
      if (!db.objectStoreNames.contains(storeName)) {
        const nextVer = (db.version || DB_VERSION) + 1;
        db.close();
        db = await new Promise((res, rej) => {
          const req = indexedDB.open(DB_NAME, nextVer);
          req.onupgradeneeded = (e) => {
            const database = e.target.result;
            STORES.forEach((s) => { if (!database.objectStoreNames.contains(s)) database.createObjectStore(s, { keyPath: 'id' }); });
          };
          req.onsuccess = (e) => res(e.target.result);
          req.onerror = (e) => rej(e.target.error);
        });
      }
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(obj);
      tx.oncomplete = () => resolve(obj);
      tx.onerror = (e) => reject(e.target.error);
    } catch (err) {
      reject(err);
    }
  });
}

function deleteRecord(storeName, id) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
  });
}

function clearStore(storeName) {
  return new Promise((resolve) => {
    if (!db.objectStoreNames.contains(storeName)) return resolve();
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve();
  });
}

async function loadAllData() {
  for (const s of STORES) state.data[s] = await getAllStore(s);
  updateRoleBadges(); updateAlertsBadge(); updateDrawerStorageHealth();
}

async function logAudit(action, entity, details, gpsStr = '') {

    role: getAppConfig().roleMode === 'rep' ? 'مندوب' : 'مدير', gps: gpsStr, action, entity, details
  });
}

function uid(prefix = 'id') { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
function todayStr(offsetDays = 0) { const d = new Date(Date.now() + offsetDays * 86400000); return d.toISOString().split('T')[0]; }
function fmtMoney(n) { return Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ج.م'; }

function getAllTerritories() {
  const set = new Set();
  (state.data.customers || []).forEach(c => { if (c.area && c.area.trim()) set.add(c.area.trim()); });
  (state.data.stations || []).forEach(s => { if (s.area && s.area.trim()) set.add(s.area.trim()); });
  return Array.from(set);
}

function matchesTerritory(areaStr) { if (state.territoryFilter === 'all') return true; return (areaStr || '').trim() === state.territoryFilter; }

function getQuickGpsStamp() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve('');
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),

let toastTimer = null;
function showToast(msg, undoCallback = null) {
  const box = document.getElementById('toastBox'), msgEl = document.getElementById('toastMsg'), undoBtn = document.getElementById('toastUndoBtn');
  msgEl.textContent = msg;
  if (undoCallback) {
    undoBtn.classList.remove('hidden');
    undoBtn.onclick = async () => { box.classList.add('hidden'); box.classList.remove('flex'); await undoCallback(); };
  } else undoBtn.classList.add('hidden');
  box.classList.remove('hidden'); box.classList.add('flex');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.classList.add('hidden'); box.classList.remove('flex'); }, undoCallback ? 5000 : 2800);
}

function getSystemAlertsList() {
  const alerts = [], cfg = getAppConfig(), today = todayStr(0), in60Days = todayStr(60);
  state.data.customers.forEach(c => {
    const bal = getCustomerBalance(c.id);
    if (c.creditLimit > 0 && bal > c.creditLimit) alerts.push({ type: 'danger', title: `تجاوز حد الائتمان: ${c.name}`, sub: `الرصيد ${fmtMoney(bal)} يتخطى الحد ${fmtMoney(c.creditLimit)}`, action: `openCustomer360Modal('${c.id}')` });
    else if (isCustomerOverdue(c.id)) alerts.push({ type: 'warn', title: `مديونية متأخرة (+${cfg.overdueDays} يوم): ${c.name}`, sub: `المستحق: ${fmtMoney(bal)}`, action: `openCustomer360Modal('${c.id}')` });
  });
  state.data.invoices.filter(i => i.promiseDate && i.promiseDate <= todayStr(2) && (Number(i.total) - Number(i.paidAmount || 0)) > 0).forEach(inv => {
    const c = state.data.customers.find(x => x.id === inv.customerId);
    const rem = Number(inv.total) - Number(inv.paidAmount || 0);
    alerts.push({ type: 'warn', title: `موعد قسط / وعد سداد: ${c ? c.name : ''}`, sub: `فاتورة ${inv.number} • المتبقي: ${fmtMoney(rem)} • الموعد: ${inv.promiseDate}`, action: `openPaymentModal('', '${inv.customerId}', '${inv.id}')` });
  });
  state.data.products.forEach(p => {
    const tot = getProductTotalStock(p.id);
    if (tot <= Number(p.minQty || 0)) alerts.push({ type: 'warn', title: `نقص مخزون: ${p.name}`, sub: `المتاح حالياً ${tot} ${p.unit} (حد الطلب: ${p.minQty})`, action: `navigate('inventory')` });
    if (p.expiryDate && p.expiryDate <= in60Days) alerts.push({ type: 'danger', title: `تنبيه صلاحية لوط: ${p.name}`, sub: `لوط ${p.batchNo || '-'} ينتهي في ${p.expiryDate}`, action: `navigate('inventory')` });
  });
  state.data.visits.filter(v => !v.followUpDone && v.nextFollowUp && v.nextFollowUp <= today).forEach(v => {
    const sta = state.data.stations.find(s => s.id === v.stationId), cust = state.data.customers.find(c => c.id === v.customerId);
    alerts.push({ type: 'info', title: `موعد متابعة مستحق: ${sta ? sta.name : (cust ? cust.name : 'زيارة')}`, sub: `الموعد: ${v.nextFollowUp}`, action: `openNewVisitModal('${v.customerId || ''}', '${v.stationId || ''}')` });
  });
  (state.data.notes || []).filter(n => n.kind === 'task' && !n.done && n.dueDate && n.dueDate <= today).forEach(n => {
    const cust = n.customerId ? state.data.customers.find(c => c.id === n.customerId) : null;
    const sta = n.stationId ? state.data.stations.find(s => s.id === n.stationId) : null;
    const linkName = cust ? cust.name : (sta ? sta.name : '');
    const isOverdue = n.dueDate < today;
    alerts.push({
      type: n.priority === 'urgent' || isOverdue ? 'danger' : 'info',
      title: `${isOverdue ? 'مهمة متأخرة' : 'مهمة اليوم'}: ${n.title}`,
      sub: `الموعد: ${n.dueDate}${linkName ? ' • مرتبط بـ: ' + linkName : ''}`,
      action: `navigate('notes')`
    });
  });

  return alerts;
}

function startVoiceDictation(targetInputId, btnEl) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return showToast('الإملاء الصوتي غير مدعوم في هذا المتصفح');
  const rec = new SpeechRec();
  rec.lang = 'ar-EG'; rec.interimResults = false; rec.maxAlternatives = 1;
  const origHtml = btnEl.innerHTML; btnEl.innerHTML = '🔴 استماع...';
  rec.onresult = (e) => { const field = document.getElementById(targetInputId); if (field) field.value = (field.value ? field.value + ' ' : '') + e.results[0][0].transcript; };
  rec.onerror = () => showToast('تعذر التقاط الصوت');
  rec.onend = () => { btnEl.innerHTML = origHtml; };
  rec.start();
}

function openBarcodeScannerModal(onDetectedCallbackName) {
  if (!('BarcodeDetector' in window)) return showToast('قارئ الباركود غير مدعوم على هذا المتصفح — اختر الصنف من القائمة');
  openModal(`
    <div class="flex items-center justify-between mb-3"><h3 class="font-extrabold text-base text-brand-dyn">📷 مسح كود العبوة بالكاميرا</h3><button onclick="stopBarcodeStream(); closeModal();" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button></div>
    <video id="barcodeVideo" autoplay playsinline class="w-full h-56 object-cover rounded-2xl bg-black mb-2"></video>
    <p class="text-[11px] text-center text-muted-dyn">وجّه الكاميرا نحو باركود أو QR الباكت...</p>
  `);
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    window._activeBarcodeStream = stream;
    const video = document.getElementById('barcodeVideo'); if (video) video.srcObject = stream;
    const detector = new BarcodeDetector();
    const scanLoop = async () => {
      if (!window._activeBarcodeStream || !document.getElementById('barcodeVideo')) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length > 0) { const val = codes[0].rawValue; stopBarcodeStream(); closeModal(); if (typeof window[onDetectedCallbackName] === 'function') window[onDetectedCallbackName](val); return; }
      } catch (e) {}
      requestAnimationFrame(scanLoop);
    };
    requestAnimationFrame(scanLoop);
  }).catch(() => { closeModal(); showToast('تعذر فتح الكاميرا'); });
}

function stopBarcodeStream() { if (window._activeBarcodeStream) { window._activeBarcodeStream.getTracks().forEach(t => t.stop()); window._activeBarcodeStream = null; } }

function handleScannedProductForInvoice(scannedCode) {

// ==================== GEO-PROXIMITY AUTO-SUGGEST ====================
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = (v) => (v * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function detectNearbyLocation(bannerId) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
      let nearest = null;
      state.data.stations.forEach(s => { if (s.lat && s.lng) { const d = calcDistanceMeters(uLat, uLng, Number(s.lat), Number(s.lng)); if (d <= 2500 && (!nearest || d < nearest.dist)) nearest = { type: 'station', id: s.id, name: s.name, dist: Math.round(d) }; } });
      state.data.customers.forEach(c => { if (c.lat && c.lng) { const d = calcDistanceMeters(uLat, uLng, Number(c.lat), Number(c.lng)); if (d <= 2500 && (!nearest || d < nearest.dist)) nearest = { type: 'customer', id: c.id, name: c.name, dist: Math.round(d) }; } });
      const banner = document.getElementById(bannerId);
      if (banner && nearest) {
        banner.classList.remove('hidden');
        banner.innerHTML = `<div class="flex items-center justify-between gap-2"><div><div class="font-extrabold text-brand-dyn">📍 موقع قريب مكتشف تلقائياً:</div><div>أنت على بُعد <strong>${nearest.dist} متر</strong> من (${nearest.name})</div></div><button type="button" onclick="applyNearbyMatch('${nearest.type}', '${nearest.id}')" class="btn-primary text-[11px] py-1.5 px-3 min-h-0">اختيار</button></div>`;
      }
    },
    () => {}, { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
  );
}

function applyNearbyMatch(type, id) {
  if (type === 'station') { const sel = document.getElementById('vStation'); if (sel) { sel.value = id; renderStationTrialCheckboxes(id); } }
  else if (type === 'customer') { const sel = document.getElementById('vCust'); if (sel) sel.value = id; }
  showToast('تم تحديد الموقع تلقائياً');
}

// ==================== FINANCIAL & STOCK CALCULATIONS ====================
function getStockQty(warehouseId, productId) { const rec = state.data.stock.find(s => s.warehouseId === warehouseId && s.productId === productId); return rec ? Number(rec.qty || 0) : 0; }

async function adjustStock(warehouseId, productId, delta, movementType = 'حركة مخزنية', note = '') {
  const id = `${warehouseId}__${productId}`, current = getStockQty(warehouseId, productId), nextQty = Math.max(0, current + Number(delta));
  await putRecord('stock', { id, warehouseId, productId, qty: nextQty });
  if (Number(delta) !== 0) {
    await putRecord('stock_movements', { id: uid('mov'), date: todayStr(0), time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), warehouseId, productId, delta: Number(delta), balanceAfter: nextQty, type: movementType, note });
  }
}


function getProductPhotos(p) {
  if (!p) return [];
  const arr = Array.isArray(p.photos) ? p.photos.filter(Boolean) : [];
  if (arr.length > 0) return arr;
  return p.photo ? [p.photo] : [];
}

function getProductTotalStock(productId) { return state.data.stock.filter(s => s.productId === productId).reduce((sum, s) => sum + Number(s.qty || 0), 0); }

function getProductLastMovementDays(productId) {
  const movs = (state.data.stock_movements || []).filter(m => m.productId === productId && Number(m.delta) < 0);
  if (movs.length === 0) return 999;
  return Math.max(0, Math.floor((Date.now() - new Date(movs.map(m => m.date).sort().reverse()[0]).getTime()) / 86400000));
}

function getCustomerLastPriceForProduct(customerId, productId) {
  if (!customerId || !productId) return null;
  const custInvs = state.data.invoices.filter(i => i.customerId === customerId && Array.isArray(i.items) && i.items.some(it => it.productId === productId)).sort((a, b) => b.date.localeCompare(a.date));
  if (custInvs.length === 0) return null;
  const lastInv = custInvs[0], item = lastInv.items.find(it => it.productId === productId);
  return item ? { price: Number(item.price), date: lastInv.date, number: lastInv.number } : null;
}

function getCustomerBalance(customerId) {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return 0;
  let bal = Number(c.openingBalance || 0);
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => { bal += Number(i.total || 0) - Number(i.paidAmount || 0); });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => { bal -= Number(p.amount || 0); });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => { bal -= Number(r.total || 0); });
  return bal;
}

function getCustomerOldestUnpaidDays(customerId) {
  const bal = getCustomerBalance(customerId);
  if (bal <= 0) return 0;
  const unpaidInvs = state.data.invoices.filter(i => i.customerId === customerId && (Number(i.total) - Number(i.paidAmount || 0)) > 0).map(i => i.date).sort();
  if (unpaidInvs.length === 0) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(unpaidInvs[0]).getTime()) / 86400000));
}

function isCustomerOverdue(customerId) { return getCustomerOldestUnpaidDays(customerId) > getAppConfig().overdueDays; }

function getCustomerLedger(customerId, fromDate = '', toDate = '') {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return [];
  const entries = [];
  if (Number(c.openingBalance || 0) !== 0) {
    entries.push({ date: '0000-00-00', displayDate: 'رصيد افتتاحي', type: 'افتتاحي', ref: 'رصيد أول المدة', debit: Number(c.openingBalance) > 0 ? Number(c.openingBalance) : 0, credit: Number(c.openingBalance) < 0 ? Math.abs(Number(c.openingBalance)) : 0 });
  }
  state.data.invoices.filter(i => i.customerId === customerId).forEach(i => {
    entries.push({ date: i.date, displayDate: i.date, type: 'فاتورة بيع', ref: i.number + (i.note ? ' - ' + i.note : ''), debit: Number(i.total || 0), credit: 0 });
    if (Number(i.paidAmount || 0) > 0) entries.push({ date: i.date, displayDate: i.date, type: 'سداد مع الفاتورة', ref: i.number, debit: 0, credit: Number(i.paidAmount || 0) });
  });
  state.data.payments.filter(p => p.customerId === customerId).forEach(p => { entries.push({ date: p.date, displayDate: p.date, type: 'سند تحصيل', ref: p.note || p.method || 'تحصيل', debit: 0, credit: Number(p.amount || 0) }); });
  state.data.returns.filter(r => r.customerId === customerId).forEach(r => { entries.push({ date: r.date, displayDate: r.date, type: 'مرتجع مبيعات', ref: `${r.productName} (×${r.qty})` + (r.reason ? ' - ' + r.reason : ''), debit: 0, credit: Number(r.total || 0) }); });
  entries.sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  return entries.map(e => { running += (e.debit - e.credit); return { ...e, balance: running }; }).filter(e => {
    if (e.date === '0000-00-00') return true;
    if (fromDate && e.date < fromDate) return false;
    if (toDate && e.date > toDate) return false;
    return true;
  });
}


function getInvoiceAccountSnapshot(inv) {
  const c = state.data.customers.find(x => x.id === inv.customerId);
  if (!c) {
    const invTotal = Number(inv.total || 0);
    const paid = Number(inv.paidAmount || 0);
    const invRem = Math.max(0, invTotal - paid);
    return { prevBalance: 0, invTotal, totalBalance: invTotal, paid, invRem, totalRemainingDebt: invRem, currentLiveBalance: invRem };
  }

  const events = [];
  state.data.invoices.filter(i => i.customerId === inv.customerId).forEach((i, idx) => {
    events.push({ kind: 'inv', id: i.id, date: i.date || '', order: idx, delta: Number(i.total || 0) - Number(i.paidAmount || 0) });
  });
  state.data.payments.filter(p => p.customerId === inv.customerId).forEach((p, idx) => {
    events.push({ kind: 'pay', id: p.id, date: p.date || '', order: 10000 + idx, delta: -Number(p.amount || 0) });
  });
  state.data.returns.filter(r => r.customerId === inv.customerId).forEach((r, idx) => {
    events.push({ kind: 'ret', id: r.id, date: r.date || '', order: 20000 + idx, delta: -Number(r.total || 0) });
  });

  events.sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order);

  let prevBalance = Number(c.openingBalance || 0);
  for (const ev of events) {
    if (ev.kind === 'inv' && ev.id === inv.id) break;
    prevBalance += ev.delta;
  }

  const invTotal = Number(inv.total || 0);
  const paid = Number(inv.paidAmount || 0);
  const totalBalance = prevBalance + invTotal;
  const invRem = Math.max(0, invTotal - paid);
  const totalRemainingDebt = totalBalance - paid;
  const currentLiveBalance = getCustomerBalance(inv.customerId);

  return { prevBalance, invTotal, totalBalance, paid, invRem, totalRemainingDebt, currentLiveBalance };
}

// ==================== UNIFIED TREASURY + SEPARATE POCKETS ====================
function getUnifiedTreasuryEntries(fromDate = '', toDate = '') {
  const entries = [];
  state.data.payments.forEach(p => {
    const c = state.data.customers.find(x => x.id === p.customerId);
    entries.push({ id: p.id, sourceStore: 'payments', pocket: 'collections', date: p.date, direction: 'in', type: 'سند تحصيل عميل', title: c ? c.name : 'عميل', sub: `${p.method || 'نقدي'}${p.note ? ' • ' + p.note : ''}`, amount: Number(p.amount || 0) });
  });
  state.data.invoices.filter(i => Number(i.paidAmount || 0) > 0).forEach(i => {
    const c = state.data.customers.find(x => x.id === i.customerId);
    entries.push({ id: i.id, sourceStore: 'invoices', pocket: 'collections', date: i.date, direction: 'in', type: 'سداد مع فاتورة', title: `${i.number} • ${c ? c.name : ''}`, sub: i.paymentMode === 'cash' ? 'فاتورة نقدية' : 'دفعة مقدمة مع الفاتورة', amount: Number(i.paidAmount || 0) });
  });
  (state.data.cash_handovers || []).forEach(h => {
    entries.push({ id: h.id, sourceStore: 'cash_handovers', pocket: h.direction === 'in' ? 'petty_cash' : 'collections', date: h.date, direction: h.direction === 'in' ? 'in' : 'out', type: h.direction === 'in' ? 'استلام عهدة من الشركة' : 'توريد نقدية للشركة', title: h.direction === 'in' ? 'تغذية عهدة مصاريف' : 'توريد تحصيلات للشركة', sub: `${h.method || ''}${h.note ? ' • ' + h.note : ''}`, amount: Number(h.amount || 0) });
  });
  state.data.expenses.forEach(e => { entries.push({ id: e.id, sourceStore: 'expenses', pocket: 'petty_cash', date: e.date, direction: 'out', type: 'مصروف ميداني', title: e.category, sub: e.note || '', amount: Number(e.amount || 0) }); });
  state.data.returns.filter(r => r.refundCash).forEach(r => {
    const c = state.data.customers.find(x => x.id === r.customerId);
    entries.push({ id: r.id, sourceStore: 'returns', pocket: 'collections', date: r.date, direction: 'out', type: 'رد نقدي لمرتجع', title: c ? c.name : 'عميل', sub: `${r.productName} (×${r.qty})`, amount: Number(r.total || 0) });
  });
  entries.sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  return entries.map(e => { running += (e.direction === 'in' ? e.amount : -e.amount); return { ...e, runningBalance: running }; }).filter(e => {
    if (fromDate && e.date < fromDate) return false;
    if (toDate && e.date > toDate) return false;
    return true;
  });
}

function getTreasuryBreakdown() {
  const all = getUnifiedTreasuryEntries();
  const totalBalance = all.length > 0 ? all[all.length - 1].runningBalance : 0;
  const collectionsPocket = all.filter(e => e.pocket === 'collections').reduce((s, e) => s + (e.direction === 'in' ? e.amount : -e.amount), 0);
  const pettyCashPocket = all.filter(e => e.pocket === 'petty_cash').reduce((s, e) => s + (e.direction === 'in' ? e.amount : -e.amount), 0);
  return { totalBalance, collectionsPocket, pettyCashPocket };
}
function getTreasuryBalance() { return getTreasuryBreakdown().totalBalance; }

// ==================== IMAGE COMPRESSION & GPS HELPERS ====================
function compressImageFile(file, applyWatermark = false) {
  return new Promise((resolve) => {
    const origKB = Math.round(file.size / 1024), reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1024; let w = img.width, h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) { if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; } else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; } }
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const finishEncode = () => {
          const dataUrl = canvas.toDataURL('image/jpeg', 0.74);
          resolve({ dataUrl, origKB, compKB: Math.round((dataUrl.length * 3) / 4 / 1024) });
        };

        if (applyWatermark && getAppConfig().watermarkPhotos) {
          const logoImg = new Image();
          logoImg.onload = () => {
            const badgeW = Math.max(115, Math.round(w * 0.22));
            const badgeH = Math.round(badgeW * (logoImg.height / Math.max(1, logoImg.width)));
            const pad = 12;
            const bx = pad;
            const by = h - badgeH - pad - 8;
            ctx.save();
            ctx.globalAlpha = 0.88;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.roundRect(bx - 6, by - 4, badgeW + 12, badgeH + 8, 10);
            ctx.fill();
            ctx.globalAlpha = 0.96;
            ctx.drawImage(logoImg, bx, by, badgeW, badgeH);
            ctx.restore();
            finishEncode();
          };
          logoImg.onerror = finishEncode;
          logoImg.src = COMPANY_LOGO;
        } else {
          finishEncode();
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function captureGPS(latInputId, lngInputId, statusId) {
  const st = document.getElementById(statusId);
  if (!navigator.geolocation) { if (st) st.textContent = 'المتصفح لا يدعم تحديد الموقع'; return; }
  if (st) st.textContent = 'جاري التقاط الإحداثيات...';
  navigator.geolocation.getCurrentPosition(
    (pos) => { document.getElementById(latInputId).value = pos.coords.latitude.toFixed(6); document.getElementById(lngInputId).value = pos.coords.longitude.toFixed(6); if (st) st.textContent = `تم الالتقاط بدقة ${Math.round(pos.coords.accuracy)} متر`; },
    () => { if (st) st.textContent = 'تعذر الوصول للموقع — تأكد من تفعيل GPS'; }, { enableHighAccuracy: true, timeout: 10000 }
  );
}


// ==================== SMART FIELD NOTEBOOK, DRAFTS & TO-DO PLANNER ====================
function getPriorityBadgeHtml(prio) {
  if (prio === 'urgent') return `<span class="badge-pill bg-red-100 text-red-700">🔴 عاجل</span>`;
  if (prio === 'medium') return `<span class="badge-pill bg-amber-100 text-amber-800">🟡 متوسط</span>`;
  return `<span class="badge-pill bg-emerald-100 text-emerald-800">🟢 عادي</span>`;
}

function getRepeatLabel(rep) {
  if (rep === 'weekly') return '🔁 أسبوعي';
  if (rep === 'monthly') return '🔁 شهري';
  return '';
}

function renderNotesAndTasks() {
  const allNotes = state.data.notes || [];
  const tab = state.notesTab || 'tasks';
  const q = (state.notesSearch || '').trim().toLowerCase();
  const today = todayStr(0);

  const activeTasks = allNotes.filter(n => n.kind === 'task' && !n.done);
  const memosList = allNotes.filter(n => n.kind === 'memo');
  const archivedTasks = allNotes.filter(n => n.kind === 'task' && !!n.done);

  const matchesSearch = (n) => {
    if (!q) return true;
    const cust = n.customerId ? state.data.customers.find(c => c.id === n.customerId) : null;
    const sta = n.stationId ? state.data.stations.find(s => s.id === n.stationId) : null;
    return (n.title || '').toLowerCase().includes(q) ||
           (n.body || '').toLowerCase().includes(q) ||
           (cust?.name || '').toLowerCase().includes(q) ||
           (sta?.name || '').toLowerCase().includes(q);
  };

  let displayList = [];
  if (tab === 'tasks') {
    displayList = activeTasks
      .filter(n => matchesSearch(n) && (state.notesPriorityFilter === 'all' || n.priority === state.notesPriorityFilter))
      .sort((a, b) => {
        if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
        const dA = a.dueDate || '9999-12-31', dB = b.dueDate || '9999-12-31';
        return dA.localeCompare(dB);
      });
  } else if (tab === 'memos') {
    displayList = memosList
      .filter(matchesSearch)
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  } else {
    displayList = archivedTasks
      .filter(matchesSearch)
      .sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  }

  return `
    <!-- Sub-Tabs: Scheduled Tasks | Free Memos/Drafts | Completed Archive -->
    <div class="grid grid-cols-3 gap-1.5 subtle-box p-1 rounded-2xl text-xs font-extrabold">
      <button onclick="state.notesTab='tasks'; render();" class="py-2 rounded-xl border-0 ${tab==='tasks' ? 'bg-brand-dyn text-white' : 'text-muted-dyn'}" style="${tab==='tasks'?'':'background:transparent;'}">✅ المهام (${activeTasks.length})</button>
      <button onclick="state.notesTab='memos'; render();" class="py-2 rounded-xl border-0 ${tab==='memos' ? 'bg-brand-dyn text-white' : 'text-muted-dyn'}" style="${tab==='memos'?'':'background:transparent;'}">📝 المسودات (${memosList.length})</button>
      <button onclick="state.notesTab='done'; render();" class="py-2 rounded-xl border-0 ${tab==='done' ? 'bg-brand-dyn text-white' : 'text-muted-dyn'}" style="${tab==='done'?'':'background:transparent;'}">🗂️ المنجزات (${archivedTasks.length})</button>
    </div>

    <!-- Primary Action Buttons -->
    <div class="grid grid-cols-2 gap-2 text-xs">
      <button onclick="openNoteTaskModal('', 'task')" class="btn-primary py-3">+ مهمة بموعد وتذكير</button>
      <button onclick="openNoteTaskModal('', 'memo')" class="btn-gold py-3">+ مسودة / ملاحظة حرة</button>
    </div>

    <!-- Search & Share Bar -->
    <div class="flex gap-2">
      <input type="search" value="${state.notesSearch || ''}" oninput="state.notesSearch=this.value; render();" placeholder="بحث في المهام، المسودات، أو العملاء..." class="input-field py-2 text-xs flex-1" />
      <button onclick="shareNotesSummaryWhatsApp()" class="btn-tonal text-xs py-2 px-3 min-h-0 shrink-0" title="مشاركة القائمة واتساب">💬</button>
      <button onclick="printNotesChecklistPDF()" class="btn-tonal text-xs py-2 px-3 min-h-0 shrink-0" title="طباعة القائمة PDF">🖨️</button>
    </div>

    ${tab === 'tasks' ? `
      <div class="flex gap-1.5 overflow-x-auto pb-0.5 text-[11px] font-extrabold">
        <button onclick="state.notesPriorityFilter='all'; render();" class="px-3 py-1 rounded-full border-0 ${state.notesPriorityFilter==='all' ? 'bg-brand-dyn text-white' : 'subtle-box text-muted-dyn'}">الكل (${activeTasks.length})</button>
        <button onclick="state.notesPriorityFilter='urgent'; render();" class="px-3 py-1 rounded-full border-0 ${state.notesPriorityFilter==='urgent' ? 'bg-red-700 text-white' : 'subtle-box text-muted-dyn'}">🔴 عاجل</button>
        <button onclick="state.notesPriorityFilter='medium'; render();" class="px-3 py-1 rounded-full border-0 ${state.notesPriorityFilter==='medium' ? 'bg-amber-600 text-white' : 'subtle-box text-muted-dyn'}">🟡 متوسط</button>
        <button onclick="state.notesPriorityFilter='normal'; render();" class="px-3 py-1 rounded-full border-0 ${state.notesPriorityFilter==='normal' ? 'bg-emerald-700 text-white' : 'subtle-box text-muted-dyn'}">🟢 عادي</button>
      </div>
    ` : ''}

    <!-- Cards Feed -->
    <div class="space-y-2.5">
      ${displayList.length === 0 ? `
        <div class="m3-card p-6 text-center space-y-2 text-xs text-muted-dyn">
          <div class="font-extrabold text-sm">${tab === 'tasks' ? 'لا توجد مهام مجدولة حالياً' : (tab === 'memos' ? 'لا توجد مسودات أو ملاحظات محفوظة' : 'سجل المنجزات فارغ بعد')}</div>
          <p>استخدم الأزرار بالأعلى لتسجيل مهامك اليومية أو ملاحظاتك الميدانية بسرعة.</p>
        </div>
      ` : displayList.map(n => {
        const cust = n.customerId ? state.data.customers.find(c => c.id === n.customerId) : null;
        const sta = n.stationId ? state.data.stations.find(s => s.id === n.stationId) : null;
        const prod = n.productId ? state.data.products.find(p => p.id === n.productId) : null;
        const isOverdue = n.kind === 'task' && !n.done && n.dueDate && n.dueDate < today;
        const isDueToday = n.kind === 'task' && !n.done && n.dueDate && n.dueDate === today;

        return `
          <div class="m3-card p-3.5 text-xs space-y-2.5 border-r-4 ${n.done ? 'border-r-emerald-600' : (isOverdue ? 'border-r-red-600' : (n.priority === 'urgent' ? 'border-r-red-500' : (n.kind === 'memo' ? 'border-r-amber-500' : 'border-r-purple-600')))}">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-start gap-2.5 min-w-0">
                ${n.kind === 'task' ? `
                  <input type="checkbox" ${n.done ? 'checked' : ''} onchange="toggleNoteTaskDone('${n.id}')" class="mt-1 w-4 h-4 accent-[#0E5A36] cursor-pointer shrink-0" />
                ` : `<span class="text-base shrink-0">📝</span>`}
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    ${n.pinned ? `<span class="badge-pill bg-amber-100 text-amber-900">📌 مثبت</span>` : ''}
                    ${n.kind === 'task' ? getPriorityBadgeHtml(n.priority) : `<span class="badge-pill subtle-box">مسودة حرة</span>`}
                    ${n.dueDate ? `<span class="badge-pill ${isOverdue ? 'bg-red-100 text-red-700' : (isDueToday ? 'bg-purple-100 text-purple-900' : 'subtle-box')}">📅 ${n.dueDate}${isOverdue ? ' (متأخر)' : (isDueToday ? ' (اليوم)' : '')}</span>` : ''}
                    ${n.repeat && n.repeat !== 'none' ? `<span class="badge-pill bg-brand-soft-dyn">${getRepeatLabel(n.repeat)}</span>` : ''}
                  </div>
                  <div class="font-black text-sm leading-snug" style="text-decoration:${n.done ? 'line-through' : 'none'}; opacity:${n.done ? '0.65' : '1'};">${n.title}</div>
                </div>
              </div>
              <button onclick="toggleNotePin('${n.id}')" class="subtle-box rounded-lg px-2 py-1 text-[11px] shrink-0" title="${n.pinned ? 'إلغاء التثبيت' : 'تثبيت في الأعلى'}">${n.pinned ? '📌' : '📍'}</button>
            </div>

            ${n.body ? `<p class="text-xs subtle-box p-2.5 rounded-xl leading-relaxed text-muted-dyn">${n.body}</p>` : ''}

            <!-- Linked Context Chips (Customer / Station / Product) -->
            ${(cust || sta || prod) ? `
              <div class="flex flex-wrap gap-1.5 text-[10.5px]">
                ${cust ? `<button onclick="openCustomer360Modal('${cust.id}')" class="btn-tonal py-1 px-2.5 min-h-0 text-[10.5px]">👤 ${cust.name}</button>` : ''}
                ${sta ? `<button onclick="openStationDetailModal('${sta.id}')" class="btn-tonal py-1 px-2.5 min-h-0 text-[10.5px]">🏡 ${sta.name}</button>` : ''}
                ${prod ? `<span class="badge-pill subtle-box">🌱 ${prod.name}</span>` : ''}
              </div>
            ` : ''}

            <!-- Actionable Draft & Task Controls -->
            <div class="flex flex-wrap items-center gap-1.5 pt-1 border-t">
              ${n.kind === 'task' && !n.done ? `
                <button onclick="completeNoteTask('${n.id}')" class="btn-primary text-[11px] py-1.5 px-3 min-h-0">✓ إنجاز</button>
                <button onclick="snoozeNoteTask('${n.id}', 1)" class="subtle-box rounded-xl text-[11px] font-bold px-2.5 py-1.5">⏳ تأجيل غداً</button>
              ` : ''}
              <button onclick="openConvertDraftSheet('${n.id}')" class="btn-gold text-[11px] py-1.5 px-2.5 min-h-0">🔄 تحويل لإجراء</button>
              <button onclick="openNoteTaskModal('${n.id}')" class="subtle-box rounded-xl text-[11px] font-bold px-2.5 py-1.5">✏️</button>
              <button onclick="deleteNoteRecord('${n.id}')" class="bg-red-50 text-red-700 rounded-xl text-[11px] font-bold px-2.5 py-1.5 border">🗑️</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function openNoteTaskModal(noteId = '', defaultKind = 'task') {
  const existing = (state.data.notes || []).find(x => x.id === noteId) || {};
  const kind = existing.kind || defaultKind;
  const prio = existing.priority || 'medium';
  const rep = existing.repeat || 'none';

  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-brand-dyn">${existing.id ? 'تعديل المذكرة / المهمة' : (kind === 'task' ? '✅ إضافة مهمة مجدولة وتذكير' : '📝 تسجيل مسودة / ملاحظة حرة')}</h3>
      <button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <!-- Switch Type -->
      <div class="grid grid-cols-2 gap-1.5 subtle-box p-1 rounded-xl font-extrabold">
        <button type="button" id="btnKindTask" onclick="setModalNoteKind('task')" class="py-1.5 rounded-lg border-0 ${kind==='task' ? 'bg-brand-dyn text-white' : 'text-muted-dyn'}" style="${kind==='task'?'':'background:transparent;'}">✅ مهمة بموعد</button>
        <button type="button" id="btnKindMemo" onclick="setModalNoteKind('memo')" class="py-1.5 rounded-lg border-0 ${kind==='memo' ? 'bg-brand-dyn text-white' : 'text-muted-dyn'}" style="${kind==='memo'?'':'background:transparent;'}">📝 مسودة / ملاحظة</button>
      </div>
      <input type="hidden" id="nKind" value="${kind}" />

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="font-bold">العنوان / المطلوب تنفيذه *</label>
          <button type="button" onclick="startVoiceDictation('nTitle', this)" class="text-[10.5px] bg-brand-soft-dyn px-2 py-0.5 rounded-lg font-extrabold border-0">🎤 إملاء</button>
        </div>
        <input id="nTitle" value="${existing.title || ''}" class="input-field" placeholder="مثال: تجهيز طلبية كوسة أو متابعة تحصيل..." />
      </div>

      <div id="nScheduleFields" class="${kind === 'task' ? '' : 'hidden'} space-y-2.5">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="font-bold block mb-1">تاريخ التذكير *</label>
            <input id="nDueDate" type="date" value="${existing.dueDate || todayStr(0)}" class="input-field py-2 text-xs" />
          </div>
          <div>
            <label class="font-bold block mb-1">الأولوية</label>
            <select id="nPriority" class="input-field py-2 text-xs">
              <option value="urgent" ${prio==='urgent'?'selected':''}>🔴 عاجل</option>
              <option value="medium" ${prio==='medium'?'selected':''}>🟡 متوسط</option>
              <option value="normal" ${prio==='normal'?'selected':''}>🟢 عادي</option>
            </select>
          </div>
          <div>
            <label class="font-bold block mb-1">التكرار</label>
            <select id="nRepeat" class="input-field py-2 text-xs">
              <option value="none" ${rep==='none'?'selected':''}>مرة واحدة</option>
              <option value="weekly" ${rep==='weekly'?'selected':''}>أسبوعياً</option>
              <option value="monthly" ${rep==='monthly'?'selected':''}>شهرياً</option>
            </select>
          </div>
        </div>
        <div class="flex gap-1.5 text-[10.5px] font-extrabold">
          <button type="button" onclick="document.getElementById('nDueDate').value=todayStr(0)" class="subtle-box px-2.5 py-1 rounded-lg">اليوم</button>
          <button type="button" onclick="document.getElementById('nDueDate').value=todayStr(1)" class="subtle-box px-2.5 py-1 rounded-lg">غداً</button>
          <button type="button" onclick="document.getElementById('nDueDate').value=todayStr(3)" class="subtle-box px-2.5 py-1 rounded-lg">بعد 3 أيام</button>
          <button type="button" onclick="document.getElementById('nDueDate').value=todayStr(7)" class="subtle-box px-2.5 py-1 rounded-lg">بعد أسبوع</button>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="font-bold">التفاصيل / المسودة</label>
          <button type="button" onclick="startVoiceDictation('nBody', this)" class="text-[10.5px] bg-brand-soft-dyn px-2 py-0.5 rounded-lg font-extrabold border-0">🎤 إملاء التفاصيل</button>
        </div>
        <textarea id="nBody" rows="3" class="input-field" placeholder="اكتب تفاصيل الملاحظة، الأصناف المطلوبة، أو خطوات التنفيذ...">${existing.body || ''}</textarea>
      </div>

      <!-- Optional Context Linking -->
      <div class="subtle-box p-3 rounded-xl space-y-2">
        <div class="font-extrabold text-brand-dyn">🔗 ربط بسجل في النظام (اختياري):</div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-bold block mb-1">عميل</label>
            <select id="nCustomerId" class="input-field py-1.5 text-xs">
              <option value="">-- بدون عميل --</option>
              ${state.data.customers.map(c => `<option value="${c.id}" ${existing.customerId===c.id?'selected':''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-[10px] font-bold block mb-1">محطة تجارب</label>
            <select id="nStationId" class="input-field py-1.5 text-xs">
              <option value="">-- بدون محطة --</option>
              ${state.data.stations.map(s => `<option value="${s.id}" ${existing.stationId===s.id?'selected':''}>${s.name}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <label class="flex items-center justify-between subtle-box p-2.5 rounded-xl cursor-pointer">
        <span>📌 تثبيت في أعلى القائمة</span>
        <input type="checkbox" id="nPinned" ${existing.pinned ? 'checked' : ''} />
      </label>

      <button onclick="saveNoteTask('${existing.id || ''}')" class="btn-primary w-full py-3 text-sm">حفظ في المفكرة</button>
    </div>
  `);
}

function setModalNoteKind(kind) {
  document.getElementById('nKind').value = kind;
  const sched = document.getElementById('nScheduleFields');
  const bTask = document.getElementById('btnKindTask');
  const bMemo = document.getElementById('btnKindMemo');
  if (sched) sched.classList.toggle('hidden', kind !== 'task');
  if (bTask) {
    bTask.classList.toggle('bg-brand-dyn', kind === 'task');
    bTask.classList.toggle('text-white', kind === 'task');
    bTask.classList.toggle('text-muted-dyn', kind !== 'task');
    bTask.style.background = kind === 'task' ? '' : 'transparent';
  }
  if (bMemo) {
    bMemo.classList.toggle('bg-brand-dyn', kind === 'memo');
    bMemo.classList.toggle('text-white', kind === 'memo');
    bMemo.classList.toggle('text-muted-dyn', kind !== 'memo');
    bMemo.style.background = kind === 'memo' ? '' : 'transparent';
  }
}

async function saveNoteTask(id = '') {
  const title = document.getElementById('nTitle').value.trim();
  if (!title) return showToast('أدخل عنوان المهمة أو الملاحظة');
  const kind = document.getElementById('nKind').value;
  const existing = (state.data.notes || []).find(x => x.id === id) || {};

  await putRecord('notes', {
    ...existing,
    id: id || uid('note'),
    kind,
    title,
    body: document.getElementById('nBody').value.trim(),
    dueDate: kind === 'task' ? (document.getElementById('nDueDate').value || todayStr(0)) : '',
    priority: kind === 'task' ? document.getElementById('nPriority').value : 'normal',
    repeat: kind === 'task' ? document.getElementById('nRepeat').value : 'none',
    customerId: document.getElementById('nCustomerId').value || '',
    stationId: document.getElementById('nStationId').value || '',
    pinned: !!document.getElementById('nPinned').checked,
    done: !!existing.done,
    doneAt: existing.doneAt || '',
    createdAt: existing.createdAt || todayStr(0)
  });

  await loadAllData();
  closeModal();
  state.notesTab = kind === 'task' ? 'tasks' : 'memos';
  if (state.route !== 'notes') navigate('notes');
  else render();
  showToast(kind === 'task' ? 'تمت جدولة المهمة وتفعيل التذكير' : 'تم حفظ المسودة بنجاح');
}

async function completeNoteTask(noteId) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  n.done = true;
  n.doneAt = todayStr(0);
  await putRecord('notes', n);

  // If recurring task, automatically schedule the next occurrence
  if (n.repeat === 'weekly' || n.repeat === 'monthly') {
    const offset = n.repeat === 'weekly' ? 7 : 30;
    const baseDate = n.dueDate || todayStr(0);
    const nextDate = new Date(new Date(baseDate).getTime() + offset * 86400000).toISOString().split('T')[0];
    await putRecord('notes', {
      ...n,
      id: uid('note'),
      dueDate: nextDate,
      done: false,
      doneAt: '',
      createdAt: todayStr(0)
    });
    showToast(`✓ تم الإنجاز وجدولة التكرار القادم (${nextDate})`);
  } else {
    showToast('✓ تم نقل المهمة إلى سجل المنجزات');
  }

  await loadAllData();
  render();
}

async function toggleNoteTaskDone(noteId) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  if (!n.done) return completeNoteTask(noteId);
  n.done = false;
  n.doneAt = '';
  await putRecord('notes', n);
  await loadAllData();
  render();
  showToast('تمت إعادة فتح المهمة');
}

async function snoozeNoteTask(noteId, days = 1) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  n.dueDate = todayStr(days);
  await putRecord('notes', n);
  await loadAllData();
  render();
  showToast(`تم تأجيل المهمة إلى ${n.dueDate}`);
}

async function toggleNotePin(noteId) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  n.pinned = !n.pinned;
  await putRecord('notes', n);
  await loadAllData();
  render();
}

async function deleteNoteRecord(noteId) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  const snapshot = { ...n };
  await deleteRecord('notes', noteId);
  await loadAllData();
  render();
  showToast('تم حذف السجل', async () => {
    await putRecord('notes', snapshot);
    await loadAllData();
    render();
    showToast('تم استرجاع السجل');
  });
}

function openConvertDraftSheet(noteId) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-brand-dyn">🔄 تحويل المسودة / المهمة إلى إجراء</h3>
      <button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button>
    </div>
    <p class="text-xs text-muted-dyn mb-3">"${n.title}"</p>
    <div class="space-y-2 text-xs">
      <button onclick="executeDraftConversion('${noteId}', 'invoice')" class="btn-primary w-full py-3 justify-between"><span>🧾 تحويل إلى فاتورة بيع</span><span>فتح الفاتورة</span></button>
      <button onclick="executeDraftConversion('${noteId}', 'quote')" class="btn-gold w-full py-3 justify-between"><span>📋 تحويل إلى عرض سعر</span><span>فتح العرض</span></button>
      <button onclick="executeDraftConversion('${noteId}', 'visit')" class="btn-tonal w-full py-3 justify-between"><span>📍 تحويل إلى زيارة ميدانية</span><span>فتح الزيارة</span></button>
      <button onclick="executeDraftConversion('${noteId}', 'payment')" class="btn-tonal w-full py-3 justify-between"><span>💵 تحويل إلى سند تحصيل</span><span>فتح التحصيل</span></button>
    </div>
  `);
}

function executeDraftConversion(noteId, targetAction) {
  const n = (state.data.notes || []).find(x => x.id === noteId);
  if (!n) return;
  const combinedNote = [n.title, n.body].filter(Boolean).join(' — ');
  closeModal();

  if (targetAction === 'invoice' || targetAction === 'quote') {
    openInvoiceModal('', n.customerId || '', targetAction === 'quote');
    setTimeout(() => {
      const noteEl = document.getElementById('invNote');
      if (noteEl) noteEl.value = combinedNote;
    }, 50);
  } else if (targetAction === 'visit') {
    openNewVisitModal(n.customerId || '', n.stationId || '');
    setTimeout(() => {
      const vNotesEl = document.getElementById('vNotes');
      if (vNotesEl) vNotesEl.value = combinedNote;
    }, 50);
  } else if (targetAction === 'payment') {
    openPaymentModal('', n.customerId || '');
    setTimeout(() => {
      const pNoteEl = document.getElementById('payNote');
      if (pNoteEl) pNoteEl.value = combinedNote;
    }, 50);
  }
}

  switch (state.route) {

function parseSpecsBullets(rawSpecs) {
  if (!rawSpecs || !rawSpecs.trim()) return [];
  return rawSpecs
    .split(/\r?\n|[•\-–]/)
    .map(s => s.trim())
    .filter(Boolean);
}

function toggleCatalogCompare(productId) {
  const idx = state.catalogCompareIds.indexOf(productId);
  if (idx !== -1) state.catalogCompareIds.splice(idx, 1);
  else {
    if (state.catalogCompareIds.length >= 3) return showToast('يمكن مقارنة 3 أصناف كحد أقصى في نفس الوقت');
    state.catalogCompareIds.push(productId);
  }
  render();
}

function getFilteredCatalogProducts() {
  const allProducts = state.data.products;
  const seasonQ = (state.catalogSeasonFilter || 'all').toLowerCase();
  return allProducts.filter(p => {
    if (state.catalogCropFilter !== 'all' && (p.category || '').trim() !== state.catalogCropFilter) return false;
    if (seasonQ !== 'all') {
      const hay = `${p.plantingSeason || ''} ${p.specs || ''} ${p.name || ''}`.toLowerCase();
      if (seasonQ === 'greenhouse' && !hay.includes('صوب') && !hay.includes('محمي')) return false;
      if (seasonQ === 'open' && !hay.includes('مكشوف') && !hay.includes('حقل')) return false;
      if (seasonQ === 'winter' && !hay.includes('شتو') && !hay.includes('خريف') && !hay.includes('برود')) return false;
      if (seasonQ === 'summer' && !hay.includes('صيف') && !hay.includes('حرار') && !hay.includes('نيل')) return false;
    }
    return true;
  });
}

// 1-Click HD Social Card PNG Generator for WhatsApp Sharing
async function shareCatalogCardAsHdImage(productId) {
  const p = state.data.products.find(x => x.id === productId);
  if (!p) return;
  const cfg = getAppConfig();
  const showPrice = !!state.catalogShowPrices;
  const photos = getProductPhotos(p);
  const bullets = parseSpecsBullets(p.specs);

  const canvas = document.createElement('canvas');
  canvas.width = 900;
  canvas.height = photos.length > 0 ? 1180 : 820;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0E5A36';
  ctx.fillRect(0, 0, canvas.width, 130);
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'right';
  ctx.font = '900 30px Cairo, Tahoma, sans-serif';
  ctx.fillText(cfg.companyName, 860, 56);
  ctx.font = '700 18px Cairo, Tahoma, sans-serif';
  ctx.fillStyle = '#D1FAE5';
  ctx.fillText(`كود الصنف: ${p.code} ${p.category ? ' • ' + p.category : ''}`, 860, 96);

  if (showPrice) {
    ctx.fillStyle = '#D99B16';
    ctx.beginPath();
    ctx.roundRect(40, 32, 230, 66, 16);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.font = '900 24px Cairo, Tahoma, sans-serif';
    ctx.fillText(fmtMoney(p.price), 155, 73);
    ctx.textAlign = 'right';
  }

  let curY = 175;
  ctx.fillStyle = '#121E17';
  ctx.font = '900 32px Cairo, Tahoma, sans-serif';
  ctx.fillText(p.name, 860, curY);
  curY += 30;

  const drawSpecsAndFinish = async () => {
    const rows = [
      p.earliness ? `⏱️ التبكير والنضج: ${p.earliness}` : '',
      p.fruitSpecs ? `🥒 مواصفات الثمرة: ${p.fruitSpecs}` : '',
      p.diseaseResistance ? `🛡️ المقاومة المرضية: ${p.diseaseResistance}` : '',
      p.plantingSeason ? `📅 مواعيد الزراعة: ${p.plantingSeason}` : ''
    ].filter(Boolean);

    if (rows.length > 0) {
      ctx.fillStyle = '#F4F8F6';
      ctx.fillRect(40, curY, 820, rows.length * 46 + 24);
      curY += 38;
      ctx.font = '700 20px Cairo, Tahoma, sans-serif';
      ctx.fillStyle = '#121E17';
      rows.forEach(r => {
        ctx.fillText(r, 835, curY);
        curY += 44;
      });
      curY += 20;
    }

    if (bullets.length > 0) {
      ctx.fillStyle = '#0E5A36';
      ctx.font = '900 22px Cairo, Tahoma, sans-serif';
      ctx.fillText('🌟 المميزات والتوصيات الفنية:', 860, curY);
      curY += 38;
      ctx.fillStyle = '#25362C';
      ctx.font = '700 20px Cairo, Tahoma, sans-serif';
      bullets.slice(0, 5).forEach(b => {
        ctx.fillText(`✓ ${b.slice(0, 68)}`, 850, curY);
        curY += 38;
      });
    }

    ctx.fillStyle = '#0E5A36';
    ctx.fillRect(0, canvas.height - 54, canvas.width, 54);
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.font = '700 17px Cairo, Tahoma, sans-serif';
    ctx.fillText(`${cfg.companyName} ${cfg.companyPhone ? ' • ' + cfg.companyPhone : ''}`, 450, canvas.height - 20);

    canvas.toBlob(async (blob) => {
      const file = new File([blob], `${p.code}_Brochure.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: p.name }); return; } catch (e) {}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${p.code}_Brochure.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('تم تحميل بطاقة الصنف HD جاهزة للإرسال على واتساب');
    }, 'image/png');
  };

  if (photos.length > 0) {
    const img = new Image();
    img.onload = () => {
      const boxW = 820, boxH = 380;
      ctx.fillStyle = '#F8FAF9';
      ctx.fillRect(40, curY, boxW, boxH);
      const ratio = Math.min(boxW / img.width, boxH / img.height);
      const dw = img.width * ratio, dh = img.height * ratio;
      ctx.drawImage(img, 40 + (boxW - dw) / 2, curY + (boxH - dh) / 2, dw, dh);
      curY += boxH + 32;
      drawSpecsAndFinish();
    };
    img.onerror = drawSpecsAndFinish;
    img.src = photos[0];
  } else {
    drawSpecsAndFinish();
  }
}

// Smart Image Dimension & Orientation Inspector (Runs before PDF layout calculation)
function inspectImageDimensions(src) {
  return new Promise((resolve) => {
    if (!src) return resolve({ src: '', w: 0, h: 0, ratio: 1, isPortrait: false });
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || img.width || 800;
      const h = img.naturalHeight || img.height || 600;
      const ratio = w / Math.max(1, h);
      resolve({ src, w, h, ratio, isPortrait: h > w * 1.05 });
    };
    img.onerror = () => resolve({ src, w: 800, h: 600, ratio: 1.33, isPortrait: false });
    img.src = src;
  });
}

// ==================== DETERMINISTIC A4 MAGAZINE PAGE COMPOSITOR (150 DPI EXACT A4 SHEETS) ====================
function loadHtmlImage(src) {
  return new Promise((resolve) => {
    if (!src) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function wrapCanvasLines(ctx, text, maxWidth) {
  if (!text) return [];
  const words = String(text).split(/\s+/);
  const lines = [];
  let current = '';
  for (const w of words) {
    const test = current ? current + ' ' + w : w;
    if (ctx.measureText(test).width <= maxWidth) {
      current = test;
    } else {
      if (current) lines.push(current);
      current = w;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function drawRoundedPanel(ctx, x, y, w, h, r, fill, stroke = null, lineWidth = 1.5) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lineWidth; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}

function drawRightAccentPanel(ctx, x, y, w, h, r, fill, stroke, accentColor, accentW = 10) {
  drawRoundedPanel(ctx, x, y, w, h, r, fill, stroke, 1.5);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x + w - accentW, y, accentW, h, [0, r, r, 0]);
  ctx.fillStyle = accentColor;
  ctx.fill();
  ctx.restore();
}

function drawContainedImage(ctx, img, boxX, boxY, boxW, boxH, radius = 14) {
  if (!img) return;
  const iw = img.naturalWidth || img.width || 1;
  const ih = img.naturalHeight || img.height || 1;
  const ratio = Math.min(boxW / iw, boxH / ih);
  const dw = Math.round(iw * ratio);
  const dh = Math.round(ih * ratio);
  const dx = Math.round(boxX + (boxW - dw) / 2);
  const dy = Math.round(boxY + (boxH - dh) / 2);

  ctx.save();
  ctx.beginPath();
  ctx.roundRect(dx, dy, dw, dh, radius);
  ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

async function renderVarietyA4SheetDataUrl(p, pageIndex, totalPages, pal, cfg, showPrice, logoImg) {
  // Exact A4 Aspect Ratio (210mm x 297mm -> 1240 x 1754 px at 150 DPI)
  const W = 1240, H = 1754;
  const PAD = 56;
  const INNER_W = W - PAD * 2;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.direction = 'rtl';

  // 1. Crisp White Sheet + Editorial Border
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);
  drawRoundedPanel(ctx, 24, 24, W - 48, H - 48, 22, null, pal.tintBorder, 2);

  // 2. Top Architectural Header
  let curY = 50;
  if (logoImg) {
    const lh = 66;
    const lw = Math.round(lh * ((logoImg.naturalWidth || 1) / Math.max(1, logoImg.naturalHeight || 1)));
    ctx.drawImage(logoImg, PAD, curY, lw, lh);
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = pal.primary;
  ctx.font = '900 26px Cairo, Tahoma, Arial, sans-serif';
  ctx.fillText(cfg.companyName, W - PAD, curY + 28);

  ctx.fillStyle = pal.muted;
  ctx.font = '700 17px Cairo, Tahoma, Arial, sans-serif';
  const subContact = [cfg.companyPhone, cfg.companyAddress].filter(Boolean).join('  •  ') || 'الدليل الفني المعتمد لأصناف وهجن الخضر';
  ctx.fillText(subContact, W - PAD, curY + 56);

  curY += 82;
  ctx.fillStyle = pal.primary;
  ctx.fillRect(PAD, curY, INNER_W, 4);
  curY += 20;

  // 3. Variety Hero Title Banner
  ctx.font = '900 35px Cairo, Tahoma, Arial, sans-serif';
  const titleMaxW = showPrice ? INNER_W - 275 : INNER_W - 48;
  const titleLines = wrapCanvasLines(ctx, p.name, titleMaxW);
  const bannerH = Math.max(122, 68 + titleLines.length * 46);

  const grad = ctx.createLinearGradient(W - PAD, curY, PAD, curY + bannerH);
  grad.addColorStop(0, pal.primary);
  grad.addColorStop(1, pal.primaryLight);
  drawRoundedPanel(ctx, PAD, curY, INNER_W, bannerH, 18, grad);

  let badgeX = W - PAD - 24;
  const badgeY = curY + 18;
  ctx.font = '900 17px Cairo, Tahoma, Arial, sans-serif';
  const codeTxt = `كود: ${p.code}`;
  const codeW = ctx.measureText(codeTxt).width + 32;
  drawRoundedPanel(ctx, badgeX - codeW, badgeY, codeW, 34, 999, pal.accent);
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.fillText(codeTxt, badgeX - codeW / 2, badgeY + 23);
  badgeX -= (codeW + 12);

  if (p.category) {
    const catW = ctx.measureText(p.category).width + 30;
    drawRoundedPanel(ctx, badgeX - catW, badgeY, catW, 34, 999, 'rgba(255,255,255,0.2)');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(p.category, badgeX - catW / 2, badgeY + 23);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '900 34px Cairo, Tahoma, Arial, sans-serif';
  titleLines.forEach((line, i) => {
    ctx.fillText(line, W - PAD - 24, curY + 94 + i * 44);
  });

  if (showPrice) {
    const pBoxW = 230, pBoxH = bannerH - 30;
    const pBoxX = PAD + 18, pBoxY = curY + 15;
    drawRoundedPanel(ctx, pBoxX, pBoxY, pBoxW, pBoxH, 14, '#FFFFFF');
    ctx.textAlign = 'center';
    ctx.fillStyle = pal.muted;
    ctx.font = '700 15px Cairo, Tahoma, Arial, sans-serif';
    ctx.fillText('السعر المعتمد', pBoxX + pBoxW / 2, pBoxY + 26);
    ctx.fillStyle = pal.primary;
    ctx.font = '900 26px Cairo, Tahoma, Arial, sans-serif';
    ctx.fillText(fmtMoney(p.price), pBoxX + pBoxW / 2, pBoxY + 58);
    ctx.fillStyle = pal.muted;
    ctx.font = '700 14px Cairo, Tahoma, Arial, sans-serif';
    ctx.fillText(`لكل ${p.unit}`, pBoxX + pBoxW / 2, pBoxY + 80);
  }

  curY += bannerH + 22;

  // 4. Exact Remaining Vertical Space Budget Down to Footer
  const FOOTER_Y = H - 86;
  const availableH = FOOTER_Y - curY - 16;

  const rawPhotos = getProductPhotos(p).slice(0, 3);
  const loadedPhotos = [];
  for (const src of rawPhotos) {
    const im = await loadHtmlImage(src);
    if (im) loadedPhotos.push(im);
  }

  const specFields = [
    p.earliness ? { icon: '⏱️', label: 'التبكير والنضج', val: p.earliness } : null,
    p.fruitSpecs ? { icon: '🥒', label: 'مواصفات الثمرة', val: p.fruitSpecs } : null,
    p.diseaseResistance ? { icon: '🛡️', label: 'المقاومة المرضية (HR / IR)', val: p.diseaseResistance } : null,
    p.plantingSeason ? { icon: '📅', label: 'مواعيد الزراعة المناسبة', val: p.plantingSeason } : null
  ].filter(Boolean);

  const bullets = parseSpecsBullets(p.specs);

  // Adaptive Typography Scale (Expands font sizes & line heights when content is light so the page feels rich and full)
  const totalChars = bullets.join(' ').length + specFields.reduce((s, r) => s + r.val.length, 0);
  const isSparseContent = (specFields.length + bullets.length) <= 4 && totalChars < 240;
  const specLabelSz = isSparseContent ? 18 : 16;
  const specValSz = isSparseContent ? 23 : 20;
  const specLineH = isSparseContent ? 33 : 28;
  const bulletSz = isSparseContent ? 23 : 20;
  const bulletLineH = isSparseContent ? 36 : 30;

  // Helper to measure exact height of specs + bullets for a given width
  const measureTextBlocks = (colW, twoColSpecs = false) => {
    let h = 0;
    if (specFields.length > 0) {
      ctx.font = `800 ${specValSz}px Cairo, Tahoma, Arial, sans-serif`;
      if (twoColSpecs) {
        const halfW = Math.floor((colW - 16) / 2);
        for (let i = 0; i < specFields.length; i += 2) {
          const pair = specFields.slice(i, i + 2);
          const cw = pair.length === 1 ? colW : halfW;
          const rowH = Math.max(...pair.map(sf => 48 + wrapCanvasLines(ctx, sf.val, cw - 36).length * specLineH));
          h += rowH + 14;
        }
      } else {
        specFields.forEach(sf => {
          const lines = wrapCanvasLines(ctx, sf.val, colW - 36);
          h += (48 + lines.length * specLineH + 14);
        });
      }
      h += 8;
    }
    if (bullets.length > 0) {
      ctx.font = `700 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
      let bLines = 0;
      bullets.forEach(b => { bLines += wrapCanvasLines(ctx, b, colW - 64).length; });
      h += (62 + bLines * bulletLineH + 20);
    }
    return h;
  };

  // Helper to render specs & bullets inside a column (used for Side-by-Side Split)
  const drawColumnSpecsAndBullets = (colX, startY, colW, stretchToBottom = false) => {
    let y = startY;
    if (specFields.length > 0) {
      specFields.forEach(sf => {
        ctx.font = `800 ${specValSz}px Cairo, Tahoma, Arial, sans-serif`;
        const valLines = wrapCanvasLines(ctx, sf.val, colW - 36);
        const cardH = 48 + valLines.length * specLineH;
        drawRightAccentPanel(ctx, colX, y, colW, cardH, 13, pal.tint, pal.tintBorder, pal.primary, 8);

        ctx.textAlign = 'right';
        ctx.fillStyle = pal.primary;
        ctx.font = `800 ${specLabelSz}px Cairo, Tahoma, Arial, sans-serif`;
        ctx.fillText(`${sf.icon} ${sf.label}`, colX + colW - 20, y + 28);

        ctx.fillStyle = pal.ink;
        ctx.font = `800 ${specValSz}px Cairo, Tahoma, Arial, sans-serif`;
        valLines.forEach((ln, idx) => {
          ctx.fillText(ln, colX + colW - 20, y + 58 + idx * specLineH);
        });
        y += cardH + 14;
      });
      y += 6;
    }

    if (bullets.length > 0) {
      ctx.font = `700 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
      const wrappedBullets = bullets.map(b => wrapCanvasLines(ctx, b, colW - 64));
      const totalLines = wrappedBullets.reduce((s, arr) => s + arr.length, 0);
      const naturalH = 62 + totalLines * bulletLineH + 18;
      const remainingToFooter = FOOTER_Y - y - 14;
      const boxH = stretchToBottom ? Math.max(naturalH, remainingToFooter) : Math.min(remainingToFooter, naturalH);

      drawRightAccentPanel(ctx, colX, y, colW, boxH, 14, pal.accentSoft, pal.tintBorder, pal.accent, 9);
      ctx.textAlign = 'right';
      ctx.fillStyle = pal.accentText;
      ctx.font = '900 21px Cairo, Tahoma, Arial, sans-serif';
      ctx.fillText('🌟 المميزات والتوصيات الفنية:', colX + colW - 22, y + 34);

      let by = y + 70;
      wrappedBullets.forEach(linesArr => {
        linesArr.forEach((ln, lIdx) => {
          if (by > y + boxH - 14) return;
          if (lIdx === 0) {
            ctx.fillStyle = pal.primary;
            ctx.font = `900 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
            ctx.fillText('✓', colX + colW - 22, by);
          }
          ctx.fillStyle = pal.ink;
          ctx.font = `700 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
          ctx.fillText(ln, colX + colW - 48, by);
          by += bulletLineH;
        });
      });
      y += boxH;
    }
    return y;
  };

  // 5. Full-Page Space-Filling Magazine Layout Engine (Zero Wasted Whitespace)
  const isSinglePortrait = loadedPhotos.length === 1 && ((loadedPhotos[0].naturalHeight || 1) > (loadedPhotos[0].naturalWidth || 1) * 1.05);

  if (isSinglePortrait) {
    // Magazine 2-Column Split: Left 45% Full-Height Portrait Gallery | Right 53% Specs & Highlights stretched cleanly down to Footer
    const gap = 22;
    const rightColW = Math.round(INNER_W * 0.53);
    const leftColW = INNER_W - rightColW - gap;
    const rightColX = PAD + leftColW + gap;
    const leftColX = PAD;

    drawRoundedPanel(ctx, leftColX, curY, leftColW, availableH, 16, pal.tint, pal.tintBorder, 1.5);
    drawContainedImage(ctx, loadedPhotos[0], leftColX + 14, curY + 14, leftColW - 28, availableH - 28, 12);

    drawColumnSpecsAndBullets(rightColX, curY, rightColW, true);
  } else {
    // Top Gallery + 2-Column Spec Grid + Full-Width Highlights Expanded to Fill the Entire A4 Sheet
    const fullTextH = measureTextBlocks(INNER_W, true);

    if (loadedPhotos.length > 0) {
      // Give the photo gallery all remaining vertical space (up to 640px) so there is zero empty bottom margin
      const galleryH = Math.max(300, Math.min(650, availableH - fullTextH - 24));
      if (loadedPhotos.length === 1) {
        drawRoundedPanel(ctx, PAD, curY, INNER_W, galleryH, 16, pal.tint, pal.tintBorder, 1.5);
        drawContainedImage(ctx, loadedPhotos[0], PAD + 16, curY + 16, INNER_W - 32, galleryH - 32, 12);
      } else {
        const gGap = 14;
        const cellW = Math.floor((INNER_W - gGap * (loadedPhotos.length - 1)) / loadedPhotos.length);
        loadedPhotos.forEach((im, idx) => {
          const cx = PAD + idx * (cellW + gGap);
          drawRoundedPanel(ctx, cx, curY, cellW, galleryH, 14, pal.tint, pal.tintBorder, 1.5);
          drawContainedImage(ctx, im, cx + 10, curY + 10, cellW - 20, galleryH - 20, 10);
        });
      }
      curY += galleryH + 22;
    }

    if (specFields.length > 0) {
      const colGap = 16;
      const halfW = Math.floor((INNER_W - colGap) / 2);
      for (let i = 0; i < specFields.length; i += 2) {
        const pair = specFields.slice(i, i + 2);
        const cardW = pair.length === 1 ? INNER_W : halfW;
        ctx.font = `800 ${specValSz}px Cairo, Tahoma, Arial, sans-serif`;
        const rowH = Math.max(...pair.map(sf => 48 + wrapCanvasLines(ctx, sf.val, cardW - 36).length * specLineH));

        pair.forEach((sf, pIdx) => {
          const cx = pair.length === 1 ? PAD : (pIdx === 0 ? PAD + halfW + colGap : PAD);
          drawRightAccentPanel(ctx, cx, curY, cardW, rowH, 13, pal.tint, pal.tintBorder, pal.primary, 8);
          ctx.textAlign = 'right';
          ctx.fillStyle = pal.primary;
          ctx.font = `800 ${specLabelSz}px Cairo, Tahoma, Arial, sans-serif`;
          ctx.fillText(`${sf.icon} ${sf.label}`, cx + cardW - 20, curY + 28);

          ctx.fillStyle = pal.ink;
          ctx.font = `800 ${specValSz}px Cairo, Tahoma, Arial, sans-serif`;
          const lines = wrapCanvasLines(ctx, sf.val, cardW - 36);
          lines.forEach((ln, lIdx) => {
            ctx.fillText(ln, cx + cardW - 20, curY + 58 + lIdx * specLineH);
          });
        });
        curY += rowH + 14;
      }
      curY += 6;
    }

    if (bullets.length > 0) {
      ctx.font = `700 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
      const wrappedBullets = bullets.map(b => wrapCanvasLines(ctx, b, INNER_W - 64));
      const totalLines = wrappedBullets.reduce((s, arr) => s + arr.length, 0);
      const naturalH = 62 + totalLines * bulletLineH + 18;
      const remainingToFooter = FOOTER_Y - curY - 14;
      // Fill remaining vertical space cleanly down to footer
      const boxH = Math.max(naturalH, remainingToFooter);

      drawRightAccentPanel(ctx, PAD, curY, INNER_W, boxH, 14, pal.accentSoft, pal.tintBorder, pal.accent, 9);
      ctx.textAlign = 'right';
      ctx.fillStyle = pal.accentText;
      ctx.font = '900 21px Cairo, Tahoma, Arial, sans-serif';
      ctx.fillText('🌟 المميزات الرئيسية والتوصيات الفنية:', W - PAD - 22, curY + 34);

      let by = curY + 72;
      wrappedBullets.forEach(linesArr => {
        linesArr.forEach((ln, lIdx) => {
          if (by > curY + boxH - 14) return;
          if (lIdx === 0) {
            ctx.fillStyle = pal.primary;
            ctx.font = `900 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
            ctx.fillText('✓', W - PAD - 22, by);
          }
          ctx.fillStyle = pal.ink;
          ctx.font = `700 ${bulletSz}px Cairo, Tahoma, Arial, sans-serif`;
          ctx.fillText(ln, W - PAD - 48, by);
          by += bulletLineH;
        });
      });
    }
  }

  // 6. Pinned Bottom Editorial Footer
  ctx.fillStyle = pal.tintBorder;
  ctx.fillRect(PAD, FOOTER_Y, INNER_W, 2);

  ctx.textAlign = 'right';
  ctx.fillStyle = pal.primary;
  ctx.font = '900 17px Cairo, Tahoma, Arial, sans-serif';
  ctx.fillText(cfg.companyName, W - PAD, FOOTER_Y + 32);

  ctx.textAlign = 'center';
  ctx.fillStyle = pal.muted;
  ctx.font = '700 15px Cairo, Tahoma, Arial, sans-serif';
  ctx.fillText(todayStr(0), W / 2, FOOTER_Y + 32);

  const pagePillTxt = `صفحة ${pageIndex + 1} من ${totalPages}`;
  ctx.font = '800 15px Cairo, Tahoma, Arial, sans-serif';
  const pillW = ctx.measureText(pagePillTxt).width + 28;
  drawRoundedPanel(ctx, PAD, FOOTER_Y + 10, pillW, 30, 999, pal.tint);
  ctx.fillStyle = pal.primary;
  ctx.fillText(pagePillTxt, PAD + pillW / 2, FOOTER_Y + 30);

  return canvas.toDataURL('image/jpeg', 0.92);
}

            return `

                <td style="padding:6px; border:1px solid ${pal.tintBorder}; text-align:center;">${ph ? `<img src="${ph}" style="max-width:88px; max-height:72px; border-radius:6px; object-fit:contain;" />` : '-'}</td>
