          <label class="font-bold block mb-1">الحد الائتماني الافتراضي</label>
          <input id="cfgDefLimit" type="number" inputmode="decimal" value="${cfg.defaultCreditLimit}" class="input-field py-2 text-xs" />
        </div>
        <div>
          <label class="font-bold block mb-1">أيام تأخير الفواتير</label>
          <input id="cfgOverdueDays" type="number" inputmode="numeric" value="${cfg.overdueDays}" class="input-field py-2 text-xs" />
        </div>
      </div>
      <label class="flex items-center justify-between subtle-box p-2.5 rounded-xl cursor-pointer">
        <span>السماح بالبيع عند نفاد رصيد المخزن (0)</span>
        <input id="cfgAllowZero" type="checkbox" ${cfg.allowZeroStockSale ? 'checked' : ''} class="w-5 h-5 accent-[#0E5A36]" />
      </label>
      <button onclick="saveCompanyAndRulesSettings()" class="btn-tonal w-full py-2.5 text-xs">تحديث قواعد المحاسبة والمخزون</button>
    </div>

    <!-- 4. Smart Backup & Light JSON Export -->
    <div class="m3-card p-4 space-y-3 text-xs">
      <div class="font-extrabold text-sm text-brand-dyn">🔄 النسخ الاحتياطي والاستعادة (JSON)</div>
      <div class="text-[11px] text-muted-dyn">آخر نسخة احتياطية: <strong>${lastStr}</strong></div>
      <div class="flex items-center justify-between gap-2">
        <span>تنبيه النسخ الاحتياطي كل:</span>
        <select id="cfgBackupDays" onchange="saveCompanyAndRulesSettings()" class="input-field w-36 py-1.5 text-xs">
          <option value="1" ${cfg.backupReminderDays===1?'selected':''}>يوم واحد</option>
          <option value="3" ${cfg.backupReminderDays===3?'selected':''}>3 أيام</option>
          <option value="7" ${cfg.backupReminderDays===7?'selected':''}>7 أيام</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportFullBackup(false)" class="btn-primary py-2.5 text-xs">⬇️ نسخة كاملة (بالصور)</button>
        <button onclick="exportFullBackup(true)" class="btn-gold py-2.5 text-xs">⚡ نسخة خفيفة (سريعة)</button>
      </div>
      <label class="btn-tonal w-full py-3 text-xs cursor-pointer">
        ⬆️ استعادة بيانات من ملف JSON
        <input type="file" accept=".json" onchange="importFullBackup(this)" class="hidden" />
      </label>
    </div>

    <!-- 5. Security PIN & Auto-Lock -->
    <div class="m3-card p-4 space-y-3 text-xs">
      <div class="font-extrabold text-sm text-brand-dyn">🔒 الحماية برقم سري والقفل التلقائي (PIN)</div>
      <div class="flex items-center justify-between">
        <span>تفعيل القفل عند فتح التطبيق</span>
        <input type="checkbox" ${cfg.pinEnabled ? 'checked' : ''} onchange="togglePinLock(this.checked)" class="w-5 h-5 accent-[#0E5A36]" />
      </div>
      <div class="flex items-center justify-between gap-2">
        <span>قفل تلقائي عند الخمول:</span>
        <select id="cfgAutoLock" onchange="saveCompanyAndRulesSettings()" class="input-field w-36 py-1.5 text-xs">
          <option value="0" ${cfg.autoLockMinutes===0?'selected':''}>معطّل</option>
          <option value="5" ${cfg.autoLockMinutes===5?'selected':''}>بعد 5 دقائق</option>
          <option value="15" ${cfg.autoLockMinutes===15?'selected':''}>بعد 15 دقيقة</option>
        </select>
      </div>
      <div class="flex gap-2">
        <input id="newPinInput" maxlength="4" type="tel" inputmode="numeric" value="${cfg.pinCode}" class="input-field" placeholder="4 أرقام" />
        <button onclick="updatePinCode()" class="btn-tonal shrink-0">تحديث الرمز</button>
      </div>
    </div>

    <!-- 6. Audit Log -->
    <div class="m3-card p-4 space-y-2.5 text-xs">
      <div class="font-extrabold text-sm text-brand-dyn">🛡️ سجل التدقيق والعمليات الحساسة (${audits.length})</div>
      <div class="max-h-44 overflow-y-auto space-y-1.5">
        ${audits.length === 0 ? `<p class="text-[11px] text-muted-dyn">لا توجد عمليات مسجلة في السجل بعد.</p>` :
          audits.slice(0, 25).map(a => `
            <div class="subtle-box p-2 rounded-xl text-[11px]">
              <div class="flex justify-between font-extrabold">
                <span>${a.action} — ${a.entity}</span>
                <span class="text-[10px] text-muted-dyn">${a.timestamp}</span>
              </div>
              <div class="text-muted-dyn">${a.details}</div>
            </div>
          `).join('')
        }
      </div>
    </div>

    <!-- 7. Password-Protected Reset -->
    <div class="m3-card p-4 space-y-2.5 text-xs border-red-300">
      <div class="font-extrabold text-sm text-red-600">⚠️ تهيئة ومسح قاعدة البيانات (محمي بكلمة سر)</div>
      <p class="text-[11px] text-muted-dyn">لا يمكن مسح قاعدة البيانات إلا بعد إدخال كلمة السر المعتمدة أعلاه.</p>
      <button onclick="openResetPasswordModal()" class="w-full py-2.5 rounded-xl bg-red-50 text-red-700 font-extrabold border border-red-200">🔒 مسح البيانات والبدء من الصفر</button>
    </div>
  `;
}

async function saveCompanyAndRulesSettings() {
  const cfg = getAppConfig();
  cfg.companyName = document.getElementById('cfgCompName')?.value.trim() || cfg.companyName;
  cfg.companyPhone = document.getElementById('cfgCompPhone')?.value.trim() || '';
  cfg.companyAddress = document.getElementById('cfgCompAddr')?.value.trim() || cfg.companyAddress;
  cfg.invoiceFooterNote = document.getElementById('cfgFooterNote')?.value.trim() || '';
  cfg.defaultCreditLimit = Math.max(0, Number(document.getElementById('cfgDefLimit')?.value ?? cfg.defaultCreditLimit));
  cfg.overdueDays = Math.max(1, Number(document.getElementById('cfgOverdueDays')?.value ?? cfg.overdueDays));
  cfg.allowZeroStockSale = !!document.getElementById('cfgAllowZero')?.checked;
  cfg.backupReminderDays = Number(document.getElementById('cfgBackupDays')?.value ?? cfg.backupReminderDays);
  cfg.autoLockMinutes = Number(document.getElementById('cfgAutoLock')?.value ?? cfg.autoLockMinutes);

  await putRecord('settings', cfg);
  await loadAllData();
  resetIdleLockTimer();
  showToast('تم حفظ الإعدادات بنجاح');
}

function openResetPasswordModal() {
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-red-600">🔒 تأكيد مسح قاعدة البيانات</h3>
      <button onclick="closeModal()" class="text-muted-dyn text-xl font-bold">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <div class="bg-red-50 border border-red-200 p-3 rounded-xl text-red-900 leading-relaxed">
        <strong>تحذير نهائي:</strong> سيتم مسح جميع العملاء والفواتير والمخزون ومحطات التجارب والزيارات نهائياً. تأكد من تصدير نسخة احتياطية JSON قبل المتابعة.
      </div>
      <div>
        <label class="font-bold block mb-1">أدخل كلمة السر (PIN) لتأكيد المسح *</label>
        <input id="wipePwdInput" type="password" inputmode="numeric" maxlength="4" class="input-field text-center text-lg tracking-widest" placeholder="••••" />
      </div>
      <div id="wipePwdErr" class="text-red-600 font-bold text-[11px]"></div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="closeModal()" class="btn-tonal py-2.5">إلغاء</button>
        <button onclick="verifyAndResetDatabase()" class="bg-red-700 text-white rounded-xl font-extrabold py-2.5">تأكيد المسح</button>
      </div>
    </div>
  `);
}

async function verifyAndResetDatabase() {
  const entered = document.getElementById('wipePwdInput').value.trim();
  const cfg = getAppConfig();
  if (entered !== cfg.pinCode) {
    document.getElementById('wipePwdErr').textContent = '❌ كلمة السر غير صحيحة — تم إلغاء عملية المسح';
    return;
  }
  for (const s of STORES) {
    if (s !== 'warehouses' && s !== 'settings') await clearStore(s);
  }
  await logAudit('مسح قاعدة البيانات', 'النظام بالكامل', 'تمت إعادة التهيئة بعد التحقق من كلمة السر');
  await loadAllData();
  closeModal();
  navigate('home');
  showToast('تم التحقق من كلمة السر ومسح قاعدة البيانات بنجاح');
}

async function exportFullBackup(lightMode = false) {
  const clonedStores = JSON.parse(JSON.stringify(state.data));
  if (lightMode) {
    (clonedStores.visits || []).forEach(v => v.photo = '');
    (clonedStores.invoices || []).forEach(i => i.photo = '');
    (clonedStores.customers || []).forEach(c => c.photo = '');
    (clonedStores.trials || []).forEach(t => (t.history || []).forEach(h => h.photo = ''));
  }
  const payload = {
    app: 'AGRI_PYRAMIDS_FIELDOS',
    mode: lightMode ? 'light_no_photos' : 'full',
    exportedAt: new Date().toISOString(),
    stores: clonedStores
  };
  const suffix = lightMode ? 'Light' : 'Full';
  downloadFile(JSON.stringify(payload, null, 2), `FieldOS_Backup_${suffix}_${todayStr(0)}.json`, 'application/json');
  const cfg = getAppConfig();
  cfg.lastBackupAt = Date.now();
  await putRecord('settings', cfg);
  await loadAllData();
  render();
  showToast(lightMode ? 'تم تصدير النسخة الاحتياطية الخفيفة' : 'تم تصدير النسخة الاحتياطية الكاملة');
}

async function importFullBackup(input) {
  if (!input.files || !input.files[0]) return;
  const text = await input.files[0].text();
  try {
    const parsed = JSON.parse(text);
    if (!parsed.stores) throw new Error('invalid');
    for (const s of STORES) {
      if (Array.isArray(parsed.stores[s])) {
        await clearStore(s);
        for (const item of parsed.stores[s]) {
          await putRecord(s, item);
        }
      }
    }
    await loadAllData();
    render();
    showToast('تمت استعادة كافة البيانات بنجاح');
  } catch {
    showToast('ملف النسخة الاحتياطية غير صالح');
  }
}

async function togglePinLock(enabled) {
  const cfg = getAppConfig();
  cfg.pinEnabled = enabled;
  await putRecord('settings', cfg);
  await loadAllData();
  resetIdleLockTimer();
  showToast(enabled ? 'تم تفعيل قفل الحماية PIN' : 'تم إيقاف قفل الحماية');
}

async function updatePinCode() {
  const code = document.getElementById('newPinInput').value.trim();
  if (!/^\d{4}$/.test(code)) return showToast('أدخل 4 أرقام فقط');
  const cfg = getAppConfig();
  cfg.pinCode = code;
  await putRecord('settings', cfg);
  await loadAllData();
  showToast('تم تحديث الرقم السري وكلمة سر الحماية');
}

// ==================== PIN ENTRY LOGIC ====================
let enteredPin = '';
function checkPinOnStartup() {
  const cfg = getAppConfig();
  if (cfg.pinEnabled) {
    document.getElementById('pinOverlay').classList.remove('hidden');
    document.getElementById('pinOverlay').classList.add('flex');
  }
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pinDot' + i);
    dot.classList.toggle('bg-white', i < enteredPin.length);
  }
}

function enterPinDigit(d) {
  if (enteredPin.length >= 4) return;
  enteredPin += d;
  updatePinDots();
  if (enteredPin.length === 4) {
    const cfg = getAppConfig();
    if (enteredPin === cfg.pinCode) {
      document.getElementById('pinOverlay').classList.add('hidden');
      document.getElementById('pinOverlay').classList.remove('flex');
      enteredPin = '';
      resetIdleLockTimer();
    } else {
      document.getElementById('pinError').textContent = 'الرمز غير صحيح';
      enteredPin = '';
      setTimeout(updatePinDots, 250);
    }
  }
}

function clearPinInput() {
  enteredPin = '';
  document.getElementById('pinError').textContent = '';
  updatePinDots();
}

function backspacePin() {
  enteredPin = enteredPin.slice(0, -1);
  updatePinDots();
}

// ==================== BOOTSTRAP ====================
(async function initApp() {
  renderChromeNavigation();
  applyTheme(currentTheme);
  initHistoryGuard();
  await openDB();
  await loadAllData();
  await seedDemoIfNeeded();
  checkPinOnStartup();
  resetIdleLockTimer();
  applyRoute('home', false);
})();
</script>
