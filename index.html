// ==================== COMMAND CENTER (REAL SVG INTERACTIVE CHARTS + INTELLIGENT ADVISOR) ====================
function renderCommand() {
  const cfg = getAppConfig(), salesTarget = Math.max(1, cfg.salesTarget), colTarget = Math.max(1, cfg.collectionTarget);
  const grossSales = state.data.invoices.reduce((s, i) => s + Number(i.total || 0), 0);
  const totalReturns = state.data.returns.reduce((s, r) => s + Number(r.total || 0), 0);
  const netSales = Math.max(0, grossSales - totalReturns);

  const totalCollected = state.data.invoices.reduce((s, i) => s + Number(i.paidAmount || 0), 0) + state.data.payments.reduce((s, p) => s + Number(p.amount || 0), 0) - state.data.returns.filter(r => r.refundCash).reduce((s, r) => s + Number(r.total || 0), 0);
  const efficiency = netSales > 0 ? Math.min(100, Math.round((totalCollected / netSales) * 100)) : 100;
  const salesTargetPct = Math.min(100, Math.round((netSales / salesTarget) * 100)), colTargetPct = Math.min(100, Math.round((totalCollected / colTarget) * 100));

  const prodCostMap = {}; state.data.products.forEach(p => prodCostMap[p.id] = Number(p.cost || 0));
  let totalCogs = 0; const prodStats = {};
  state.data.products.forEach(p => { prodStats[p.id] = { id: p.id, name: p.name, qty: 0, rev: 0, profit: 0 }; });

  state.data.invoices.forEach(inv => {
    inv.items.forEach(it => {
      const cost = prodCostMap[it.productId] || 0, totalUnitsOut = Number(it.qty || 0) + Number(it.bonusQty || 0);
      totalCogs += cost * totalUnitsOut;
      if (prodStats[it.productId]) { prodStats[it.productId].qty += totalUnitsOut; prodStats[it.productId].rev += Number(it.subtotal || 0); prodStats[it.productId].profit += Number(it.subtotal || 0) - (cost * totalUnitsOut); }
    });
  });
  state.data.returns.forEach(r => {
    const cost = prodCostMap[r.productId] || 0; totalCogs -= cost * Number(r.qty || 0);
    if (prodStats[r.productId]) { prodStats[r.productId].qty -= Number(r.qty || 0); prodStats[r.productId].rev -= Number(r.total || 0); prodStats[r.productId].profit -= (Number(r.price || 0) - cost) * Number(r.qty || 0); }
  });

  const totalExp = state.data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const netProfit = netSales - totalCogs - totalExp;
  const rankedProducts = Object.values(prodStats).filter(x => x.qty > 0).sort((a, b) => b.profit - a.profit);

  // Smart Financial Advisor Calculations (Cash Runway + Expected 7-Day Inflow)
  const brk = getTreasuryBreakdown();
  const avgDailyExpense = state.data.expenses.length > 0 ? Math.max(50, Math.round(totalExp / Math.max(1, new Set(state.data.expenses.map(e => e.date)).size))) : 150;
  const runwayDays = brk.pettyCashPocket > 0 ? Math.floor(brk.pettyCashPocket / avgDailyExpense) : 0;

  const next7Days = todayStr(7);
  const expected7DayInflow = state.data.invoices
    .filter(i => i.promiseDate && i.promiseDate <= next7Days && (Number(i.total) - Number(i.paidAmount || 0)) > 0)
    .reduce((s, i) => s + (Number(i.total) - Number(i.paidAmount || 0)), 0);

  // Territory Performance Breakdown
  const territoryPerf = {};
  state.data.invoices.forEach(inv => {
    const c = state.data.customers.find(x => x.id === inv.customerId);
    const area = (c?.area || 'غير محدد').trim();
    territoryPerf[area] = (territoryPerf[area] || 0) + Number(inv.total || 0);
  });
  const territoryEntries = Object.entries(territoryPerf).sort((a, b) => b[1] - a[1]);
  const maxTerrSale = Math.max(1, ...territoryEntries.map(x => x[1]));

  // Slow-Moving Radar
  const slowProducts = state.data.products
    .map(p => ({ ...p, stock: getProductTotalStock(p.id), idleDays: getProductLastMovementDays(p.id) }))
    .filter(p => p.stock > 0 && p.idleDays >= 30)
    .sort((a, b) => b.idleDays - a.idleDays);

  // Build True Responsive SVG Column Chart (Guaranteed Rendering on All Mobile Browsers)
  const chartData = [
    { label: 'المبيعات', val: netSales, color: '#0E5A36' },
    { label: 'التحصيل', val: totalCollected, color: '#0284C7' },
    { label: 'المصروفات', val: totalExp, color: '#DC2626' },
    { label: 'صافي الربح', val: Math.max(0, netProfit), color: '#D97706' }
  ];
  const maxChartVal = Math.max(1, ...chartData.map(d => d.val));
  const svgW = 360, svgH = 165, baseLineY = 132, maxBarH = 98;
  const barW = 46, gapW = 34, startX = 28;

  const svgBarsHtml = chartData.map((d, idx) => {
    const x = startX + idx * (barW + gapW);
    const h = Math.max(6, Math.round((d.val / maxChartVal) * maxBarH));
    const y = baseLineY - h;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="8" fill="${d.color}" />
      <text x="${x + barW/2}" y="${y - 6}" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor">${d.val.toLocaleString()}</text>
      <text x="${x + barW/2}" y="${baseLineY + 18}" text-anchor="middle" font-size="10.5" font-weight="800" fill="currentColor">${d.label}</text>
    `;
  }).join('');

  return `
    <!-- 1. True SVG Financial Performance Chart -->
    <div class="m3-card p-4 space-y-2 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-extrabold text-sm text-brand-dyn">📊 الرسم البياني للأداء المالي</span>
        <span class="badge-pill bg-brand-soft-dyn">محدث لحظياً</span>
      </div>
      <div class="subtle-box rounded-2xl p-2">
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full" style="height:165px; display:block;">
          <line x1="16" y1="${baseLineY}" x2="${svgW - 16}" y2="${baseLineY}" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5" />
          ${svgBarsHtml}
        </svg>
      </div>
    </div>

    <!-- 2. Smart Decision & Cash Runway Insights -->
    <div class="grid grid-cols-2 gap-2.5 text-xs">
      <div class="m3-card p-3.5 border-r-4 border-r-amber-500">
        <div class="text-[10px] text-muted-dyn">كفاية عهدة المصاريف</div>
        <div class="text-base font-black text-amber-700 mt-0.5">${runwayDays > 0 ? runwayDays + ' يوم عمل' : 'تحتاج تغذية'}</div>
        <div class="text-[10px] text-muted-dyn mt-0.5">متوسط الصرف: ${avgDailyExpense} ج.م/يوم</div>
      </div>
      <div class="m3-card p-3.5 border-r-4 border-r-emerald-600">
        <div class="text-[10px] text-muted-dyn">تحصيلات مجدولة (7 أيام)</div>
        <div class="text-base font-black text-brand-dyn mt-0.5">${fmtMoney(expected7DayInflow)}</div>
        <div class="text-[10px] text-muted-dyn mt-0.5">أقساط ووعود سداد قادمة</div>
      </div>
    </div>

    <!-- 3. Monthly Targets with Working Explicit Progress Bars -->
    <div class="m3-card p-4 space-y-3 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-extrabold text-sm text-brand-dyn">🎯 مؤشر تحقيق أهداف الشهر</span>
        <button onclick="openTargetSettingsModal()" class="btn-tonal text-[11px] py-1 px-2.5 min-h-0">تعديل الهدف</button>
      </div>
      <div class="space-y-1.5">
        <div class="flex justify-between font-bold"><span>هدف المبيعات (${salesTargetPct}%)</span><span>${netSales.toLocaleString()} / ${salesTarget.toLocaleString()} ج.م</span></div>
        <div class="prog-track"><div class="prog-fill-brand" style="width:${salesTargetPct}%"></div></div>
      </div>
      <div class="space-y-1.5">
        <div class="flex justify-between font-bold"><span>هدف التحصيل (${colTargetPct}%)</span><span>${totalCollected.toLocaleString()} / ${colTarget.toLocaleString()} ج.م</span></div>
        <div class="prog-track"><div class="prog-fill-gold" style="width:${colTargetPct}%"></div></div>
      </div>
    </div>

    <!-- 4. Core KPI Summary Grid -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="m3-card p-3.5"><div class="text-[11px] text-muted-dyn">صافي المبيعات</div><div class="text-base font-black text-brand-dyn">${fmtMoney(netSales)}</div></div>
      <div class="m3-card p-3.5"><div class="text-[11px] text-muted-dyn">كفاءة التحصيل</div><div class="text-base font-black" style="color:#5E4B8B;">${efficiency}%</div></div>
      <div class="m3-card p-3.5"><div class="text-[11px] text-muted-dyn">صافي الربح التقديري</div><div class="text-base font-black ${netProfit >= 0 ? 'text-brand-dyn' : 'text-red-600'}">${fmtMoney(netProfit)}</div></div>
      <div class="m3-card p-3.5"><div class="text-[11px] text-muted-dyn">إجمالي المرتجعات</div><div class="text-base font-black text-amber-600">${fmtMoney(totalReturns)}</div></div>
    </div>

    <!-- 5. Territory Performance Distribution -->
    ${territoryEntries.length > 0 ? `
      <div class="m3-card p-4 space-y-2.5 text-xs">
        <div class="font-extrabold text-sm text-brand-dyn">🗺️ توزيع المبيعات حسب المنطقة الجغرافية</div>
        ${territoryEntries.map(([areaName, val]) => `
          <div class="space-y-1">
            <div class="flex justify-between font-bold"><span>${areaName}</span><span>${fmtMoney(val)}</span></div>
            <div class="prog-track" style="height:8px;"><div class="prog-fill-brand" style="width:${Math.round((val / maxTerrSale) * 100)}%"></div></div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <!-- 6. ABC Product Profitability & Ranking -->
    <div class="m3-card p-4 space-y-2.5 text-xs">
      <div class="font-extrabold text-sm text-brand-dyn">📈 تصنيف الأصناف والربحية (ABC Analysis)</div>
      ${rankedProducts.length === 0 ? `<p class="text-muted-dyn text-[11px]">لا توجد مبيعات مسجلة بعد.</p>` :
        rankedProducts.map((pr, idx) => {
          const tier = idx === 0 ? { tag: 'فئة A ★', cls: 'bg-emerald-100 text-emerald-800' } : (idx === 1 ? { tag: 'فئة B', cls: 'bg-amber-100 text-amber-800' } : { tag: 'فئة C', cls: 'subtle-box' });
          return `
            <div class="subtle-box p-2.5 rounded-xl flex items-center justify-between">
              <div>
                <div class="flex items-center gap-1.5"><span class="badge-pill ${tier.cls}">${tier.tag}</span><span class="font-extrabold">${pr.name}</span></div>
                <div class="text-[10px] text-muted-dyn mt-0.5">المنصرف: ${pr.qty} • الإيراد: ${pr.rev.toLocaleString()} ج.م</div>
              </div>
              <div class="text-left"><div class="font-black text-brand-dyn">+ ${pr.profit.toLocaleString()} ج.م</div><div class="text-[10px] text-muted-dyn">صافي الربح</div></div>
            </div>
          `;
        }).join('')
      }
    </div>

    <!-- 7. Slow-Moving Stock Radar -->
    <div class="m3-card p-4 space-y-2.5 text-xs border-r-4 border-r-amber-500">
      <div class="font-extrabold text-sm text-amber-700">📡 رادار الأصناف الراكدة (+30 يوم بدون بيع)</div>
      ${slowProducts.length === 0 ? `<p class="text-[11px] text-muted-dyn">ممتاز — جميع الأصناف المتوفرة بالمخزن نشطة الحركة.</p>` :
        slowProducts.map(sp => `<div class="subtle-box p-2.5 rounded-xl flex items-center justify-between"><div><div class="font-extrabold">${sp.name}</div><div class="text-[10px] text-muted-dyn">الرصيد المجمد: ${sp.stock} ${sp.unit}</div></div><span class="badge-pill bg-amber-100 text-amber-900">${sp.idleDays === 999 ? 'لم يُبع بعد' : 'راكد منذ ' + sp.idleDays + ' يوم'}</span></div>`).join('')
      }
    </div>
  `;
}

// ==================== SMART AUTOCOMPLETE CUSTOMER PICKER ====================
function renderSmartCustomerPicker(hiddenInputId, searchInputId, suggestBoxId, selectedCustomerId = '') {
  const c = state.data.customers.find(x => x.id === selectedCustomerId);
  const initialText = c ? c.name : '';
  return `
    <div class="relative">
      <input type="hidden" id="${hiddenInputId}" value="${c ? c.id : ''}" />
      <input id="${searchInputId}" type="text" value="${initialText}"
        onfocus="filterSmartCustomerList('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}')"
        oninput="document.getElementById('${hiddenInputId}').value=''; filterSmartCustomerList('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}');"
        placeholder="اكتب اسم العميل للبحث أو الإضافة الفورية..." class="input-field" autocomplete="off" />
      <div id="${suggestBoxId}" class="hidden mt-1.5 m3-card p-2 space-y-1 max-h-44 overflow-y-auto shadow-lg"></div>
    </div>
  `;
}

function filterSmartCustomerList(hiddenInputId, searchInputId, suggestBoxId) {
  const inp = document.getElementById(searchInputId);
  const box = document.getElementById(suggestBoxId);
  if (!inp || !box) return;
  const q = inp.value.trim().toLowerCase();
  const matches = state.data.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (c.area || '').toLowerCase().includes(q) || (c.phone || '').includes(q));

  let html = matches.slice(0, 8).map(c => `
    <button type="button" onclick="selectSmartCustomer('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}', '${c.id}')" class="w-full text-right p-2 rounded-xl subtle-box flex items-center justify-between text-xs">
      <div><div class="font-extrabold">${c.name}</div><div class="text-[10px] text-muted-dyn">${c.area || ''} ${c.phone ? '• ' + c.phone : ''}</div></div>
      <span class="font-bold text-brand-dyn">${getCustomerBalance(c.id).toLocaleString()} ج.م</span>
    </button>
  `).join('');

  if (q && !matches.some(c => c.name.toLowerCase() === q)) {
    const safeName = inp.value.trim().replace(/'/g, '');
    html += `<button type="button" onclick="quickCreateAndSelectCustomer('${hiddenInputId}', '${searchInputId}', '${suggestBoxId}', '${safeName}')" class="w-full text-right p-2.5 rounded-xl bg-brand-soft-dyn font-extrabold text-xs flex items-center justify-between border-0"><span>+ إضافة عميل جديد باسم: "${safeName}"</span><span>اعتماد ↵</span></button>`;
  }
  box.innerHTML = html || `<div class="text-[11px] text-muted-dyn p-2">اكتب اسم العميل الجديد لإضافته فوراً...</div>`;
  box.classList.remove('hidden');
}

function selectSmartCustomer(hiddenInputId, searchInputId, suggestBoxId, customerId) {
  const c = state.data.customers.find(x => x.id === customerId);
  if (!c) return;
  document.getElementById(hiddenInputId).value = c.id;
  document.getElementById(searchInputId).value = c.name;
  document.getElementById(suggestBoxId).classList.add('hidden');
  if (hiddenInputId === 'invCust') renderInvoiceModalBody();
}

async function quickCreateAndSelectCustomer(hiddenInputId, searchInputId, suggestBoxId, rawName) {
  const name = rawName.trim();
  if (!name) return;
  const cfg = getAppConfig();
  const newCust = {
    id: uid('cust'), name, phone: '', area: state.territoryFilter !== 'all' ? state.territoryFilter : '',
    openingBalance: 0, creditLimit: cfg.defaultCreditLimit,
    notes: 'تمت إضافته سريعاً من شاشة الفاتورة', photo: '', lat: '', lng: ''
  };
  await putRecord('customers', newCust);
  await loadAllData();
  selectSmartCustomer(hiddenInputId, searchInputId, suggestBoxId, newCust.id);
  showToast(`تمت إضافة العميل (${name}) واعتماده`);
}

            <div class="m3-card p-3.5 text-xs flex items-center justify-between gap-2 border-r-4 border-r-emerald-600">
              <div><div class="font-extrabold">${c ? c.name : ''}</div><div class="text-[11px] text-muted-dyn">${p.date} • ${p.method} • ${p.note || ''}</div></div>
              <div class="flex items-center gap-1.5">
                <div class="font-black text-sm text-brand-dyn ml-1">+ ${fmtMoney(p.amount)}</div>
                <button onclick="openSmartShareSheet('payment', '${p.id}')" class="btn-tonal text-[11px] py-1.5 px-2.5 min-h-0">🖨️ مشاركة</button>
                ${!isRep && !locked ? `<button onclick="openPaymentModal('${p.id}')" class="subtle-box rounded-xl text-[11px] font-bold px-2 py-1.5">✏️</button><button onclick="deletePaymentRecord('${p.id}')" class="bg-red-50 text-red-700 rounded-xl text-[11px] font-bold px-2 py-1.5 border">🗑️</button>` : ''}

    ${tab === 'returns' ? `
      <button onclick="openReturnModal()" class="btn-primary w-full py-3 text-sm">+ تسجيل مرتجع مبيعات (إشعار دائن)</button>
      <div class="space-y-2.5">
        ${state.data.returns.length === 0 ? `<div class="m3-card p-5 text-center text-xs text-muted-dyn">لا توجد مرتجعات مسجلة</div>` :
          state.data.returns.slice().reverse().map(r => {
            const c = state.data.customers.find(x => x.id === r.customerId);
            return `
              <div class="m3-card p-3.5 text-xs flex items-center justify-between gap-2 border-r-4 border-r-red-500">
                <div><div class="font-extrabold">${c ? c.name : ''}</div><div class="text-[11px] text-muted-dyn">${r.date} • ${r.productName} (×${r.qty}) • ${r.refundCash ? 'رد نقدي' : 'خصم رصيد'}</div></div>
                <div class="flex items-center gap-1.5"><div class="font-extrabold text-sm text-amber-600 ml-1">- ${fmtMoney(r.total)}</div>${!isRep ? `<button onclick="deleteReturnRecord('${r.id}')" class="bg-red-50 text-red-700 rounded-xl text-[11px] font-bold px-2 py-1.5 border">🗑️</button>` : ''}</div>

        <button onclick="closeModal(); shareReceiptAsImage('invoice', '${recordId}');" class="btn-gold w-full py-3 justify-between"><span>🖼️ مشاركة كصورة إيصال جاهزة</span><span>PNG</span></button>
        <button onclick="closeModal(); shareInvoiceWhatsApp('${recordId}');" class="btn-tonal w-full py-3 justify-between"><span>💬 إرسال تفاصيل الفاتورة نصياً (واتساب)</span><span>واتساب</span></button>

        <button onclick="closeModal(); printThermalReceipt('payment', '${recordId}');" class="btn-primary w-full py-3 justify-between"><span>🧾 طباعة إيصال تحصيل حراري (80mm)</span><span>حراري</span></button>
        <button onclick="closeModal(); shareReceiptAsImage('payment', '${recordId}');" class="btn-gold w-full py-3 justify-between"><span>🖼️ مشاركة سند التحصيل كصورة (PNG)</span><span>واتساب</span></button>

let draftInvoiceItems = [];
let editingInvoiceId = '';
let tempInvoicePhoto = '';
let preselectedInvoiceCustomer = '';
let isDraftQuoteMode = false;

function openInvoiceModal(invoiceId = '', preCustId = '', asQuote = false) {
  if (state.data.products.length === 0) return showToast('أضف صنفاً واحداً على الأقل في المخازن أولاً');
  if (invoiceId && isRepRestricted()) return showToast('تعديل الفواتير مقفول في وضع المندوب الميداني');
  editingInvoiceId = invoiceId;
  preselectedInvoiceCustomer = preCustId;
  isDraftQuoteMode = asQuote;
  const existing = state.data.invoices.find(x => x.id === invoiceId);
  if (existing) {
    draftInvoiceItems = existing.items.map(it => ({ productId: it.productId, qty: Number(it.qty), bonusQty: Number(it.bonusQty || 0), price: Number(it.price) }));
    tempInvoicePhoto = existing.photo || '';
  } else {
    draftInvoiceItems = [{ productId: state.data.products[0].id, qty: 1, bonusQty: 0, price: state.data.products[0].price }];
    tempInvoicePhoto = '';
  }
  renderInvoiceModalBody();
}

function stepDraftQty(idx, delta) {
  draftInvoiceItems[idx].qty = Math.max(1, Number(draftInvoiceItems[idx].qty || 1) + delta);
  renderInvoiceModalBody();
}

function applyCustomerLastPrice(idx, price) {
  draftInvoiceItems[idx].price = Number(price);
  renderInvoiceModalBody();
}

function computeDraftInvoiceTotals() {
  const cfg = getAppConfig();
  const sub = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  const discInput = Number(document.getElementById('invDiscountVal')?.value || 0);
  const discType = document.getElementById('invDiscountType')?.value || 'fixed';
  const discAmt = discType === 'percent' ? Math.round((sub * Math.min(100, Math.max(0, discInput))) / 100) : Math.min(sub, Math.max(0, discInput));
  const afterDisc = Math.max(0, sub - discAmt);
  const applyTax = !!document.getElementById('invApplyTax')?.checked;
  const taxAmt = applyTax ? Math.round((afterDisc * cfg.taxRatePercent) / 100) : 0;
  return { sub, discAmt, taxAmt, netTotal: afterDisc + taxAmt };
}

function getDraftCustomerPrevBalance(custId) {
  if (!custId) return 0;
  let prev = getCustomerBalance(custId);
  const existing = editingInvoiceId ? state.data.invoices.find(x => x.id === editingInvoiceId) : null;
  if (existing && existing.customerId === custId) {
    prev -= (Number(existing.total || 0) - Number(existing.paidAmount || 0));
  }
  return prev;
}

function updateDraftInvTotal() {
  const { netTotal } = computeDraftInvoiceTotals();
  const custId = document.getElementById('invCust')?.value || '';
  const prevBal = getDraftCustomerPrevBalance(custId);
  const mode = document.getElementById('invMode')?.value || 'credit';
  let paidNow = 0;
  if (mode === 'cash') paidNow = netTotal;
  else if (mode === 'partial') paidNow = Math.min(netTotal, Math.max(0, Number(document.getElementById('invPaidAmt')?.value || 0)));

  const totalBal = prevBal + netTotal;
  const invRem = Math.max(0, netTotal - paidNow);
  const totalRemDebt = totalBal - paidNow;

  const el = document.getElementById('invTotalDisplay');
  if (el) el.textContent = fmtMoney(netTotal);
  const prevEl = document.getElementById('invPrevBalDisplay');
  if (prevEl) prevEl.textContent = fmtMoney(prevBal);
  const totBalEl = document.getElementById('invTotBalDisplay');
  if (totBalEl) totBalEl.textContent = fmtMoney(totalBal);
  const invRemEl = document.getElementById('invRemDisplay');
  if (invRemEl) invRemEl.textContent = fmtMoney(invRem);
  const totDebtEl = document.getElementById('invTotDebtDisplay');
  if (totDebtEl) totDebtEl.textContent = fmtMoney(totalRemDebt);
}

function renderInvoiceModalBody() {
  const cfg = getAppConfig();
  const existing = state.data.invoices.find(x => x.id === editingInvoiceId);
  const modeVal = existing ? (existing.paymentMode || 'credit') : 'credit';
  const targetCust = document.getElementById('invCust')?.value || (existing ? existing.customerId : (preselectedInvoiceCustomer || ''));
  const selectedWh = document.getElementById('invWh')?.value || (existing ? existing.warehouseId : state.data.warehouses[0]?.id);
  const isRep = isRepRestricted();

  const initialSub = draftInvoiceItems.reduce((s, it) => s + (Number(it.qty) * Number(it.price)), 0);
  const initDisc = existing ? Number(existing.discountAmount || 0) : 0;
  const initTaxChecked = existing ? Number(existing.taxAmount || 0) > 0 : (cfg.taxRatePercent > 0);
  const initTax = initTaxChecked ? Math.round(((initialSub - initDisc) * cfg.taxRatePercent) / 100) : 0;
  const initialTotal = Math.max(0, initialSub - initDisc + initTax);

  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-base text-brand-dyn">${existing ? `تعديل الفاتورة ${existing.number}` : (isDraftQuoteMode ? 'إعداد عرض سعر / مسودة' : 'فاتورة بيع جديدة')}</h3>
      <button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <div>
        <label class="font-bold block mb-1">العميل (اكتب للاقتراح أو أضف عميلاً جديداً) *</label>
        ${renderSmartCustomerPicker('invCust', 'invCustSearch', 'invCustSuggest', targetCust)}
      </div>
      <div>
        <label class="font-bold block mb-1">المخزن الصادر *</label>
        <select id="invWh" onchange="renderInvoiceModalBody()" class="input-field">${state.data.warehouses.map(w => `<option value="${w.id}" ${selectedWh===w.id ? 'selected' : ''}>${w.name}</option>`).join('')}</select>
      </div>

      <div class="subtle-box p-3 rounded-2xl space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <span class="font-extrabold">الأصناف (الكمية + البونص + السعر)</span>
          <div class="flex gap-1">
            <button type="button" onclick="openBarcodeScannerModal('handleScannedProductForInvoice')" class="btn-tonal text-[11px] py-1 px-2 min-h-0">📷 باركود</button>
            <button type="button" onclick="addDraftInvRow()" class="btn-tonal text-[11px] py-1 px-2.5 min-h-0">+ صنف</button>
          </div>
        </div>
        ${draftInvoiceItems.map((row, idx) => {
          const lastPriceInfo = getCustomerLastPriceForProduct(targetCust, row.productId);
          return `
            <div class="m3-card p-2.5 rounded-xl space-y-2">
              <select onchange="updateDraftInvProduct(${idx}, this.value)" class="input-field py-1.5 text-xs">
                ${state.data.products.map(p => `<option value="${p.id}" ${p.id===row.productId?'selected':''}>${p.name} (متاح: ${getStockQty(selectedWh, p.id)})</option>`).join('')}
              </select>
              ${lastPriceInfo ? `
                <div class="bg-amber-50 text-amber-900 px-2.5 py-1 rounded-lg text-[10px] flex items-center justify-between">
                  <span>💡 آخر سعر لهذا العميل: <strong>${lastPriceInfo.price} ج.م</strong> (${lastPriceInfo.date})</span>
                  ${!isRep && Number(row.price) !== lastPriceInfo.price ? `<button type="button" onclick="applyCustomerLastPrice(${idx}, ${lastPriceInfo.price})" class="bg-amber-600 text-white px-2 py-0.5 rounded font-bold border-0">تطبيق</button>` : ''}
                </div>
              ` : ''}
              <div class="grid grid-cols-12 gap-1.5 items-center">
                <div class="col-span-5 flex items-center gap-1">
                  <button type="button" onclick="stepDraftQty(${idx}, -1)" class="stepper-btn">−</button>
                  <input type="number" inputmode="numeric" min="1" value="${row.qty}" oninput="draftInvoiceItems[${idx}].qty=Number(this.value||0); updateDraftInvTotal();" class="input-field px-1 text-center py-1 text-xs" />
                  <button type="button" onclick="stepDraftQty(${idx}, 1)" class="stepper-btn">+</button>
                </div>
                <div class="col-span-3"><input type="number" inputmode="numeric" min="0" value="${row.bonusQty || 0}" oninput="draftInvoiceItems[${idx}].bonusQty=Number(this.value||0);" class="input-field px-1 py-1 text-xs text-center" placeholder="بونص" /></div>
                <div class="col-span-3"><input type="number" inputmode="decimal" min="0" value="${row.price}" ${isRep ? 'disabled' : ''} oninput="draftInvoiceItems[${idx}].price=Number(this.value||0); updateDraftInvTotal();" class="input-field px-1 py-1 text-xs text-center" placeholder="السعر" /></div>
                <div class="col-span-1 text-left">${draftInvoiceItems.length > 1 ? `<button type="button" onclick="draftInvoiceItems.splice(${idx},1); renderInvoiceModalBody();" class="text-red-600 font-bold text-xs border-0" style="background:transparent;">✕</button>` : ''}</div>
              </div>
              <div class="flex justify-between text-[10px] text-muted-dyn px-1"><span>الكمية | البونص | ${isRep ? 'سعر معتمد' : 'السعر'}</span><strong>${(Number(row.qty) * Number(row.price)).toLocaleString()} ج.م</strong></div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="subtle-box p-3 rounded-xl space-y-2">
        <div class="grid grid-cols-3 gap-2 items-center">
          <div class="col-span-2"><label class="font-bold block mb-1">خصم على الفاتورة</label><input id="invDiscountVal" type="number" inputmode="decimal" min="0" value="${initDisc}" oninput="updateDraftInvTotal()" class="input-field py-1.5 text-xs" /></div>
          <div><label class="font-bold block mb-1">النوع</label><select id="invDiscountType" onchange="updateDraftInvTotal()" class="input-field py-1.5 text-xs"><option value="fixed">جنيه (ج.م)</option><option value="percent">نسبة (%)</option></select></div>
        </div>
        ${cfg.taxRatePercent > 0 ? `<label class="flex items-center justify-between pt-1 cursor-pointer"><span>تطبيق ضريبة القيمة المضافة (${cfg.taxRatePercent}%)</span><input type="checkbox" id="invApplyTax" ${initTaxChecked ? 'checked' : ''} onchange="updateDraftInvTotal()" /></label>` : `<input type="checkbox" id="invApplyTax" class="hidden" />`}
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-1">نمط السداد</label>
          <select id="invMode" onchange="toggleInvPaidField()" class="input-field">
            <option value="credit" ${modeVal==='credit'?'selected':''}>آجل بالكامل</option>
            <option value="cash" ${modeVal==='cash'?'selected':''}>نقدي بالكامل</option>
            <option value="partial" ${modeVal==='partial'?'selected':''}>دفعة جزئية</option>
          </select>
        </div>
        <div id="invPaidWrap" class="${modeVal==='partial' ? '' : 'hidden'}">
          <label class="font-bold block mb-1">المبلغ المدفوع الآن</label>
          <input id="invPaidAmt" type="number" inputmode="decimal" value="${existing ? (existing.paidAmount || 0) : 0}" oninput="updateDraftInvTotal()" class="input-field" />
        </div>
      </div>

      <!-- Promise-to-Pay / Next Installment Date -->
      <div id="invPromiseWrap" class="${modeVal==='cash' ? 'hidden' : ''}">
        <label class="font-bold block mb-1">📅 موعد القسط / وعد السداد القادم (اختياري)</label>
        <input id="invPromiseDate" type="date" value="${existing ? (existing.promiseDate || '') : ''}" class="input-field py-1.5 text-xs" />
      </div>

      <div><label class="font-bold block mb-1">ملاحظة على الفاتورة / العرض</label><input id="invNote" value="${existing ? (existing.note || '') : ''}" class="input-field" placeholder="رقم إذن التسليم / شروط السداد..." /></div>

      <div class="subtle-box p-3 rounded-xl space-y-1.5">
        <div class="flex items-center justify-between"><label class="font-bold">📸 إرفاق صورة إيصال تسليم / توقيع العميل</label>${tempInvoicePhoto ? `<button type="button" onclick="tempInvoicePhoto=''; document.getElementById('invPhotoPreview').innerHTML='';" class="text-red-600 text-[11px] font-bold border-0" style="background:transparent;">حذف</button>` : ''}</div>
        <input type="file" accept="image/*" capture="environment" onchange="handleInvoicePhotoSelect(this)" class="text-xs w-full" />
        <div id="invPhotoStats" class="text-[11px] text-brand-dyn font-bold"></div>
        <div id="invPhotoPreview">${tempInvoicePhoto ? `<img src="${tempInvoicePhoto}" class="h-24 rounded-xl border mt-1 object-cover" />` : ''}</div>
      </div>

      <div id="invGuardBox" class="hidden bg-red-50 text-red-800 p-3 rounded-xl text-[11px] font-bold border"></div>

      <div class="bg-brand-soft-dyn p-3 rounded-xl space-y-1.5 text-xs">
        <div class="flex items-center justify-between text-muted-dyn"><span>الرصيد السابق للعميل:</span><strong id="invPrevBalDisplay">${fmtMoney(getDraftCustomerPrevBalance(targetCust))}</strong></div>
        <div class="flex items-center justify-between"><span>صافي الفاتورة الحالية:</span><strong id="invTotalDisplay">${fmtMoney(initialTotal)}</strong></div>
        <div class="flex items-center justify-between border-t pt-1"><span>إجمالي الرصيد (السابق + الفاتورة):</span><strong id="invTotBalDisplay">${fmtMoney(getDraftCustomerPrevBalance(targetCust) + initialTotal)}</strong></div>
        <div class="flex items-center justify-between text-amber-800"><span>باقي الفاتورة الحالية:</span><strong id="invRemDisplay">${fmtMoney(modeVal === 'cash' ? 0 : Math.max(0, initialTotal - (modeVal === 'partial' ? Number(existing?.paidAmount || 0) : 0)))}</strong></div>
        <div class="flex items-center justify-between text-red-700 font-black border-t pt-1 text-sm"><span>إجمالي باقي المديونية المستحقة:</span><span id="invTotDebtDisplay">${fmtMoney(getDraftCustomerPrevBalance(targetCust) + initialTotal - (modeVal === 'cash' ? initialTotal : (modeVal === 'partial' ? Number(existing?.paidAmount || 0) : 0)))}</span></div>
      </div>

async function convertQuoteToInvoice(quoteId) {
  const q = (state.data.quotes || []).find(x => x.id === quoteId);
  if (!q) return;
  const cfg = getAppConfig();
  for (const row of q.items) {
    const totalOut = Number(row.qty) + Number(row.bonusQty || 0);
    if (!cfg.allowZeroStockSale && totalOut > getStockQty(q.warehouseId, row.productId)) return showToast(`الرصيد لا يكفي للصنف (${row.name})`);
  }
  const invNum = 'INV-' + (1001 + state.data.invoices.length);
  for (const it of q.items) await adjustStock(q.warehouseId, it.productId, -(Number(it.qty) + Number(it.bonusQty || 0)), 'فاتورة بيع', `${invNum} (محول من عرض سعر)`);
  const gpsStamp = await getQuickGpsStamp();
  await putRecord('invoices', {
    id: uid('inv'), number: invNum, date: todayStr(0), customerId: q.customerId, warehouseId: q.warehouseId,
    paymentMode: 'credit', paidAmount: 0, promiseDate: '', subtotalBeforeDiscount: q.subtotalBeforeDiscount || q.total,
    discountAmount: q.discountAmount || 0, taxAmount: q.taxAmount || 0, total: q.total, note: q.note, photo: '', gpsStamp, items: q.items
  });
  await deleteRecord('quotes', quoteId);
  await logAudit('اعتماد عرض سعر', invNum, `تحويل العرض ${q.number} إلى فاتورة بقيمة ${q.total}`, gpsStamp);
  await loadAllData();
  state.salesTab = 'invoices';
  render();
  showToast(`تم اعتماد عرض السعر وتحويله إلى فاتورة ${invNum}`);

async function submitInvoice(bypassGuard) {
  const cfg = getAppConfig();
  const customerId = await resolveSelectedOrNewCustomer('invCust', 'invCustSearch');
  if (!customerId) return showToast('اكتب أو اختر اسم العميل أولاً');
  const warehouseId = document.getElementById('invWh').value;
  const mode = document.getElementById('invMode').value;
  const promiseDate = mode === 'cash' ? '' : (document.getElementById('invPromiseDate')?.value || '');
  const note = document.getElementById('invNote').value.trim();
  const { sub, discAmt, taxAmt, netTotal } = computeDraftInvoiceTotals();
  if (netTotal <= 0) return showToast('يرجى إدخال كميات وأسعار صحيحة');

  let paidAmount = 0;
  if (mode === 'cash') paidAmount = netTotal;
  else if (mode === 'partial') paidAmount = Math.min(netTotal, Number(document.getElementById('invPaidAmt').value || 0));

  const oldInvoice = editingInvoiceId ? state.data.invoices.find(x => x.id === editingInvoiceId) : null;

  if (!cfg.allowZeroStockSale) {
    for (const row of draftInvoiceItems) {
      let avail = getStockQty(warehouseId, row.productId);
      if (oldInvoice && oldInvoice.warehouseId === warehouseId) {
        avail += oldInvoice.items.filter(i => i.productId === row.productId).reduce((s, i) => s + Number(i.qty) + Number(i.bonusQty || 0), 0);
      }
      const reqQty = Number(row.qty) + Number(row.bonusQty || 0);
      if (reqQty > avail) {
        const p = state.data.products.find(x => x.id === row.productId);
        return showToast(`الرصيد لا يكفي للصنف (${p?.name}) — المتاح: ${avail}`);
      }
    }
  }

  const cust = state.data.customers.find(c => c.id === customerId);
  let currentBal = getCustomerBalance(customerId);
  if (oldInvoice && oldInvoice.customerId === customerId) currentBal -= (Number(oldInvoice.total) - Number(oldInvoice.paidAmount || 0));
  const projectedBal = currentBal + (netTotal - paidAmount);
  const hasOverdue = state.data.invoices.some(i => i.id !== editingInvoiceId && i.customerId === customerId && (i.total - i.paidAmount) > 0 && i.date < todayStr(-cfg.overdueDays));

  if (!bypassGuard && (netTotal - paidAmount) > 0 && ((cust.creditLimit > 0 && projectedBal > cust.creditLimit) || hasOverdue)) {
    const box = document.getElementById('invGuardBox');
    box.classList.remove('hidden');
    box.innerHTML = `<div>⚠️ تحذير حارس الائتمان:</div><div>${projectedBal > cust.creditLimit ? `• الرصيد بعد الفاتورة (${fmtMoney(projectedBal)}) سيتخطى الحد الائتماني (${fmtMoney(cust.creditLimit)}).` : ''}</div><div>${hasOverdue ? `• العميل لديه فواتير آجلة متأخرة لأكثر من ${cfg.overdueDays} يوماً.` : ''}</div><button type="button" onclick="submitInvoice(true)" class="mt-2 bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs border-0">تأكيد الاعتماد رغم التحذير</button>`;
    return;
  }

  const invNumber = oldInvoice ? oldInvoice.number : ('INV-' + (1001 + state.data.invoices.length));
  if (oldInvoice) {
    for (const oldIt of oldInvoice.items) await adjustStock(oldInvoice.warehouseId, oldIt.productId, Number(oldIt.qty) + Number(oldIt.bonusQty || 0), 'تسوية تعديل فاتورة', invNumber);
  }

  const items = draftInvoiceItems.map(row => {
    const p = state.data.products.find(x => x.id === row.productId);
    return { productId: row.productId, name: p ? p.name : '', qty: Number(row.qty), bonusQty: Number(row.bonusQty || 0), price: Number(row.price), subtotal: Number(row.qty) * Number(row.price) };
  });

  for (const it of items) await adjustStock(warehouseId, it.productId, -(Number(it.qty) + Number(it.bonusQty || 0)), 'فاتورة بيع', `${invNumber} - ${cust?.name || ''}`);

  const gpsStamp = oldInvoice?.gpsStamp || await getQuickGpsStamp();

  await putRecord('invoices', {
    id: oldInvoice ? oldInvoice.id : uid('inv'), number: invNumber, date: oldInvoice ? oldInvoice.date : todayStr(0),
    customerId, warehouseId, paymentMode: mode, paidAmount, promiseDate, subtotalBeforeDiscount: sub,
    discountAmount: discAmt, taxAmount: taxAmt, total: netTotal, note, photo: tempInvoicePhoto, gpsStamp, items
  });

  await logAudit(oldInvoice ? 'تعديل فاتورة' : 'إنشاء فاتورة', invNumber, `العميل: ${cust?.name || ''} | الصافي: ${netTotal}`, gpsStamp);
  editingInvoiceId = '';
  await loadAllData();
  closeModal();
  render();
  showToast(oldInvoice ? 'تم تعديل الفاتورة وتسوية المخزن والحسابات' : 'تم اعتماد الفاتورة وتحديث المخزن والحسابات');
}

}

    inv.items.slice(0, 7).forEach(it => {

      ctx.fillText(`• ${it.name} (×${it.qty})`, 700, y);
      ctx.textAlign = 'left'; ctx.fillText(`${it.subtotal.toLocaleString()} ج.م`, 60, y); ctx.textAlign = 'right'; y += 42;
    });
    ctx.fillStyle = '#E0EFE6'; ctx.fillRect(40, 640, 680, 235);
    ctx.font = 'bold 17px Cairo, Tahoma, sans-serif'; ctx.fillStyle = '#121E17';
    ctx.fillText(`الرصيد السابق: ${fmtMoney(snap.prevBalance)}   |   الفاتورة الحالية: ${fmtMoney(snap.invTotal)}`, 700, 680);
    ctx.fillStyle = '#0E5A36'; ctx.font = 'bold 19px Cairo, Tahoma, sans-serif';
    ctx.fillText(`إجمالي الرصيد (السابق + الفاتورة): ${fmtMoney(snap.totalBalance)}`, 700, 725);
    ctx.font = 'bold 17px Cairo, Tahoma, sans-serif'; ctx.fillStyle = '#121E17';
    ctx.fillText(`المدفوع: ${fmtMoney(snap.paid)}   |   باقي الفاتورة: ${fmtMoney(snap.invRem)}`, 700, 770);
    ctx.fillStyle = '#B91C1C'; ctx.font = 'bold 22px Cairo, Tahoma, sans-serif';
    ctx.fillText(`إجمالي باقي المديونية المستحقة: ${fmtMoney(snap.totalRemainingDebt)}`, 700, 825);
  } else {
    const p = state.data.payments.find(x => x.id === recordId);
    if (!p) return;
    const c = state.data.customers.find(x => x.id === p.customerId);
    ctx.fillText('سند استلام نقدية / تحصيل من عميل', 720, 96);
    ctx.fillStyle = '#F4F7F5'; ctx.fillRect(40, 180, 680, 520);
    ctx.fillStyle = '#121E17'; ctx.font = 'bold 22px Cairo, Tahoma, sans-serif';
    ctx.fillText(`استلمنا من السيد / ${c ? c.name : '-'}`, 690, 250);
    ctx.fillStyle = '#0E5A36'; ctx.font = 'bold 34px Cairo, Tahoma, sans-serif';
    ctx.fillText(`مبلغ وقدره: ${fmtMoney(p.amount)}`, 690, 330);
    ctx.fillStyle = '#121E17'; ctx.font = 'bold 19px Cairo, Tahoma, sans-serif';

  }

  canvas.toBlob(async (blob) => {
    const file = new File([blob], `Receipt_${Date.now()}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: cfg.companyName }); return; } catch (e) {}
    }

    const a = document.createElement('a'); a.href = url; a.download = `Receipt_${todayStr(0)}.png`;

  }, 'image/png');
}

async function savePayment(id = '', linkedInvId = '') {
  const amount = Number(document.getElementById('payAmt').value || 0);
  if (amount <= 0) return showToast('أدخل مبلغاً صحيحاً');
  const custId = await resolveSelectedOrNewCustomer('payCust', 'payCustSearch');
  if (!custId) return showToast('اختر أو اكتب اسم العميل أولاً');
  const existing = state.data.payments.find(x => x.id === id);
  const gpsStamp = await getQuickGpsStamp();
  await putRecord('payments', { id: id || uid('pay'), date: existing ? existing.date : todayStr(0), customerId: custId, amount, method: document.getElementById('payMethod').value, note: document.getElementById('payNote').value.trim() });

  if (linkedInvId) {
    const inv = state.data.invoices.find(x => x.id === linkedInvId);
    if (inv) { inv.promiseDate = ''; await putRecord('invoices', inv); }
  }

  await logAudit(id ? 'تعديل تحصيل' : 'سند تحصيل', custId, `المبلغ: ${amount}`, gpsStamp);
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ التحصيل وإضافته للخزينة');
}

async function deletePaymentRecord(id) {
  if (isRepRestricted()) return showToast('الحذف مقفول في وضع المندوب الميداني');
  const p = state.data.payments.find(x => x.id === id);

  const snapshot = { ...p };

  await loadAllData();

  showToast('تم حذف سند التحصيل', async () => { await putRecord('payments', snapshot); await loadAllData(); render(); showToast('تم استرجاع سند التحصيل'); });
}

async function saveReturn() {
  const qty = Number(document.getElementById('retQty').value || 0), price = Number(document.getElementById('retPrice').value || 0);
  const productId = document.getElementById('retProd').value, warehouseId = document.getElementById('retWh').value;

  await putRecord('returns', { id: uid('ret'), date: todayStr(0), customerId: document.getElementById('retCust').value, warehouseId, productId, productName: p ? p.name : '', qty, price, total: qty * price, refundCash: document.getElementById('retRefundCash').checked, reason: document.getElementById('retReason').value.trim() });

async function inlineQuickStockStep(whId, prodId, delta) {
  if (isRepRestricted()) return showToast('التعديل السريع مقفول في وضع المندوب');
  const cur = getStockQty(whId, prodId);
  if (delta < 0 && cur <= 0) return;
  await adjustStock(whId, prodId, delta, 'تسوية سريعة (+/-)', delta > 0 ? 'زيادة جرد سريعة' : 'خصم عينة / تالف سريع');
  await loadAllData();
  render();
  showToast(delta > 0 ? 'تمت إضافة +1 للرصيد' : 'تم خصم -1 من الرصيد');
}

function detectCropTemplateKey() {
  const txt = ((document.getElementById('pCategory')?.value || '') + ' ' + (document.getElementById('pName')?.value || '')).toLowerCase();
  if (txt.includes('كوسة') || txt.includes('squash') || txt.includes('sq')) return 'squash';
  if (txt.includes('خيار') || txt.includes('cucumber') || txt.includes('cu')) return 'cucumber';
  if (txt.includes('طماطم') || txt.includes('tomato') || txt.includes('tm')) return 'tomato';
  if (txt.includes('فلفل') || txt.includes('شطة') || txt.includes('pepper') || txt.includes('pp')) return 'pepper';
  if (txt.includes('قرنبيط') || txt.includes('بروكلي') || txt.includes('cauliflower')) return 'cauliflower';
  return 'squash';
}

async function handleProductPhotoSelect(input) {
  if (!input.files || input.files.length === 0) return;
  const stats = document.getElementById('prodPhotoStats');
  stats.textContent = `جاري معالجة وضغط ${input.files.length} صورة...`;
  for (const file of Array.from(input.files)) {
    const res = await compressImageFile(file, true);
    tempProductPhotos.push(res.dataUrl);
  }
  stats.textContent = `✓ تم إرفاق الصور بنجاح (الإجمالي: ${tempProductPhotos.length} صورة)`;
  renderProductPhotosGrid();
}

async function saveProduct(id = '') {
  const name = document.getElementById('pName').value.trim();
  const code = document.getElementById('pCode').value.trim() || ('PRD-' + (state.data.products.length + 1));
  if (!name) return showToast('أدخل اسم الصنف');
  const existing = state.data.products.find(x => x.id === id) || {};
  const targetId = id || uid('prd');
  await putRecord('products', {
    ...existing,
    id: targetId,
    code,
    category: (document.getElementById('pCategory')?.value || '').trim(),
    name,
    unit: document.getElementById('pUnit').value.trim() || 'باكت',
    batchNo: document.getElementById('pBatch').value.trim(),
    expiryDate: document.getElementById('pExpiry').value,
    cost: Number(document.getElementById('pCost').value || 0),
    price: Number(document.getElementById('pPrice').value || 0),
    minQty: Number(document.getElementById('pMin').value || 5),
    earliness: (document.getElementById('pEarliness')?.value || '').trim(),
    fruitSpecs: (document.getElementById('pFruitSpecs')?.value || '').trim(),
    diseaseResistance: (document.getElementById('pDiseaseRes')?.value || '').trim(),
    plantingSeason: (document.getElementById('pSeason')?.value || '').trim(),
    specs: document.getElementById('pSpecs').value.trim(),
    photos: [...tempProductPhotos],
    photo: tempProductPhotos[0] || ''
  });
  if (!id) {
    const initQty = Number(document.getElementById('pInitQty')?.value || 0);
    const initWh = document.getElementById('pInitWh')?.value;
    if (initQty > 0 && initWh) await adjustStock(initWh, targetId, initQty, 'رصيد افتتاحي', name);
  }
  await logAudit(id ? 'تعديل صنف' : 'إضافة صنف', code, name);
  await loadAllData();
  closeModal();
  render();
  showToast('تم حفظ بيانات الصنف وصور الكتالوج بنجاح');
}

async function deleteProductSafe(productId) {
  if (isRepRestricted()) return showToast('الحذف مقفول في وضع المندوب');
  if (state.data.invoices.some(inv => inv.items.some(it => it.productId === productId))) return showToast('لا يمكن حذف صنف مستخدم في فواتير سابقة');
  const p = state.data.products.find(x => x.id === productId);
  await deleteRecord('products', productId);
  for (const s of state.data.stock.filter(x => x.productId === productId)) await deleteRecord('stock', s.id);
  await logAudit('حذف صنف', p?.code || productId, p?.name || '');
  await loadAllData();
  render();
  showToast('تم حذف الصنف وأرصدته');
}

async function applyStockAdjustment() {
  const wh = document.getElementById('adjWh').value, prod = document.getElementById('adjProd').value;
  const actual = Math.max(0, Number(document.getElementById('adjActualQty').value || 0)), reason = document.getElementById('adjReason').value;

  if (delta === 0) return showToast('الرصيد الفعلي مطابق للمسجل حالياً');
  await adjustStock(wh, prod, delta, 'تسوية جردية', `${reason} (من ${cur} إلى ${actual})`);

  render();

  openModal(`
    <div class="flex items-center justify-between mb-3"><h3 class="font-extrabold text-base text-brand-dyn">🌱 حاسبة البذور والمساحات الزراعية</h3><button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button></div>
    <div class="space-y-3 text-xs">

      <div class="grid grid-cols-2 gap-2"><div><label class="font-bold block mb-1">عرض المصطبة / الخط (متر)</label><input id="calcRowWidth" type="number" inputmode="decimal" step="0.1" value="1.5" oninput="computeSeedCalc()" class="input-field" /></div><div><label class="font-bold block mb-1">المسافة بين الجور (سم)</label><input id="calcPlantSpace" type="number" inputmode="numeric" value="50" oninput="computeSeedCalc()" class="input-field" /></div></div>
      <div id="seedCalcResultBox" class="bg-brand-soft-dyn p-3.5 rounded-2xl space-y-1 text-center"></div>
      <button onclick="transferCalcToInvoice()" class="btn-primary w-full py-3 text-sm">🧾 تحويل الكمية لفاتورة بيع مباشرة</button>
    </div>
  `);
  computeSeedCalc();
}

let lastCalculatedPacks = 1;
function computeSeedCalc() {
  const feddan = Math.max(0.1, Number(document.getElementById('calcFeddan')?.value || 1));
  const rowW = Math.max(0.3, Number(document.getElementById('calcRowWidth')?.value || 1.5));
  const spaceCm = Math.max(10, Number(document.getElementById('calcPlantSpace')?.value || 50));
  const perPack = Math.max(50, Number(document.getElementById('calcSeedsPerPack')?.value || 500));
  const plants = Math.round((feddan * 4200) / (rowW * (spaceCm / 100)));
  const withSafety = Math.ceil(plants * 1.1);
  const packs = Math.max(1, Math.ceil(withSafety / perPack));
  lastCalculatedPacks = packs;
  const box = document.getElementById('seedCalcResultBox');
  if (box) box.innerHTML = `<div class="text-[11px] text-muted-dyn">إجمالي النباتات المطلوبة (+10% أمان): <strong>${withSafety.toLocaleString()} شتلة</strong></div><div class="text-lg font-black text-brand-dyn">الكمية المطلوبة: ${packs} باكت</div>`;
}

    return showToast('⚠️ وضع الكاميرا الحية مفعّل: يرجى التقاط صورة مباشرة الآن');
  }
  const stats = document.getElementById('photoCompressStats');
  stats.textContent = 'جاري ضغط الصورة...';
  const res = await compressImageFile(file);
  tempCompressedPhoto = res.dataUrl;
  stats.textContent = `✓ تم الضغط: قبل ${res.origKB} KB ← بعد ${res.compKB} KB`;
}

async function saveVisit(editId = '', openInvoiceAfter = false) {
  const notes = document.getElementById('vNotes').value.trim();
  if (!notes) return showToast('أدخل ملاحظات الزيارة');
  const stationId = document.getElementById('vStation').value, customerId = document.getElementById('vCust').value;
  const existing = state.data.visits.find(x => x.id === editId) || {};
  const visitDate = existing.date || todayStr(0);

  const checkedBoxes = Array.from(document.querySelectorAll('.v-trial-chk:checked'));
  const inspectedTrials = Array.isArray(existing.inspectedTrials) && checkedBoxes.length === 0 ? existing.inspectedTrials : [];

  for (const chk of checkedBoxes) {
    const trialId = chk.value;
    const trial = state.data.trials.find(t => t.id === trialId);
    if (!trial) continue;
    const newStage = document.getElementById(`vtStage_${trialId}`)?.value || trial.stage || 'نمو خضري';
    const newScore = Math.min(5, Math.max(1, Number(document.getElementById(`vtScore_${trialId}`)?.value || calcTrialAvg(trial.scores))));
    const itemNote = document.getElementById(`vtNote_${trialId}`)?.value.trim() || notes;
    inspectedTrials.push({ trialId: trial.id, code: trial.code, hybridName: trial.hybridName, stage: newStage, avgScore: newScore, note: itemNote });
    const history = Array.isArray(trial.history) ? [...trial.history] : [];
    history.push({ date: visitDate, stage: newStage, avgScore: newScore, notes: itemNote, photo: tempCompressedPhoto || '' });
    trial.stage = newStage;
    trial.scores = { earliness: newScore, vigor: newScore, yield: newScore, tolerance: newScore };
    trial.notes = itemNote;
    trial.history = history;
    await putRecord('trials', trial);
  }

  const gpsStamp = existing.gpsStamp || await getQuickGpsStamp();
  await putRecord('visits', {
    ...existing, id: editId || uid('vis'), date: visitDate, customerId, stationId,
    crop: document.getElementById('vCrop').value.trim(), nextFollowUp: document.getElementById('vNext').value,
    followUpDone: false, inspectedTrials, notes, photo: tempCompressedPhoto, gpsStamp
  });
  await logAudit(editId ? 'تعديل زيارة' : 'تسجيل زيارة ميدانية', stationId || customerId || 'زيارة', notes.slice(0, 60), gpsStamp);
  await loadAllData(); closeModal(); render(); showToast('تم حفظ الزيارة وتحديث السجل');
  if (openInvoiceAfter) openInvoiceModal('', customerId);
}

// ==================== TRIALS & STATIONS (CROP GROUPING + SUSPEND/RESUME + LARGE POOLS) ====================
function calcTrialAvg(scores) { if (!scores) return 0; return ([scores.earliness, scores.vigor, scores.yield, scores.tolerance].map(Number).reduce((a, b) => a + b, 0) / 4); }
function getStationLastVisitDays(stationId) {
  const stVisits = state.data.visits.filter(v => v.stationId === stationId);
  if (stVisits.length === 0) return 999;
  return Math.max(0, Math.floor((Date.now() - new Date(stVisits.map(v => v.date).sort().reverse()[0]).getTime()) / 86400000));
}
function getStationStatusBadge(status) {
  if (status === 'paused') return `<span class="badge-pill bg-amber-100 text-amber-800">⏸️ متوقفة</span>`;
  if (status === 'closed') return `<span class="badge-pill bg-gray-200 text-gray-700">🏁 منتهية</span>`;
  return `<span class="badge-pill bg-emerald-100 text-emerald-800">🟢 نشطة</span>`;
}

function getTrialCropLabel(t) {
  if (t.cropType && t.cropType.trim()) return t.cropType.trim();
  const sta = state.data.stations.find(s => s.id === t.stationId);
  if (sta && sta.crop) {
    const firstWord = sta.crop.trim().split(/\s+/)[0];
    if (firstWord) return firstWord;
  }
  const name = (t.hybridName || '').toLowerCase();
  if (name.includes('كوسة') || name.includes('squash')) return 'كوسة';
  if (name.includes('خيار') || name.includes('cucumber')) return 'خيار';
  if (name.includes('طماطم') || name.includes('tomato')) return 'طماطم';
  if (name.includes('فلفل') || name.includes('pepper')) return 'فلفل';
  return 'أصناف متنوعة';
}

function getAllTrialCrops() {
  const set = new Set();
  (state.data.trials || []).forEach(t => set.add(getTrialCropLabel(t)));
  return Array.from(set);
}

async function toggleTrialSuspended(trialId) {
  const t = state.data.trials.find(x => x.id === trialId);
  if (!t) return;
  t.suspended = !t.suspended;
  await putRecord('trials', t);
  await logAudit(t.suspended ? 'إيقاف صنف تجربة' : 'تشغيل صنف تجربة', `[${t.code}] ${t.hybridName}`, t.suspended ? 'تم إيقاف الصنف مؤقتاً' : 'تم إعادة تشغيل الصنف');
  await loadAllData();
  render();
  showToast(t.suspended ? `تم إيقاف الصنف [${t.code}] لحين الحاجة` : `تم إعادة تشغيل الصنف [${t.code}]`);
}

async function deleteTrialRecord(trialId) {
  if (isRepRestricted()) return showToast('الحذف مقفول في وضع المندوب');
  const t = state.data.trials.find(x => x.id === trialId);
  if (!t) return;
  const snapshot = JSON.parse(JSON.stringify(t));
  await deleteRecord('trials', trialId);
  await loadAllData(); render();
  showToast(`تم حذف كود التجربة ${snapshot.code}`, async () => { await putRecord('trials', snapshot); await loadAllData(); render(); showToast('تم استرجاع كود التجربة'); });

async function graduateTrialToCatalog(trialId) {
  const t = state.data.trials.find(x => x.id === trialId);
  if (!t) return;
  const sta = state.data.stations.find(s => s.id === t.stationId);
  const trialPhotos = (Array.isArray(t.history) ? t.history : []).map(h => h.photo).filter(Boolean);
  const avg = calcTrialAvg(t.scores).toFixed(1);
  const cropCat = getTrialCropLabel(t);

  const existingProd = state.data.products.find(p => p.code.toLowerCase() === t.code.toLowerCase() || p.id === t.productId);
  const noteBullets = [
    t.notes ? t.notes : '',
    sta ? `تم اختباره وتقييمه ميدانياً في ${sta.name} بتقييم ${avg}/5` : `تقييم ميداني معتمد: ${avg}/5`
  ].filter(Boolean).join('\n');

  if (existingProd) {
    if (trialPhotos.length > 0) {
      const merged = [...getProductPhotos(existingProd), ...trialPhotos].slice(0, 5);
      existingProd.photos = merged;
      existingProd.photo = merged[0] || '';
    }
    if (!existingProd.specs && noteBullets) existingProd.specs = noteBullets;
    await putRecord('products', existingProd);
    await logAudit('تحديث صنف من التجارب', existingProd.code, existingProd.name);
    await loadAllData();
    closeModal();
    navigate('catalog');
    showToast(`تم تحديث الصنف (${existingProd.name}) بالصور والبيانات الحقلية في الكتالوج`);
  } else {
    const newProd = {
      id: uid('prd'),
      code: t.code,
      category: cropCat !== 'أصناف متنوعة' ? `بذور ${cropCat}` : '',
      name: t.hybridName,
      unit: 'باكت',
      cost: 0,
      price: 0,
      minQty: 10,
      earliness: '',
      fruitSpecs: '',
      diseaseResistance: '',
      plantingSeason: '',
      specs: noteBullets,
      photos: trialPhotos.slice(0, 5),
      photo: trialPhotos[0] || ''
    };
    await putRecord('products', newProd);
    await logAudit('ترقية هجين للكتالوج', newProd.code, newProd.name);
    await loadAllData();
    closeModal();
    openProductModal(newProd.id);
    showToast('تم نقل الصنف والصور الحقلية — حدد السعر وراجع المواصفات');
  }
}

async function saveTrial(id = '') {
  const code = document.getElementById('tCode').value.trim(), hybridName = document.getElementById('tName').value.trim();
  if (!code || !hybridName) return showToast('أدخل كود واسم الهجين');
  const existing = state.data.trials.find(x => x.id === id) || {};
  if (!id) {
    const sampleProd = document.getElementById('tSampleProd')?.value || '', sampleQty = Number(document.getElementById('tSampleQty')?.value || 0);
    if (sampleProd && sampleQty > 0 && state.data.warehouses[0]) await adjustStock(state.data.warehouses[0].id, sampleProd, -sampleQty, 'صرف عينة تجربة', `كود ${code}`);
  }
  const stage = document.getElementById('tStage').value;
  const scores = { earliness: Math.min(5, Math.max(1, Number(document.getElementById('scEar').value || 3))), vigor: Math.min(5, Math.max(1, Number(document.getElementById('scVig').value || 3))), yield: Math.min(5, Math.max(1, Number(document.getElementById('scYld').value || 3))), tolerance: Math.min(5, Math.max(1, Number(document.getElementById('scTol').value || 3))) };
  const notes = document.getElementById('tNotes').value.trim(), avg = calcTrialAvg(scores);
  const history = Array.isArray(existing.history) ? [...existing.history] : [];
  history.push({ date: todayStr(0), stage, avgScore: avg, notes: notes || 'تحديث الصنف' });
  await putRecord('trials', {
    ...existing,
    id: id || uid('trl'),
    code,
    cropType: (document.getElementById('tCropType')?.value || '').trim(),
    hybridName,
    stationId: document.getElementById('tStation').value,
    productId: document.getElementById('tInvPick').value || existing.productId || '',
    competitor: document.getElementById('tComp').value.trim(),
    plantingDate: existing.plantingDate || todayStr(0),
    suspended: !!existing.suspended,
    stage,
    scores,
    notes,
    history
  });
  await loadAllData(); closeModal(); render(); showToast('تم حفظ الصنف وتحديث سجل المحطة');
}

}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportErpAccountingPackage() {
  let csv = '\uFEFFنوع_القيد,المرجع,التاريخ,الطرف_العميل_أو_البند,مدين_أو_قيمة,دائن_أو_مدفوع,ملاحظات\n';
  state.data.invoices.forEach(i => { const c = state.data.customers.find(x => x.id === i.customerId); csv += `"فاتورة_مبيعات","${i.number}","${i.date}","${c?.name || ''}",${i.total},${i.paidAmount || 0},"${i.note || ''}"\n`; });
  state.data.payments.forEach(p => { const c = state.data.customers.find(x => x.id === p.customerId); csv += `"سند_تحصيل","${p.id}","${p.date}","${c?.name || ''}",0,${p.amount},"${p.method} - ${p.note || ''}"\n`; });
  state.data.expenses.forEach(e => { csv += `"مصروف_ميداني","${e.id}","${e.date}","${e.category}",${e.amount},0,"${e.note || ''}"\n`; });
  downloadFile(csv, `ERP_Accounting_Ledger_${todayStr(0)}.csv`, 'text/csv;charset=utf-8;');

    </div>

    <!-- 7. Security PIN, Biometrics & Auto-Lock -->
    ${!isRep ? `
      <div class="m3-card p-4 space-y-3 text-xs">
        <div class="font-extrabold text-sm text-brand-dyn">🔒 قفل الحماية والبصمة (PIN & Biometrics)</div>

        <div class="flex items-center justify-between gap-2"><span>قفل تلقائي عند الخمول:</span><select id="cfgAutoLock" onchange="saveAutoLockSetting(this.value)" class="input-field w-36 py-1.5 text-xs"><option value="0" ${cfg.autoLockMinutes===0?'selected':''}>معطّل</option><option value="5" ${cfg.autoLockMinutes===5?'selected':''}>بعد 5 دقائق</option><option value="15" ${cfg.autoLockMinutes===15?'selected':''}>بعد 15 دقيقة</option></select></div>
        <div class="flex gap-2"><input id="newPinInput" maxlength="4" type="tel" inputmode="numeric" value="${cfg.pinCode}" class="input-field" placeholder="4 أرقام" /><button onclick="updatePinCode()" class="btn-tonal shrink-0">تحديث الرمز</button></div>
      </div>
    ` : ''}

    <!-- 8. System Health & QA Diagnostics -->
    <div class="m3-card p-4 space-y-2.5 text-xs">
      <div class="flex items-center justify-between"><div class="font-extrabold text-sm text-brand-dyn">🩺 فحص صحة النظام والذاكرة (QA)</div><button onclick="openSystemHealthModal()" class="btn-tonal text-[11px] py-1 px-2.5 min-h-0">فحص شامل</button></div>

        ${audits.length === 0 ? `<p class="text-[11px] text-muted-dyn">لا توجد عمليات مسجلة في سجل التدقيق بعد.</p>` :

function downloadCsvTemplate(type) {
  if (type === 'customers') downloadFile('\uFEFFالاسم,الموبايل,المنطقة,الرصيد_الافتتاحي,الحد_الائتماني\nمشتل الهدى,01000000000,كفر سعد,0,15000\n', 'قالب_استيراد_العملاء.csv', 'text/csv;charset=utf-8;');
  else downloadFile('\uFEFFالكود,اسم_الصنف,الوحدة,التكلفة,سعر_البيع,حد_الطلب,الكمية_الافتتاحية\nAP-NEW-01,هجين كوسة جديد,باكت,400,500,10,20\n', 'قالب_استيراد_الأصناف.csv', 'text/csv;charset=utf-8;');
}

async function importCsvBulk(input, type) {
  if (!input.files || !input.files[0]) return;
  const text = await input.files[0].text();
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return showToast('الملف فارغ');
  let count = 0;
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
    if (type === 'customers' && cols[0]) {
      await putRecord('customers', { id: uid('cust'), name: cols[0], phone: cols[1] || '', area: cols[2] || '', openingBalance: Number(cols[3] || 0), creditLimit: Number(cols[4] || 15000), notes: 'مستورد من CSV', photo: '', lat: '', lng: '' });
      count++;
    } else if (type === 'products' && cols[1]) {
      const pid = uid('prd');
      await putRecord('products', { id: pid, code: cols[0] || ('PRD-' + i), name: cols[1], unit: cols[2] || 'باكت', cost: Number(cols[3] || 0), price: Number(cols[4] || 0), minQty: Number(cols[5] || 10) });
      const initQ = Number(cols[6] || 0);
      if (initQ > 0 && state.data.warehouses[0]) await adjustStock(state.data.warehouses[0].id, pid, initQ, 'استيراد CSV', cols[1]);
      count++;
    }
  }
  await logAudit('استيراد CSV', type, `تم استيراد ${count} سجل`);
  await loadAllData(); render(); showToast(`تم استيراد ${count} سجل بنجاح`);
}

function openSystemHealthModal() {
  const jsonBytes = new Blob([JSON.stringify(state.data)]).size, sizeKB = Math.round(jsonBytes / 1024);
  const photoCount = state.data.visits.filter(v => v.photo).length + state.data.invoices.filter(i => i.photo).length + state.data.customers.filter(c => c.photo).length + state.data.products.filter(p => p.photo).length;
  openModal(`
    <div class="flex items-center justify-between mb-3"><h3 class="font-extrabold text-base text-brand-dyn">🩺 تقرير فحص صحة النظام (QA)</h3><button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button></div>
    <div class="space-y-2.5 text-xs">
      <div class="subtle-box p-3 rounded-xl flex justify-between"><span>حماية الذاكرة الدائمة (Persistent Storage):</span><strong class="${isStoragePersisted ? 'text-brand-dyn' : 'text-amber-700'}">${isStoragePersisted ? '🟢 محمية من المسح' : '🟡 قياسية'}</strong></div>
      <div class="subtle-box p-3 rounded-xl flex justify-between"><span>حجم قاعدة البيانات المحلية:</span><strong>${sizeKB} KB</strong></div>
      <div class="subtle-box p-3 rounded-xl flex justify-between"><span>عدد الصور المرفقة المضغوطة:</span><strong>${photoCount} صورة</strong></div>
      <div class="subtle-box p-3 rounded-xl flex justify-between"><span>سلامة أرصدة الخزينة:</span><strong class="text-brand-dyn">✓ متطابقة (${fmtMoney(getTreasuryBalance())})</strong></div>
      ${photoCount > 0 && !isRepRestricted() ? `<button onclick="purgeOldPhotosToFreeSpace()" class="btn-gold w-full py-2.5 text-xs">🧹 حذف الصور المرفقة لتسريع الذاكرة</button>` : ''}

async function purgeOldPhotosToFreeSpace() {
  for (const v of state.data.visits) { if (v.photo) { v.photo = ''; await putRecord('visits', v); } }
  for (const i of state.data.invoices) { if (i.photo) { i.photo = ''; await putRecord('invoices', i); } }
  for (const c of state.data.customers) { if (c.photo) { c.photo = ''; await putRecord('customers', c); } }
  await loadAllData(); closeModal(); render(); showToast('تم تفريغ مساحة الصور وتسريع التطبيق');

function openResetPasswordModal() {
  openModal(`
    <div class="flex items-center justify-between mb-3"><h3 class="font-extrabold text-base text-red-600">🔒 تأكيد مسح قاعدة البيانات</h3><button onclick="closeModal()" class="text-muted-dyn text-xl font-bold border-0" style="background:transparent;">✕</button></div>
    <div class="space-y-3 text-xs"><div class="bg-red-50 p-3 rounded-xl text-red-900 leading-relaxed border"><strong>تحذير نهائي:</strong> سيتم مسح جميع العملاء والفواتير والمخزون ومحطات التجارب والزيارات نهائياً.</div><div><label class="font-bold block mb-1">أدخل كلمة السر (PIN) لتأكيد المسح *</label><input id="wipePwdInput" type="password" inputmode="numeric" maxlength="4" class="input-field text-center text-lg" placeholder="••••" /></div><div id="wipePwdErr" class="text-red-600 font-bold text-[11px]"></div><div class="grid grid-cols-2 gap-2"><button onclick="closeModal()" class="btn-tonal py-2.5">إلغاء</button><button onclick="verifyAndResetDatabase()" class="bg-red-700 text-white rounded-xl font-extrabold py-2.5 border-0">تأكيد المسح</button></div></div>

async function verifyAndResetDatabase() {
  const entered = document.getElementById('wipePwdInput').value.trim(), cfg = getAppConfig();
  if (entered !== cfg.pinCode) { document.getElementById('wipePwdErr').textContent = '❌ كلمة السر غير صحيحة'; return; }
  for (const s of STORES) { if (s !== 'warehouses' && s !== 'settings') await clearStore(s); }
  await logAudit('مسح قاعدة البيانات', 'النظام بالكامل', 'إعادة تهيئة');
  await loadAllData(); closeModal(); navigate('home'); showToast('تم مسح قاعدة البيانات بنجاح');
}

async function exportFullBackup(lightMode = false, encrypted = false) {
  const cfg = getAppConfig();
  const clonedStores = JSON.parse(JSON.stringify(state.data));
  if (lightMode) {
    (clonedStores.visits || []).forEach(v => v.photo = '');
    (clonedStores.invoices || []).forEach(i => i.photo = '');
    (clonedStores.customers || []).forEach(c => c.photo = '');
    (clonedStores.products || []).forEach(p => p.photo = '');
    (clonedStores.trials || []).forEach(t => (t.history || []).forEach(h => h.photo = ''));
  }
  const rawJson = JSON.stringify(clonedStores);
  let payload;
  if (encrypted) {
    const aesObj = await aesEncryptJson(rawJson, cfg.pinCode);
    payload = { app: 'AGRI_PYRAMIDS_FIELDOS', algo: 'AES-GCM-256', encrypted: true, exportedAt: new Date().toISOString(), cipher: aesObj };
  } else {
    payload = { app: 'AGRI_PYRAMIDS_FIELDOS', encrypted: false, exportedAt: new Date().toISOString(), stores: clonedStores };
  }
  const suffix = encrypted ? 'AES256_Encrypted' : (lightMode ? 'Light' : 'Full');
  downloadFile(JSON.stringify(payload, null, 2), `FieldOS_Backup_${suffix}_${todayStr(0)}.json`, 'application/json');
  cfg.lastBackupAt = Date.now();
  await putRecord('settings', cfg); await loadAllData(); render();
  showToast(encrypted ? 'تم تصدير النسخة المشفرة بتشفير AES-256' : 'تم تصدير النسخة الاحتياطية بنجاح');
}

async function importFullBackup(input) {
  if (!input.files || !input.files[0]) return;
  const text = await input.files[0].text();
  try {
    const parsed = JSON.parse(text);
    let storesObj = parsed.stores;
    if (parsed.encrypted && parsed.cipher) {
      const cfg = getAppConfig();
      storesObj = JSON.parse(await aesDecryptJson(parsed.cipher, cfg.pinCode));
    }
    if (!storesObj) throw new Error('invalid');
    for (const s of STORES) {
      if (Array.isArray(storesObj[s])) { await clearStore(s); for (const item of storesObj[s]) await putRecord(s, item); }
    }
    await loadAllData(); render(); showToast('تمت استعادة كافة البيانات بنجاح');
  } catch {
    showToast('فشل الاستعادة — تأكد من صحة الملف أو رمز PIN لفك تشفير AES-256');
  }
}

async function togglePinLock(enabled) {
  const cfg = getAppConfig(); cfg.pinEnabled = enabled;
  await putRecord('settings', cfg); await loadAllData(); resetIdleLockTimer();
  showToast(enabled ? 'تم تفعيل قفل الحماية PIN' : 'تم إيقاف قفل الحماية');
}

async function updatePinCode() {
  const code = document.getElementById('newPinInput').value.trim();
  if (!/^\d{4}$/.test(code)) return showToast('أدخل 4 أرقام فقط');
  const cfg = getAppConfig(); cfg.pinCode = code;
  await putRecord('settings', cfg); await loadAllData(); showToast('تم تحديث الرقم السري');
}

// ==================== PIN ENTRY LOGIC ====================
let enteredPin = '';
function checkPinOnStartup() {
  const cfg = getAppConfig();
  if (cfg.pinEnabled) {
    document.getElementById('pinOverlay').classList.remove('hidden');
    document.getElementById('pinOverlay').classList.add('flex');
    const bioBtn = document.getElementById('biometricUnlockBtn');
    if (bioBtn && cfg.biometricCredId) { bioBtn.classList.remove('hidden'); bioBtn.classList.add('inline-flex'); }
  }
}

function updatePinDots() { for (let i = 0; i < 4; i++) document.getElementById('pinDot' + i).classList.toggle('bg-white', i < enteredPin.length); }

function enterPinDigit(d) {
  if (enteredPin.length >= 4) return;
  enteredPin += d; updatePinDots();
  if (enteredPin.length === 4) {
    const cfg = getAppConfig();
    if (enteredPin === cfg.pinCode) {
      document.getElementById('pinOverlay').classList.add('hidden');
      document.getElementById('pinOverlay').classList.remove('flex');
      enteredPin = ''; resetIdleLockTimer();
    } else {
      document.getElementById('pinError').textContent = 'الرمز غير صحيح';
      enteredPin = ''; setTimeout(updatePinDots, 250);
    }
  }
}

function clearPinInput() { enteredPin = ''; document.getElementById('pinError').textContent = ''; updatePinDots(); }
function backspacePin() { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }

  await requestPersistentStorage();
  await openDB();
  await loadAllData();
  await seedDemoIfNeeded();
  checkPinOnStartup();
  resetIdleLockTimer();
  applyRoute('home', false);
})();
</script>
